function drawCottage(){
  const cnv=document.getElementById('scene-canvas');
  const cw=Math.max(cnv.offsetWidth||390,1);
  const ch=Math.max(cnv.offsetHeight||Math.round(cw*0.7),1);
  cnv.width=cw; cnv.height=ch;
  const cc=cnv.getContext('2d');
  const cx=cw*0.5;

  // ── STONE BRICK WALL ──────────────────────────────
  cc.fillStyle='#0e0c09'; cc.fillRect(0,0,cw,ch);
  const bw=Math.max(28,Math.round(cw/14)), bh=Math.max(14,Math.round(ch/16));
  for(let row=0;row<Math.ceil(ch/bh);row++){
    for(let col=0;col<Math.ceil(cw/bw)+1;col++){
      const ox=row%2===0?0:Math.round(bw*0.5);
      const bx=col*bw-ox, by=row*bh;
      const v=((bx*7+by*13)>>>0)%14;
      cc.fillStyle=`rgb(${20+v},${17+v},${13+v})`;
      cc.fillRect(bx+1,by+1,bw-2,bh-2);
    }
  }

  // ── AMBIENT LIGHT ─────────────────────────────────
  // Fireplace glow (right wall)
  let gl=cc.createRadialGradient(cw*0.92,ch*0.42,0,cw*0.92,ch*0.42,cw*0.55);
  gl.addColorStop(0,'rgba(255,120,20,0.4)'); gl.addColorStop(0.5,'rgba(255,70,10,0.18)'); gl.addColorStop(1,'rgba(0,0,0,0)');
  cc.fillStyle=gl; cc.fillRect(0,0,cw,ch);
  // Moonlight (left)
  gl=cc.createRadialGradient(cw*0.08,ch*0.18,0,cw*0.08,ch*0.18,cw*0.35);
  gl.addColorStop(0,'rgba(80,100,180,0.22)'); gl.addColorStop(1,'rgba(0,0,0,0)');
  cc.fillStyle=gl; cc.fillRect(0,0,cw,ch);

  // ── WINDOW (left) ─────────────────────────────────
  const wx=Math.round(cw*0.055), wy=Math.round(ch*0.07);
  const ww=Math.round(cw*0.13), wh=Math.round(ch*0.27);
  // Outer frame stone surround
  cc.fillStyle='#221a10';
  cc.fillRect(wx-5,wy-5,ww+10,wh+10);
  // Night sky
  cc.fillStyle='#04081a';
  cc.fillRect(wx,wy,ww,wh);
  // Stars
  cc.fillStyle='#c8d0ee';
  [[0.07,0.10],[0.10,0.16],[0.16,0.09],[0.13,0.24],[0.17,0.19],[0.09,0.28]].forEach(([rx,ry])=>{
    const sx=wx+ww*rx/0.2, sy=wy+wh*ry/0.35;
    if(sx>wx&&sx<wx+ww&&sy>wy&&sy<wy+wh){cc.beginPath();cc.arc(sx,sy,0.8,0,Math.PI*2);cc.fill();}
  });
  cc.fillStyle='#d8e0f8'; cc.beginPath(); cc.arc(wx+ww*0.7,wy+wh*0.25,ww*0.14,0,Math.PI*2); cc.fill();
  cc.fillStyle='#c8d0ec'; cc.beginPath(); cc.arc(wx+ww*0.75,wy+wh*0.2,ww*0.06,0,Math.PI*2); cc.fill();
  // Window bars
  cc.strokeStyle='#2a1a0c'; cc.lineWidth=3;
  cc.beginPath();
  cc.moveTo(wx,wy+wh*0.5); cc.lineTo(wx+ww,wy+wh*0.5);
  cc.moveTo(wx+ww*0.5,wy); cc.lineTo(wx+ww*0.5,wy+wh);
  cc.stroke();
  cc.strokeStyle='#3a2a14'; cc.lineWidth=2; cc.strokeRect(wx,wy,ww,wh);

  // ── FIREPLACE (right) ─────────────────────────────
  const fpx=Math.round(cw*0.885), fpy=Math.round(ch*0.55);
  const fpw=Math.round(cw*0.1), fph=Math.round(ch*0.3);
  // Mantelpiece
  cc.fillStyle='#2a2015'; cc.fillRect(fpx-fpw*1.3,fpy-fph-4,fpw*2.6,8);
  cc.fillStyle='#1e1a10'; cc.fillRect(fpx-fpw*1.1,fpy-fph+4,fpw*2.2,4);
  // Stone arch opening
  cc.fillStyle='#1a1610';
  cc.beginPath();
  cc.moveTo(fpx-fpw,fpy);
  cc.lineTo(fpx-fpw,fpy-fph*0.6);
  cc.arc(fpx,fpy-fph*0.6,fpw,Math.PI,0);
  cc.lineTo(fpx+fpw,fpy);
  cc.closePath(); cc.fill();
  // Dark firebox
  cc.fillStyle='#090705';
  cc.beginPath();
  cc.moveTo(fpx-fpw*0.82,fpy);
  cc.lineTo(fpx-fpw*0.82,fpy-fph*0.52);
  cc.arc(fpx,fpy-fph*0.52,fpw*0.82,Math.PI,0);
  cc.lineTo(fpx+fpw*0.82,fpy);
  cc.closePath(); cc.fill();
  // Embers/glow at base
  const embGl=cc.createRadialGradient(fpx,fpy-8,0,fpx,fpy-8,fpw*0.7);
  embGl.addColorStop(0,'rgba(255,160,40,0.9)'); embGl.addColorStop(0.4,'rgba(255,80,10,0.5)'); embGl.addColorStop(1,'rgba(0,0,0,0)');
  cc.fillStyle=embGl; cc.fillRect(fpx-fpw,fpy-fpw,fpw*2,fpw);
  // Flames — three layered teardrop shapes
  [['rgba(255,200,50,0.85)',0.55],['rgba(255,120,20,0.7)',0.72],['rgba(255,240,120,0.9)',0.38]].forEach(([col,hw],i)=>{
    const flx=fpx+(i-1)*fpw*0.2, flyBase=fpy, flyTip=fpy-fph*(0.38+i*0.06);
    cc.fillStyle=col;
    cc.beginPath();
    cc.moveTo(flx-fpw*hw*0.5,flyBase);
    cc.bezierCurveTo(flx-fpw*hw*0.55,flyBase-fph*0.2,flx-fpw*hw*0.2,flyTip+fph*0.1,flx,flyTip);
    cc.bezierCurveTo(flx+fpw*hw*0.2,flyTip+fph*0.1,flx+fpw*hw*0.55,flyBase-fph*0.2,flx+fpw*hw*0.5,flyBase);
    cc.closePath(); cc.fill();
  });

  // ── SHELF UNIT (behind shopkeeper) ────────────────
  const shX=Math.round(cw*0.2), shW=Math.round(cw*0.6);
  // Shelf backing board
  cc.fillStyle='#1c1208'; cc.fillRect(shX-2,0,shW+4,ch*0.5);
  // Three shelves
  const shYs=[ch*0.1,ch*0.22,ch*0.34];
  const vcols=['#00eeff','#ff4422','#aa00ff','#00ff88','#ffaa00','#ff1166'];
  shYs.forEach((sy,row)=>{
    // Shelf board with depth
    cc.fillStyle='#4a2e14'; cc.fillRect(shX-4,sy,shW+8,6);
    cc.fillStyle='#3a2210'; cc.fillRect(shX-4,sy+6,shW+8,3);
    cc.fillStyle='#5a3818'; cc.fillRect(shX-4,sy,shW+8,2);
    // Six vials per shelf
    for(let j=0;j<6;j++){
      const vx=shX+Math.round(j*(shW-20)/5)+10, vy=sy-24, vc=vcols[(j+row*2)%6];
      // Glow halo
      const vglow=cc.createRadialGradient(vx,vy+8,0,vx,vy+8,18);
      vglow.addColorStop(0,vc+'44'); vglow.addColorStop(1,'transparent');
      cc.fillStyle=vglow; cc.fillRect(vx-16,vy-6,32,36);
      // Bottle — dark glass body (rounded with bezier)
      cc.fillStyle='#0e0e1c';
      cc.beginPath();
      cc.moveTo(vx-4,vy+16); // bottom-left
      cc.bezierCurveTo(vx-5,vy+19,vx+5,vy+19,vx+4,vy+16); // rounded bottom
      cc.lineTo(vx+4,vy+6); // right side
      cc.lineTo(vx+2,vy+3); // shoulder
      cc.lineTo(vx+2,vy); // neck
      cc.lineTo(vx-2,vy);
      cc.lineTo(vx-2,vy+3);
      cc.lineTo(vx-4,vy+6);
      cc.closePath(); cc.fill();
      // Colored liquid
      cc.fillStyle=vc+'d0';
      cc.beginPath();
      cc.moveTo(vx-3,vy+15); cc.bezierCurveTo(vx-4,vy+18,vx+4,vy+18,vx+3,vy+15);
      cc.lineTo(vx+3,vy+8); cc.lineTo(vx-3,vy+8); cc.closePath(); cc.fill();
      // Bottle highlight (left edge shine)
      cc.fillStyle='rgba(255,255,255,0.2)';
      cc.fillRect(vx-4,vy+7,1.5,8);
      // Cork
      cc.fillStyle='#8a6030'; cc.fillRect(vx-2,vy-3,4,4);
      cc.fillStyle='#6a4820'; cc.fillRect(vx-1,vy-3,1,4);
    }
  });

  // ── COUNTER (foreground perspective) ──────────────
  const ctrTop=ch*0.535;
  // Counter face
  const ctrGrad=cc.createLinearGradient(0,ctrTop,0,ch);
  ctrGrad.addColorStop(0,'#2e1a0a'); ctrGrad.addColorStop(1,'#180e05');
  cc.fillStyle=ctrGrad;
  cc.beginPath();
  cc.moveTo(0,ch); cc.lineTo(cw,ch);
  cc.lineTo(cw*0.76,ctrTop); cc.lineTo(cw*0.24,ctrTop);
  cc.closePath(); cc.fill();
  // Wood grain lines on counter face
  cc.strokeStyle='rgba(0,0,0,0.3)'; cc.lineWidth=1;
  for(let g=1;g<5;g++){
    const gy=ctrTop+g*(ch-ctrTop)/5;
    const xl=cw*0.24+(cw*0.24)*(gy-ctrTop)/(ch-ctrTop);
    cc.beginPath(); cc.moveTo(xl,gy); cc.lineTo(cw-xl,gy); cc.stroke();
  }
  // Counter top surface
  cc.fillStyle='#3e2614';
  cc.beginPath();
  cc.moveTo(cw*0.21,ctrTop-9); cc.lineTo(cw*0.79,ctrTop-9);
  cc.lineTo(cw*0.76,ctrTop+4); cc.lineTo(cw*0.24,ctrTop+4);
  cc.closePath(); cc.fill();
  // Top edge highlight
  cc.fillStyle='#5a3820';
  cc.beginPath();
  cc.moveTo(cw*0.21,ctrTop-9); cc.lineTo(cw*0.79,ctrTop-9);
  cc.lineTo(cw*0.79,ctrTop-7); cc.lineTo(cw*0.21,ctrTop-7);
  cc.closePath(); cc.fill();

  // ── LANTERN ───────────────────────────────────────
  const lnx=cx-cw*0.14, lny=ctrTop-22;
  const lnGlow=cc.createRadialGradient(lnx,lny,0,lnx,lny,50);
  lnGlow.addColorStop(0,'rgba(255,200,60,0.7)'); lnGlow.addColorStop(0.4,'rgba(255,120,20,0.3)'); lnGlow.addColorStop(1,'rgba(0,0,0,0)');
  cc.fillStyle=lnGlow; cc.fillRect(lnx-50,lny-50,100,80);
  // Lantern frame
  cc.fillStyle='#221408'; cc.strokeStyle='#4a3010'; cc.lineWidth=1.5;
  cc.fillRect(lnx-8,lny-22,16,24); cc.strokeRect(lnx-8,lny-22,16,24);
  // Glass
  cc.fillStyle='rgba(255,200,70,0.45)'; cc.fillRect(lnx-6,lny-20,12,19);
  // Flame
  cc.fillStyle='rgba(255,240,100,0.9)';
  cc.beginPath();
  cc.moveTo(lnx,lny-18);
  cc.bezierCurveTo(lnx-3,lny-12,lnx-2,lny-6,lnx,lny-4);
  cc.bezierCurveTo(lnx+2,lny-6,lnx+3,lny-12,lnx,lny-18);
  cc.fill();
  // Base & hook
  cc.fillStyle='#2e1c08'; cc.fillRect(lnx-9,lny+2,18,4); cc.strokeRect(lnx-9,lny+2,18,4);
  cc.strokeStyle='#4a3010'; cc.lineWidth=1.5;
  cc.beginPath(); cc.moveTo(lnx,lny-22); cc.lineTo(lnx,lny-28); cc.stroke();

  // ── SHOPKEEPER SILHOUETTE ─────────────────────────
  const kx=cx+cw*0.02;
  const kBottom=ctrTop+2;
  // Tall narrow body shape
  cc.fillStyle='#07040e';
  cc.beginPath();
  cc.moveTo(kx-cw*0.055,kBottom);
  cc.lineTo(kx+cw*0.055,kBottom);
  cc.bezierCurveTo(kx+cw*0.068,ch*0.3,kx+cw*0.052,ch*0.14,kx+cw*0.034,ch*0.07);
  cc.bezierCurveTo(kx+cw*0.018,ch*0.01,kx-cw*0.018,ch*0.01,kx-cw*0.034,ch*0.07);
  cc.bezierCurveTo(kx-cw*0.052,ch*0.14,kx-cw*0.068,ch*0.3,kx-cw*0.055,kBottom);
  cc.closePath(); cc.fill();
  // Head oval
  cc.beginPath(); cc.ellipse(kx,ch*0.18,cw*0.038,ch*0.09,0,0,Math.PI*2); cc.fill();
  // Fireplace rim light on right edge
  cc.strokeStyle='rgba(255,90,15,0.22)'; cc.lineWidth=2;
  cc.beginPath();
  cc.moveTo(kx+cw*0.055,kBottom);
  cc.bezierCurveTo(kx+cw*0.068,ch*0.3,kx+cw*0.052,ch*0.14,kx+cw*0.034,ch*0.07);
  cc.bezierCurveTo(kx+cw*0.018,ch*0.01,kx,ch*0.09,kx,ch*0.09);
  cc.stroke();
  // Moonlight edge on left
  cc.strokeStyle='rgba(80,100,180,0.15)'; cc.lineWidth=1.5;
  cc.beginPath();
  cc.moveTo(kx-cw*0.055,kBottom);
  cc.bezierCurveTo(kx-cw*0.068,ch*0.3,kx-cw*0.052,ch*0.14,kx-cw*0.034,ch*0.07);
  cc.stroke();
  // Two faint amber eye glows — the only feature visible
  const eyeY=ch*0.195;
  [-1,1].forEach(s=>{
    const ex=kx+s*cw*0.016;
    const eg=cc.createRadialGradient(ex,eyeY,0,ex,eyeY,cw*0.018);
    eg.addColorStop(0,'rgba(245,166,35,0.55)'); eg.addColorStop(1,'transparent');
    cc.fillStyle=eg; cc.beginPath(); cc.arc(ex,eyeY,cw*0.018,0,Math.PI*2); cc.fill();
    cc.fillStyle='rgba(245,166,35,0.4)';
    cc.beginPath(); cc.arc(ex,eyeY,cw*0.005,0,Math.PI*2); cc.fill();
  });



  // ── LIGHTING OVERLAY ──────────────────────────────
  // Warm fireplace rim on right side of figure
  const fireRim=cc.createLinearGradient(cx,0,cw,0);
  fireRim.addColorStop(0,'rgba(0,0,0,0)'); fireRim.addColorStop(1,'rgba(255,100,20,0.14)');
  cc.fillStyle=fireRim; cc.fillRect(0,0,cw,ch);
  // Cool moonlight from left
  const moonRim=cc.createLinearGradient(0,0,cw*0.3,0);
  moonRim.addColorStop(0,'rgba(80,100,180,0.1)'); moonRim.addColorStop(1,'rgba(0,0,0,0)');
  cc.fillStyle=moonRim; cc.fillRect(0,0,cw,ch);
  // Deep corner vignette
  const vig=cc.createRadialGradient(cx,ch*0.44,ch*0.08,cx,ch*0.44,ch*1.1);
  vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(0.6,'rgba(0,0,0,0.25)'); vig.addColorStop(1,'rgba(0,0,0,0.9)');
  cc.fillStyle=vig; cc.fillRect(0,0,cw,ch);
  // Dust motes (atmospheric)
  cc.fillStyle='rgba(255,220,150,0.18)';
  for(let m=0;m<18;m++){
    const mx=(Math.sin(m*2.3)*0.5+0.5)*cw;
    const my=(Math.cos(m*1.8+0.7)*0.5+0.5)*ch*0.52;
    cc.beginPath(); cc.arc(mx,my,0.7,0,Math.PI*2); cc.fill();
  }

  drawSkPortrait();
}

function drawSkPortrait(){
  const cnv=document.getElementById('sk-portrait');
  if(!cnv) return;
  const pc=cnv.getContext('2d');
  const pw=38, ph=38;
  pc.fillStyle='#08050e'; pc.fillRect(0,0,pw,ph);
  pc.fillStyle='#06040a';
  pc.beginPath();
  pc.moveTo(pw*0.28,ph); pc.bezierCurveTo(pw*0.22,ph*0.6,pw*0.2,ph*0.32,pw*0.3,ph*0.12);
  pc.bezierCurveTo(pw*0.38,ph*0.02,pw*0.62,ph*0.02,pw*0.7,ph*0.12);
  pc.bezierCurveTo(pw*0.8,ph*0.32,pw*0.78,ph*0.6,pw*0.72,ph);
  pc.closePath(); pc.fill();
  pc.beginPath(); pc.ellipse(pw*0.5,ph*0.2,pw*0.16,ph*0.14,0,0,Math.PI*2); pc.fill();
  pc.strokeStyle='rgba(255,80,10,0.3)'; pc.lineWidth=1;
  pc.beginPath(); pc.moveTo(pw*0.72,ph); pc.bezierCurveTo(pw*0.78,ph*0.6,pw*0.8,ph*0.32,pw*0.7,ph*0.12); pc.stroke();
  const ey2=ph*0.21;
  [-1,1].forEach(s=>{
    const ex=pw*0.5+s*pw*0.065;
    const eg=pc.createRadialGradient(ex,ey2,0,ex,ey2,pw*0.07);
    eg.addColorStop(0,'rgba(245,166,35,0.65)'); eg.addColorStop(1,'transparent');
    pc.fillStyle=eg; pc.beginPath(); pc.arc(ex,ey2,pw*0.07,0,Math.PI*2); pc.fill();
    pc.fillStyle='rgba(245,166,35,0.5)'; pc.beginPath(); pc.arc(ex,ey2,pw*0.02,0,Math.PI*2); pc.fill();
  });
  pc.strokeStyle='#1e1008'; pc.lineWidth=1; pc.strokeRect(0.5,0.5,37,37);
}

function showBase(){
  gameState='BASE';
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('base').classList.add('visible');
  const sp=document.getElementById('shop-pane');
  if(sp) sp.scrollTop=0;
  // Small delay so CSS layout renders before we read offsetWidth/Height
  setTimeout(drawCottage,20);

  // Shopkeeper line
  const runs=parseInt(localStorage.getItem(SK.runs)||'0');
  const line=SK_LINES[runs%SK_LINES.length];
  document.getElementById('sk-dialogue').textContent=line;

  // Update bank
  bank+=coins;
  saveSave();

  // Run summary
  document.getElementById('s-depth').textContent=maxDepth+'m';
  document.getElementById('s-coins').textContent=coins;
  document.getElementById('s-tiles').textContent=tilesDrilled;
  document.getElementById('bank-val').textContent=bank;

  // Best depth
  const bestDepth=parseInt(localStorage.getItem(SK.best)||'0');
  if(maxDepth>bestDepth) localStorage.setItem(SK.best,maxDepth);
  localStorage.setItem(SK.runs,(parseInt(localStorage.getItem(SK.runs)||'0')+1).toString());

  renderUpgrades();
}

// ─── DRILL COLOR PREVIEW ─────────────────────────────────────────────────────
function drawDrillPreview(cnv, powerLv){
  const cc=cnv.getContext('2d');
  const cw=cnv.width, ch=cnv.height;
  cc.clearRect(0,0,cw,ch);
  cc.fillStyle='#060a06';
  cc.fillRect(0,0,cw,ch);

  // Show all 16 color swatches with current level highlighted
  const swW=Math.floor(cw/DRILL_COLORS.length);
  DRILL_COLORS.forEach((col,i)=>{
    const active=i<=powerLv;
    cc.fillStyle=active?col:'#1a1a1a';
    cc.fillRect(i*swW+1, active?4:7, swW-2, active?ch-8:ch-14);
    if(active){
      const gl=cc.createRadialGradient(i*swW+swW/2,ch/2,0,i*swW+swW/2,ch/2,swW);
      gl.addColorStop(0,col+'88'); gl.addColorStop(1,'transparent');
      cc.fillStyle=gl;
      cc.fillRect(i*swW,0,swW,ch);
    }
  });

  // Current drill shape in center-right
  const dx=cw-18, dy=ch/2;
  const col=DRILL_COLORS[Math.min(powerLv,DRILL_COLORS.length-1)];
  cc.save();
  cc.translate(dx,dy);
  const glow=cc.createRadialGradient(0,0,0,0,0,12);
  glow.addColorStop(0,col+'aa'); glow.addColorStop(1,'transparent');
  cc.fillStyle=glow; cc.fillRect(-12,-12,24,24);
  cc.shadowColor=col; cc.shadowBlur=8;
  cc.fillStyle=col;
  cc.beginPath(); cc.moveTo(10,0); cc.lineTo(4,-4); cc.lineTo(4,4); cc.closePath(); cc.fill();
  cc.restore();
}

// ─── UPGRADE UI ───────────────────────────────────────────────────────────────
function renderUpgrades(){
  document.getElementById('bank-val').textContent=bank;
  const grid2=document.getElementById('upg-grid');
  grid2.innerHTML='';
  UPG_DEFS.forEach(ud=>{
    const lv=upgLvl(ud.id);
    const maxed=lv>=ud.max;
    const cost=maxed?'--':ud.costs[lv];
    const canAfford=!maxed&&bank>=cost;
    const card=document.createElement('div');
    card.className='upg-card';
    let pips='';
    for(let i=0;i<ud.max;i++) pips+=`<div class="pip${i<lv?' filled':''}"></div>`;
    const isDrill=(ud.id==='drillPower'||ud.id==='drillReach'||ud.id==='drillSpeed');
    card.innerHTML=`
      <div class="upg-cat">${ud.cat}</div>
      <div class="upg-name">${ud.name}</div>
      <div class="upg-desc">${ud.desc}</div>
      <div class="upg-pips">${pips}</div>
      ${isDrill?`<canvas class="drill-preview" width="120" height="28" data-id="${ud.id}"></canvas>`:''}
      <button class="upg-btn${maxed?' maxed':''}" ${maxed||!canAfford?'disabled':''}
        data-id="${ud.id}">
        ${maxed?'MAXED':'BUY — '+cost+' COINS'}
      </button>
    `;
    grid2.appendChild(card);
    if(isDrill){
      const pc=card.querySelector('.drill-preview');
      drawDrillPreview(pc, upgLvl('drillPower'));
    }
  });
  grid2.querySelectorAll('.upg-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id=btn.dataset.id;
      const ud=UPG_DEFS.find(u=>u.id===id);
      const lv=upgLvl(id);
      if(lv>=ud.max) return;
      const cost=ud.costs[lv];
      if(bank<cost) return;
      bank-=cost;
      upgLevels[id]=(lv+1);
      saveSave();
      renderUpgrades();
    });
  });
}

// ─── SURFACING ANIMATION ──────────────────────────────────────────────────────
function updateSurfacing(dt){
  surfacingT-=dt;
  player.vy=-280;
  player.vx*=0.9;
  updateCamera(dt);
  // Dark fade (not white — white caused user confusion)
  const alpha=Math.max(0,1-surfacingT/0.8)*0.92;
  ctx.fillStyle=`rgba(0,0,0,${alpha})`;
  ctx.fillRect(0,0,W,H);
  if(surfacingT<=0) showBase();
}

// ─── MAIN LOOP ────────────────────────────────────────────────────────────────
function loop(timestamp){
  requestAnimationFrame(loop);
  const rawDt=(timestamp-lastT)/1000;
  lastT=timestamp;
  t+=rawDt;
  const dt=Math.min(rawDt,DT_CAP);

  if(gameState==='DIVING'){
    updatePhysics(dt);
    if(mouseDown||mobileDrill) updateDrill(dt);
    updateEnemies(dt);
    // Combo decay
    if(comboTimer>0){ comboTimer-=dt; if(comboTimer<=0) comboCount=0; }
    // Depth milestones
    const curDepth=Math.floor(player.y/TS);
    if(curDepth>maxDepth) maxDepth=curDepth;
    DEPTH_MILES.forEach((d,i)=>{ if(curDepth>=d&&!milesHit.has(i)){ milesHit.add(i); showLayerBanner(LAYERS[i+1].name+' REACHED'); } });
    updateCamera(dt);
    updateParticles(dt);
    render();
    updateHUD();
  } else if(gameState==='SURFACING'){
    updateParticles(dt);
    render();
    updateSurfacing(dt);
    updateHUD();
  } else if(gameState==='MENU'){
    drawMenuBg();
  }
}

// ─── MENU BACKGROUND ANIMATION ───────────────────────────────────────────────
let menuScrollY=0;
function drawMenuBg(){
  menuScrollY=(menuScrollY+20/60)%TS;
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,W,H);
  // Scrolling layer strips
  const strips=[
    {y:0,  h:100,col:'#050a06'},
    {y:100,h:150,col:'#030608'},
    {y:250,h:200,col:'#02050e'},
    {y:450,h:100,col:'#010308'},
  ];
  strips.forEach(s=>{
    ctx.fillStyle=s.col;
    ctx.fillRect(0,s.y-menuScrollY*2,W,s.h);
  });
  // Crystal glow dots
  for(let i=0;i<6;i++){
    const gx=(i*137+50)%W, gy=((i*200+menuScrollY*3)%(H+50))-25;
    const pulse=0.4+0.3*Math.sin(t*1.5+i);
    ctx.fillStyle=`rgba(0,200,255,${pulse})`;
    ctx.beginPath(); ctx.arc(gx,gy,2,0,Math.PI*2); ctx.fill();
  }
  // Amber mech silhouette
  const mx=W/2, my=H*0.55+Math.sin(t*0.8)*6;
  ctx.fillStyle='rgba(245,166,35,0.15)';
  ctx.beginPath();
  ctx.moveTo(mx,my-20); ctx.lineTo(mx+14,my-12); ctx.lineTo(mx+14,my+12);
  ctx.lineTo(mx,my+20); ctx.lineTo(mx-14,my+12); ctx.lineTo(mx-14,my-12);
  ctx.closePath(); ctx.fill();
}

// ─── HOLD-TO-SURFACE ─────────────────────────────────────────────────────────
let surfaceHoldTimer=null;
let lastMoveKeyTime=0;
const sfillEl=document.querySelector('#surface-btn .sfill');
function startSurfaceHold(){
  if(gameState!=='DIVING'||surfaceHoldTimer) return;
  if(mouseDown||mobileDrill) return;               // not while drilling
  if(performance.now()-lastMoveKeyTime<400) return; // not within 400ms of moving
  if(sfillEl){ sfillEl.style.transition='transform 0.5s linear'; sfillEl.style.transform='scaleX(1)'; }
  surfaceHoldTimer=setTimeout(()=>{ surfaceHoldTimer=null; triggerSurface(); },500);
}
function cancelSurfaceHold(){
  if(surfaceHoldTimer){ clearTimeout(surfaceHoldTimer); surfaceHoldTimer=null; }
  if(sfillEl){ sfillEl.style.transition='none'; sfillEl.style.transform='scaleX(0)'; }
}

// ─── INPUT ────────────────────────────────────────────────────────────────────
const MOVE_CODES=new Set(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowLeft','ArrowDown','ArrowRight']);
document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(MOVE_CODES.has(e.code)) lastMoveKeyTime=performance.now();
  if(e.code==='KeyR'&&!e.repeat) startSurfaceHold(); // Escape removed — too easy to press accidentally
  if(e.code==='KeyE') doRadar();
  if(e.code==='KeyD'||e.code==='ArrowRight') e.preventDefault();
  if(e.code==='KeyA'||e.code==='ArrowLeft') e.preventDefault();
  if(e.code==='Space'||e.code==='Escape') e.preventDefault();
});
document.addEventListener('keyup',e=>{
  keys[e.code]=false;
  if(e.code==='KeyR') cancelSurfaceHold();
});

window.addEventListener('mousemove',e=>{
  mouseX=e.clientX; mouseY=e.clientY;
  // Safeguard: if left button is no longer held, clear mouseDown
  if(!(e.buttons&1)) mouseDown=false;
});
canvas.addEventListener('mousedown',e=>{
  if(e.button===0&&gameState==='DIVING') mouseDown=true;
});
window.addEventListener('mouseup',e=>{ if(e.button===0) mouseDown=false; });
canvas.addEventListener('contextmenu',e=>e.preventDefault());

// Joystick
const jzone=document.getElementById('jzone');
const jthumb=document.getElementById('jthumb');
jzone.addEventListener('touchstart',e=>{
  e.preventDefault();
  const touch=e.changedTouches[0];
  joyID=touch.identifier;
  joyOrigin={x:touch.clientX,y:touch.clientY};
},{passive:false});
jzone.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const touch of e.changedTouches){
    if(touch.identifier!==joyID) continue;
    const dx=touch.clientX-joyOrigin.x, dy=touch.clientY-joyOrigin.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    const maxD=50;
    const nx=dx/Math.max(dist,maxD), ny=dy/Math.max(dist,maxD);
    joyVec.x=Math.abs(dx)>8?Math.sign(dx)*Math.min(1,dist/maxD):0;
    joyVec.y=Math.abs(dy)>8?Math.sign(dy)*Math.min(1,dist/maxD):0;
    const clampX=Math.min(maxD,Math.abs(dx))*Math.sign(dx);
    const clampY=Math.min(maxD,Math.abs(dy))*Math.sign(dy);
    jthumb.style.transform=`translate(${clampX}px,${clampY}px)`;
  }
},{passive:false});
jzone.addEventListener('touchend',e=>{
  joyVec={x:0,y:0};
  jthumb.style.transform='none';
  joyOrigin=null; joyID=-1;
},{passive:false});

// Mobile drill button
const drillMb=document.getElementById('drill-mb');
drillMb.addEventListener('touchstart',e=>{ e.preventDefault(); mobileDrill=true; drillMb.classList.add('active'); },{passive:false});
drillMb.addEventListener('touchend',e=>{ e.preventDefault(); mobileDrill=false; drillMb.classList.remove('active'); },{passive:false});
drillMb.addEventListener('touchmove',e=>{
  e.preventDefault();
  const touch=e.changedTouches[0];
  mouseX=touch.clientX; mouseY=touch.clientY;
},{passive:false});

// Right side touch = drill aiming
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  for(const touch of e.changedTouches){
    if(touch.clientX>W/2){
      mouseX=touch.clientX; mouseY=touch.clientY;
      mobileDrill=true;
    }
  }
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const touch of e.changedTouches){
    if(touch.clientX>W/2){ mouseX=touch.clientX; mouseY=touch.clientY; }
  }
},{passive:false});
canvas.addEventListener('touchend',e=>{
  for(const touch of e.changedTouches){
    if(touch.clientX>W/2) mobileDrill=false;
  }
},{passive:false});

// Buttons
document.getElementById('play-btn').addEventListener('click',startDive);
const surfBtn=document.getElementById('surface-btn');
surfBtn.addEventListener('mousedown',e=>{ e.preventDefault(); startSurfaceHold(); });
surfBtn.addEventListener('mouseup',cancelSurfaceHold);
surfBtn.addEventListener('mouseleave',cancelSurfaceHold);
surfBtn.addEventListener('touchstart',e=>{ e.preventDefault(); startSurfaceHold(); },{passive:false});
surfBtn.addEventListener('touchend',e=>{ e.preventDefault(); cancelSurfaceHold(); },{passive:false});
surfBtn.addEventListener('touchcancel',cancelSurfaceHold);
document.getElementById('dive-btn').addEventListener('click',()=>{
  document.getElementById('base').classList.remove('visible');
  startDive();
});

// ─── BOOT ─────────────────────────────────────────────────────────────────────
loadSave();
lastT=performance.now();
requestAnimationFrame(loop);
</script>
