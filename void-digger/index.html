<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>VOID DIGGER — Umbra Directorate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Rajdhani',sans-serif}
canvas{display:block;position:absolute;inset:0}

/* ── MENU ────────────────────────────────────────── */
#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#051008 0%,#000 70%);z-index:20}
#menu.hidden{display:none}
.studio-lbl{font-family:'Exo 2',sans-serif;font-size:11px;font-weight:700;letter-spacing:6px;color:#1a3a20;text-transform:uppercase;margin-bottom:32px}
#menu h1{font-family:'Exo 2',sans-serif;font-size:clamp(48px,8vw,88px);font-weight:900;color:#f5a623;letter-spacing:4px;text-shadow:0 0 40px #f5a62388,0 0 80px #f5a62344;line-height:1;margin-bottom:12px}
#menu .sub{font-size:16px;color:#556655;letter-spacing:2px;margin-bottom:48px}
.clip-btn{font-family:'Exo 2',sans-serif;font-weight:700;font-size:14px;letter-spacing:4px;padding:14px 48px;background:transparent;border:1px solid #f5a623;color:#f5a623;cursor:pointer;clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);transition:all .2s;text-transform:uppercase}
.clip-btn:hover{background:#f5a62322;box-shadow:0 0 24px #f5a62366}
.clip-btn.small{font-size:12px;padding:10px 32px}
.menu-depth{font-size:12px;color:#223322;margin-top:40px;letter-spacing:3px}

/* ── HUD ─────────────────────────────────────────── */
#hud{position:absolute;inset:0;pointer-events:none;z-index:10}
#hud.hidden{display:none}
#hud-energy{position:absolute;top:16px;left:16px;display:flex;flex-direction:column;gap:4px;width:180px}
.hud-label{font-size:10px;letter-spacing:3px;color:#334433}
#ebar-wrap{height:8px;background:#0a1a0a;border:1px solid #1a3a1a;overflow:hidden}
#ebar{height:100%;width:100%;background:linear-gradient(90deg,#00ccff,#0077ff);transition:width .1s,background .3s}
#ebar.low{background:#ff3344}
#ebar-val{font-size:11px;color:#335533;letter-spacing:2px}
#hud-depth{position:absolute;top:16px;left:50%;transform:translateX(-50%);text-align:center}
#depth-val{font-family:'Exo 2',sans-serif;font-size:22px;font-weight:700;color:#f5a623;letter-spacing:2px;display:block}
#depth-layer{font-size:10px;letter-spacing:4px;color:#445544;display:block;margin-top:2px}
#hud-right{position:absolute;top:16px;right:16px;text-align:right}
#hud-coins{font-family:'Exo 2',sans-serif;font-size:24px;font-weight:700;color:#f5a623;letter-spacing:2px}
#surface-btn{pointer-events:all;position:absolute;bottom:20px;right:16px;font-family:'Exo 2',sans-serif;font-size:11px;font-weight:700;letter-spacing:3px;padding:10px 22px;background:transparent;border:1px solid #334433;color:#334433;cursor:pointer;clip-path:polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%);transition:all .2s}
#surface-btn:hover{color:#f5a623;border-color:#f5a623;background:#f5a62311}
#layer-banner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Exo 2',sans-serif;font-size:clamp(18px,3vw,28px);font-weight:900;letter-spacing:8px;color:#f5a623;text-shadow:0 0 30px #f5a623;text-align:center;opacity:0;pointer-events:none;transition:opacity .4s;z-index:15}
#layer-banner.show{opacity:1}
#radar-ring{position:absolute;top:50%;left:50%;width:0;height:0;pointer-events:none;z-index:9}

/* ── BASE / UPGRADE SHOP ─────────────────────────── */
#base{position:absolute;inset:0;background:#000;z-index:20;overflow-y:auto;display:none;flex-direction:column;align-items:center;padding:32px 16px 40px}
#base.visible{display:flex}
#base h2{font-family:'Exo 2',sans-serif;font-size:clamp(24px,4vw,40px);font-weight:900;color:#f5a623;letter-spacing:6px;margin-bottom:4px}
#base .sub2{font-size:13px;color:#334433;letter-spacing:3px;margin-bottom:20px}
#run-summary{display:flex;gap:32px;margin-bottom:28px;flex-wrap:wrap;justify-content:center}
.sum-block{text-align:center}
.sum-val{font-family:'Exo 2',sans-serif;font-size:22px;font-weight:700;color:#f5a623}
.sum-lbl{font-size:10px;color:#445544;letter-spacing:2px}
#bank-display{font-family:'Exo 2',sans-serif;font-size:18px;color:#f5a623;margin-bottom:24px;letter-spacing:2px}
#upg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;width:100%;max-width:800px;margin-bottom:28px}
.upg-card{background:#060a06;border:1px solid #1a2a1a;padding:16px;display:flex;flex-direction:column;gap:8px;clip-path:polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%)}
.upg-cat{font-size:9px;letter-spacing:4px;color:#334433}
.upg-name{font-family:'Exo 2',sans-serif;font-size:14px;font-weight:700;color:#aaccaa;letter-spacing:2px}
.upg-desc{font-size:11px;color:#446644;line-height:1.5}
.upg-pips{display:flex;gap:4px;margin:2px 0}
.pip{width:16px;height:4px;background:#1a2a1a}
.pip.filled{background:#f5a623}
.upg-btn{font-family:'Exo 2',sans-serif;font-size:10px;font-weight:700;letter-spacing:3px;padding:7px 0;background:transparent;border:1px solid #334433;color:#334433;cursor:pointer;transition:all .2s;clip-path:polygon(4px 0%,100% 0%,calc(100% - 4px) 100%,0% 100%)}
.upg-btn:hover:not(:disabled){border-color:#f5a623;color:#f5a623;background:#f5a62311}
.upg-btn:disabled{opacity:.3;cursor:default}
.upg-btn.maxed{border-color:#223322;color:#223322}
#dive-btn{font-family:'Exo 2',sans-serif;font-weight:900;font-size:14px;letter-spacing:6px;padding:16px 64px;background:transparent;border:1px solid #f5a623;color:#f5a623;cursor:pointer;clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%);transition:all .2s}
#dive-btn:hover{background:#f5a62322;box-shadow:0 0 32px #f5a62355}

/* ── MOBILE CONTROLS ─────────────────────────────── */
#mc{position:absolute;inset:0;pointer-events:none;z-index:11;display:none}
#mc.show{display:block}
#jzone{position:absolute;bottom:60px;left:16px;width:120px;height:120px;border:1px solid #1a2a1a;border-radius:50%;pointer-events:all;touch-action:none}
#jthumb{position:absolute;width:44px;height:44px;border-radius:50%;background:#f5a62355;border:1px solid #f5a623;top:38px;left:38px;transform:none}
#drill-mb{position:absolute;bottom:60px;right:16px;pointer-events:all;font-family:'Exo 2',sans-serif;font-size:12px;font-weight:700;letter-spacing:3px;padding:14px 28px;background:#000;border:1px solid #f5a62388;color:#f5a62388;clip-path:polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%)}
#drill-mb.active{background:#f5a62322;color:#f5a623;border-color:#f5a623}

/* ── VIGNETTE / DAMAGE FLASH ─────────────────────── */
#vignette{position:absolute;inset:0;pointer-events:none;z-index:13;background:radial-gradient(ellipse at center,transparent 60%,#000 100%);opacity:.5}
#dmg-flash{position:absolute;inset:0;pointer-events:none;z-index:14;background:#ff000000;transition:background .1s}
#dmg-flash.flash{background:#ff000033}

/* ── BACK LINK ───────────────────────────────────── */
#back{position:absolute;top:12px;left:16px;font-family:'Exo 2',sans-serif;font-size:10px;font-weight:700;letter-spacing:3px;color:#223322;text-decoration:none;z-index:25;transition:color .2s}
#back:hover{color:#f5a623}
</style>
</head>
<body>

<a id="back" href="../">← CATALOG</a>
<canvas id="c"></canvas>
<div id="vignette"></div>
<div id="dmg-flash"></div>

<!-- MENU -->
<div id="menu">
  <div class="studio-lbl">Umbra Directorate</div>
  <h1>VOID DIGGER</h1>
  <div class="sub">Drill deeper. The planet has layers.</div>
  <button class="clip-btn" id="play-btn">PLAY</button>
  <div class="menu-depth">depth: ??? m</div>
</div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div id="hud-energy">
    <div class="hud-label">ENERGY</div>
    <div id="ebar-wrap"><div id="ebar"></div></div>
    <span id="ebar-val">100</span>
  </div>
  <div id="hud-depth">
    <span id="depth-val">0m</span>
    <span id="depth-layer">TOPSOIL</span>
  </div>
  <div id="hud-right">
    <div id="hud-coins">0</div>
    <div class="hud-label">COINS</div>
  </div>
  <button id="surface-btn">SURFACE [R]</button>
  <div id="layer-banner"></div>
  <div id="radar-ring"></div>
</div>

<!-- BASE / UPGRADE SHOP -->
<div id="base">
  <h2>BASE CAMP</h2>
  <div class="sub2">UMBRA DIRECTORATE — DEEP DRILL OPERATION</div>
  <div id="run-summary">
    <div class="sum-block"><div class="sum-val" id="s-depth">0m</div><div class="sum-lbl">MAX DEPTH</div></div>
    <div class="sum-block"><div class="sum-val" id="s-coins">0</div><div class="sum-lbl">COINS EARNED</div></div>
    <div class="sum-block"><div class="sum-val" id="s-tiles">0</div><div class="sum-lbl">TILES DRILLED</div></div>
  </div>
  <div id="bank-display">BANK: <span id="bank-val">0</span> COINS</div>
  <div id="upg-grid"></div>
  <button id="dive-btn" class="clip-btn">DIVE AGAIN</button>
</div>

<!-- MOBILE CONTROLS -->
<div id="mc">
  <div id="jzone"><div id="jthumb"></div></div>
  <button id="drill-mb">DRILL</button>
</div>

<script>
'use strict';
// ─── CONSTANTS ────────────────────────────────────────────────────────────────
const WW=120, WH=1000, TS=20;
const SURFACE_ROW=2;
const GRAVITY=380, THRUST=540, MAX_VX=200, MAX_VY_UP=260, MAX_VY_DOWN=440;
const DRAG_X=5.5, DRAG_Y=1.6;
const DT_CAP=0.05, PHYS_STEPS=2;
const DRILL_BASE_RATE=20, LAVA_DAMAGE=16;
const PLAYER_W=16, PLAYER_H=20;
const BASE_LIGHT_R=150, MAX_PARTS=300;

const T={AIR:0,GRASS:1,DIRT:2,CLAY:3,STONE:4,IRON:5,FOSSIL:6,
         CRYSTAL:7,QUARTZ:8,BASALT:9,OBSIDIAN:10,RUNE:11,ANCIENT:12,
         ART_WALL:13,LAVA_ROCK:14,LAVA:15,MAGMA_X:16,
         VOID_STONE:17,VOID_X:18,POWER_CELL:19,ARTIFACT:20,ROOT:21};

// [hp, coinVal, solid, glowColor, lava]
const TDEF=[
  [0,  0, 0, null,      0], // AIR
  [8,  0, 1, null,      0], // GRASS
  [10, 0, 1, null,      0], // DIRT
  [16, 2, 1, null,      0], // CLAY
  [26, 1, 1, null,      0], // STONE
  [32, 6, 1, null,      0], // IRON
  [24, 9, 1, null,      0], // FOSSIL
  [22,20, 1, '#00eeff', 0], // CRYSTAL
  [18, 7, 1, '#88aaff', 0], // QUARTZ
  [40, 0, 1, null,      0], // BASALT
  [55, 4, 1, null,      0], // OBSIDIAN
  [34,22, 1, '#aa55ff', 0], // RUNE
  [48,30, 1, null,      0], // ANCIENT
  [80, 0, 1, null,      0], // ART_WALL
  [28, 0, 1, null,      0], // LAVA_ROCK
  [0,  0, 0, '#ff4400', 1], // LAVA
  [36,40, 1, '#ff6600', 0], // MAGMA_X
  [60, 0, 1, null,      0], // VOID_STONE
  [44,90, 1, '#cc00ff', 0], // VOID_X
  [4,  0, 0, '#00ff88', 0], // POWER_CELL
  [4, 60, 0, '#f5a623', 0], // ARTIFACT
  [2,  0, 1, null,      0], // ROOT
];

const LAYERS=[
  {name:'TOPSOIL',        start:0,  end:49,  dark:0.30, r:0,  g:8,  b:0},
  {name:'CLAY & STONE',   start:50, end:149, dark:0.56, r:0,  g:4,  b:8},
  {name:'CRYSTAL CAVERNS',start:150,end:299, dark:0.74, r:0,  g:2,  b:12},
  {name:'ANCIENT DEPTHS', start:300,end:499, dark:0.86, r:0,  g:0,  b:8},
  {name:'MAGMA LAYER',    start:500,end:749, dark:0.91, r:14, g:2,  b:0},
  {name:'THE VOID',       start:750,end:999, dark:0.97, r:0,  g:0,  b:10},
];

const SK={bank:'vdg_bank',upg:'vdg_upgrades',best:'vdg_best',runs:'vdg_runs'};

const UPG_DEFS=[
  {id:'drillPower', cat:'DRILL',name:'DRILL POWER',   max:5, costs:[25,55,110,220,400], desc:'Faster drilling rate'},
  {id:'drillReach', cat:'DRILL',name:'DRILL REACH',   max:3, costs:[50,110,220],        desc:'Extended drill range'},
  {id:'drillSpeed', cat:'DRILL',name:'DRILL SPEED',   max:3, costs:[40,90,180],         desc:'Drill animation speed'},
  {id:'energyCore', cat:'MECH', name:'ENERGY CORE',   max:5, costs:[30,70,140,280,500], desc:'+25 max energy/level'},
  {id:'hullPlating',cat:'MECH', name:'HULL PLATING',  max:3, costs:[45,100,200],        desc:'Reduce hazard damage'},
  {id:'thruster',   cat:'MECH', name:'THRUSTER',      max:3, costs:[35,80,160],         desc:'+15% move speed/level'},
  {id:'lightRadius',cat:'MECH', name:'LIGHT RADIUS',  max:4, costs:[30,65,130,260],     desc:'Larger vision radius'},
  {id:'radarPulse', cat:'TECH', name:'RADAR PULSE',   max:3, costs:[60,130,260],        desc:'E: reveal resources nearby'},
  {id:'artScanner', cat:'TECH', name:'ART. SCANNER',  max:2, costs:[90,200],            desc:'Outline artifacts through walls'},
  {id:'autoCollect',cat:'TECH', name:'AUTO COLLECTOR',max:2, costs:[100,200],           desc:'Auto-collect adjacent items'},
  {id:'depthAnchor',cat:'TECH', name:'DEPTH ANCHOR',  max:1, costs:[300],               desc:'Set one checkpoint per run'},
];

// ─── CANVAS & LIGHTING ───────────────────────────────────────────────────────
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const lightCnv=document.createElement('canvas');
const lctx=lightCnv.getContext('2d');
const dpr=Math.min(window.devicePixelRatio||1,2);
let W=0,H=0;

function resize(){
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  lightCnv.width=W; lightCnv.height=H;
}
resize();
window.addEventListener('resize',resize);

// ─── STATE ──────────────────────────────────────────────────────────────────
let gameState='MENU'; // MENU DIVING SURFACING BASE
let t=0, lastT=0;
let camX=0, camY=0;
let coins=0, maxDepth=0, tilesDrilled=0;
let radarActive=false, radarT=0;
let anchorY=-1;
let dmgFlashT=0;
let surfaceGrace=0; // seconds before surface-exit can trigger
let layerBannerT=0, lastLayer=-1;
let surfacingT=0;

// ─── WORLD DATA ─────────────────────────────────────────────────────────────
const grid    = new Uint8Array(WW*WH);
const drill   = new Float32Array(WW*WH);

// ─── PLAYER ─────────────────────────────────────────────────────────────────
let player={
  x:WW*TS/2, y:TS*1.5,
  vx:0, vy:0,
  energy:100, maxEnergy:100,
  drillAngle:Math.PI/2,
  onGround:false,
  hullFlash:0,
  facing:1,
};

// ─── PARTICLES ──────────────────────────────────────────────────────────────
const parts=[];

// ─── INPUT ──────────────────────────────────────────────────────────────────
const keys={};
let mouseX=W/2, mouseY=H/2;
let mouseDown=false;
let joyVec={x:0,y:0};
let mobileDrill=false;
let joyOrigin=null, joyID=-1;

// ─── UPGRADES ───────────────────────────────────────────────────────────────
let upgLevels={};
let bank=0;

function loadSave(){
  bank=parseInt(localStorage.getItem(SK.bank)||'0');
  try{ upgLevels=JSON.parse(localStorage.getItem(SK.upg)||'{}'); }catch(e){ upgLevels={}; }
}
function saveSave(){
  localStorage.setItem(SK.bank,bank);
  localStorage.setItem(SK.upg,JSON.stringify(upgLevels));
}
function upgLvl(id){ return upgLevels[id]||0; }
function upgEff(id){
  const lv=upgLvl(id);
  switch(id){
    case 'drillPower': return 1+lv*0.5;
    case 'drillReach': return lv;
    case 'drillSpeed': return 1+lv*0.3;
    case 'energyCore': return lv*25;
    case 'hullPlating': return 1-lv*0.2;
    case 'thruster':   return 1+lv*0.15;
    case 'lightRadius':return 1+lv*0.22;
    case 'radarPulse': return lv===0?0:lv*4+3;
    default: return lv;
  }
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function inBounds(tx,ty){ return tx>=0&&tx<WW&&ty>=0&&ty<WH; }
function gAt(tx,ty){ return inBounds(tx,ty)?grid[ty*WW+tx]:T.STONE; }
function solid(tx,ty){ return inBounds(tx,ty)?TDEF[grid[ty*WW+tx]][2]:1; }
function getLayer(row){
  for(let i=LAYERS.length-1;i>=0;i--) if(row>=LAYERS[i].start) return i;
  return 0;
}
function ph(x,y,s){ return ((x*73856093^y*19349663^s*83492791)>>>0)%1000/1000; }

// ─── WORLD GENERATION ────────────────────────────────────────────────────────
function carveCircle(cx,cy,r){
  for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
    if(dx*dx+dy*dy<=r*r){ const tx=cx+dx,ty=cy+dy; if(inBounds(tx,ty)) grid[ty*WW+tx]=T.AIR; }
  }
}
function carveEllipse(cx,cy,rx,ry){
  for(let dy=-ry;dy<=ry;dy++) for(let dx=-rx;dx<=rx;dx++){
    if(dx*dx/(rx*rx)+dy*dy/(ry*ry)<=1){ const tx=cx+dx,ty=cy+dy; if(inBounds(tx,ty)) grid[ty*WW+tx]=T.AIR; }
  }
}
function placeRoom(cx,cy){
  const W5=5,H5=5;
  for(let dy=0;dy<H5;dy++) for(let dx=0;dx<W5;dx++){
    const tx=cx+dx,ty=cy+dy;
    if(!inBounds(tx,ty)) continue;
    if(dy===0||dy===H5-1||dx===0||dx===W5-1) grid[ty*WW+tx]=T.ART_WALL;
    else if(dy===2&&dx===2) grid[ty*WW+tx]=T.ARTIFACT;
    else grid[ty*WW+tx]=T.AIR;
  }
}

function generateWorld(){
  // Row 0: sky (air)
  for(let x=0;x<WW;x++) grid[0*WW+x]=T.AIR;
  // Row 1: grass
  for(let x=0;x<WW;x++) grid[1*WW+x]=T.GRASS;

  // Layer 1: Topsoil (2-49)
  for(let y=2;y<=49;y++) for(let x=0;x<WW;x++){
    const p=ph(x,y,1);
    let tile=T.DIRT;
    if(p<0.07) tile=T.STONE;
    else if(p<0.11) tile=T.ROOT;
    grid[y*WW+x]=tile;
  }
  // Power cells in topsoil
  for(let i=0;i<4;i++){
    const tx=10+Math.floor(ph(i,0,99)*100),ty=5+Math.floor(ph(i,1,99)*35);
    if(inBounds(tx,ty)) grid[ty*WW+tx]=T.POWER_CELL;
  }

  // Layer 2: Clay/Stone (50-149)
  for(let y=50;y<=149;y++) for(let x=0;x<WW;x++){
    const p=ph(x,y,2);
    let tile=p<0.55?T.STONE:p<0.85?T.CLAY:T.IRON;
    if(p<0.03&&grid[y*WW+x]===0) tile=T.FOSSIL;
    grid[y*WW+x]=tile;
  }
  // Fossil scatter pass
  for(let y=60;y<=149;y++) for(let x=0;x<WW;x++){
    if(ph(x,y,55)<0.03) grid[y*WW+x]=T.FOSSIL;
  }
  // Small caves in layer 2
  for(let i=0;i<20;i++){
    carveCircle(2+Math.floor(ph(i,0,7)*116),55+Math.floor(ph(i,1,7)*90),2+Math.floor(ph(i,2,7)*3));
  }

  // Layer 3: Crystal Caverns (150-299) — cellular automata
  // Init with 42% air
  for(let y=150;y<=299;y++) for(let x=0;x<WW;x++){
    grid[y*WW+x]= ph(x,y,3)<0.42?T.AIR:T.STONE;
  }
  // 3 CA passes
  const tmp=new Uint8Array(WW*(299-150+1));
  for(let pass=0;pass<3;pass++){
    for(let y=150;y<=299;y++) for(let x=0;x<WW;x++){
      let solid_n=0;
      for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
        const nx=x+dx,ny=y+dy;
        if(!inBounds(nx,ny)||ny<150) solid_n++;
        else if(grid[ny*WW+nx]!==T.AIR) solid_n++;
      }
      tmp[(y-150)*WW+x]= solid_n>=5?T.STONE:T.AIR;
    }
    for(let y=150;y<=299;y++) for(let x=0;x<WW;x++) grid[y*WW+x]=tmp[(y-150)*WW+x];
  }
  // Crystal formations at exposed stone edges
  for(let y=151;y<=298;y++) for(let x=1;x<WW-1;x++){
    if(grid[y*WW+x]===T.STONE){
      const hasAirN=(grid[(y-1)*WW+x]===T.AIR||grid[(y+1)*WW+x]===T.AIR||grid[y*WW+x-1]===T.AIR||grid[y*WW+x+1]===T.AIR);
      if(hasAirN){
        const p=ph(x,y,8);
        if(p<0.12) grid[y*WW+x]=T.CRYSTAL;
        else if(p<0.20) grid[y*WW+x]=T.QUARTZ;
      }
    }
  }

  // Layer 4: Ancient Depths (300-499)
  for(let y=300;y<=499;y++) for(let x=0;x<WW;x++){
    const p=ph(x,y,4);
    let tile=p<0.45?T.BASALT:p<0.75?T.OBSIDIAN:p<0.88?T.RUNE:T.ANCIENT;
    grid[y*WW+x]=tile;
  }
  // Artifact chambers
  for(let i=0;i<5;i++){
    const cx=5+Math.floor(ph(i,0,40)*108);
    const cy=310+Math.floor(ph(i,1,40)*175);
    placeRoom(cx,cy);
  }

  // Layer 5: Magma (500-749)
  for(let y=500;y<=749;y++) for(let x=0;x<WW;x++){
    const p=ph(x,y,5);
    grid[y*WW+x]= p<0.55?T.LAVA_ROCK:T.BASALT;
  }
  // Lava pools (CA blobs)
  for(let y=510;y<=740;y++) for(let x=0;x<WW;x++){
    if(ph(x,y,51)<0.18) grid[y*WW+x]=T.LAVA;
  }
  // Smooth lava (2 CA passes)
  const tmp5=new Uint8Array(WW*250);
  for(let pass=0;pass<2;pass++){
    for(let y=500;y<=749;y++) for(let x=0;x<WW;x++){
      let lCount=0;
      for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
        const nx=x+dx,ny=y+dy;
        if(inBounds(nx,ny)&&grid[ny*WW+nx]===T.LAVA) lCount++;
      }
      tmp5[(y-500)*WW+x]= lCount>=5?T.LAVA:(grid[y*WW+x]===T.LAVA&&lCount>=3?T.LAVA:grid[y*WW+x]);
    }
    for(let y=500;y<=749;y++) for(let x=0;x<WW;x++) grid[y*WW+x]=tmp5[(y-500)*WW+x];
  }
  // Magma crystals at lava edges
  for(let y=501;y<=748;y++) for(let x=1;x<WW-1;x++){
    if(grid[y*WW+x]===T.LAVA_ROCK||grid[y*WW+x]===T.BASALT){
      const adj=(grid[(y-1)*WW+x]===T.LAVA||grid[(y+1)*WW+x]===T.LAVA||grid[y*WW+x-1]===T.LAVA||grid[y*WW+x+1]===T.LAVA);
      if(adj&&ph(x,y,52)<0.06) grid[y*WW+x]=T.MAGMA_X;
    }
  }
  // Power cells in magma
  for(let i=0;i<8;i++){
    const tx=5+Math.floor(ph(i,5,60)*110),ty=510+Math.floor(ph(i,6,60)*220);
    if(inBounds(tx,ty)&&grid[ty*WW+tx]===T.LAVA_ROCK) grid[ty*WW+tx]=T.POWER_CELL;
  }

  // Layer 6: The Void (750-999)
  for(let y=750;y<=999;y++) for(let x=0;x<WW;x++){
    const p=ph(x,y,6);
    grid[y*WW+x]= p<0.72?T.VOID_STONE:T.AIR;
  }
  // Void crystals
  for(let y=755;y<=998;y++) for(let x=1;x<WW-1;x++){
    if(grid[y*WW+x]===T.VOID_STONE&&ph(x,y,77)<0.012) grid[y*WW+x]=T.VOID_X;
  }

  // Wide spawn shaft — clear 9 tiles wide, 20 rows deep so the player
  // has room to move freely and can fly back up to the surface
  const spawnX=Math.floor(WW/2);
  for(let y=0;y<=19;y++) for(let dx=-4;dx<=4;dx++){
    if(inBounds(spawnX+dx,y)) grid[y*WW+spawnX+dx]=T.AIR;
  }
  // Grass border on either side of the shaft opening at row 1
  for(let x=0;x<WW;x++){
    if(x<spawnX-4||x>spawnX+4) grid[1*WW+x]=T.GRASS;
  }
}

// ─── TILE COLORS / RENDERING ─────────────────────────────────────────────────
const TILE_COLS=[
  null,        // AIR
  '#4a7c3f',   // GRASS
  '#5c3317',   // DIRT
  '#8b4513',   // CLAY
  '#424558',   // STONE
  '#3a3a4a',   // IRON
  '#c4a47c',   // FOSSIL
  '#0a1a20',   // CRYSTAL (dark base, glow drawn separately)
  '#c8d8e8',   // QUARTZ
  '#1a1a2e',   // BASALT
  '#050510',   // OBSIDIAN
  '#0d1020',   // RUNE
  '#1a1408',   // ANCIENT
  '#0a0810',   // ART_WALL
  '#0a0300',   // LAVA_ROCK
  '#cc3300',   // LAVA (animated)
  '#200508',   // MAGMA_X (dark base)
  '#050010',   // VOID_STONE
  '#000005',   // VOID_X (dark base)
  '#05100a',   // POWER_CELL
  '#100808',   // ARTIFACT
  '#2a1a08',   // ROOT
];

function drawTile(tile,sx,sy,tx,ty){
  const s=TS, col=TILE_COLS[tile];
  if(tile===T.AIR) return;

  ctx.fillStyle=col;
  ctx.fillRect(sx,sy,s,s);

  const p=ph(tx,ty,1), p2=ph(tx,ty,2), p3=ph(tx,ty,3);

  if(tile===T.GRASS){
    ctx.fillStyle='#2d5a1e';
    ctx.fillRect(sx,sy+4,s,s-4);
    ctx.fillStyle='#4a7c3f';
    ctx.fillRect(sx,sy,s,4);
  }
  else if(tile===T.DIRT){
    ctx.fillStyle='#3d2008';
    for(let i=0;i<4;i++){
      const dx=Math.floor(ph(tx+i,ty,9)*s),dy=Math.floor(ph(tx,ty+i,9)*s);
      ctx.fillRect(sx+dx,sy+dy,2,2);
    }
  }
  else if(tile===T.CLAY){
    ctx.fillStyle='#6b3010';
    for(let gy=0;gy<s;gy+=5) ctx.fillRect(sx,sy+gy,s,1);
  }
  else if(tile===T.STONE){
    ctx.fillStyle='#2a2d38';
    for(let i=0;i<5;i++){
      const bx=sx+Math.floor(ph(tx+i,ty,3)*14),by=sy+Math.floor(ph(tx,ty+i,3)*14),br=1+Math.floor(ph(tx+i,ty+i,3)*3);
      ctx.beginPath(); ctx.arc(bx,by,br,0,Math.PI*2); ctx.fill();
    }
  }
  else if(tile===T.IRON){
    ctx.strokeStyle='#8b5a0a'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(sx+3,sy+3); ctx.lineTo(sx+s-3,sy+s-3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx+s-3,sy+3); ctx.lineTo(sx+3,sy+s-3); ctx.stroke();
  }
  else if(tile===T.FOSSIL){
    ctx.strokeStyle='#fff8ee'; ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.arc(sx+s/2,sy+s/2,6,0,Math.PI*1.4); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(sx+s/2,sy+s/2-6); ctx.lineTo(sx+s/2,sy+s/2+3); ctx.stroke();
  }
  else if(tile===T.CRYSTAL){
    const pulse=0.7+0.3*Math.sin(t*2.5+p*6.28);
    ctx.shadowColor='#00eeff'; ctx.shadowBlur=14*pulse;
    ctx.fillStyle=`rgba(0,180,220,${0.8*pulse})`;
    // 6-point star
    drawStar(ctx,sx+s/2,sy+s/2,6,s*0.42,s*0.18,6);
    ctx.shadowBlur=0;
    ctx.fillStyle='#002233';
    ctx.fillRect(sx,sy,s,s);
    ctx.fillStyle=`rgba(0,220,255,${0.9*pulse})`;
    drawStar(ctx,sx+s/2,sy+s/2,6,s*0.42,s*0.18,6);
  }
  else if(tile===T.QUARTZ){
    ctx.strokeStyle='#e8f0f8'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(sx+5,sy); ctx.lineTo(sx+s-2,sy+s-3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx,sy+6); ctx.lineTo(sx+s,sy+s-6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx+10,sy+2); ctx.lineTo(sx+s,sy+s); ctx.stroke();
  }
  else if(tile===T.BASALT){
    ctx.strokeStyle='#0a0a18'; ctx.lineWidth=1;
    const hx=s/2, hy=s/2;
    for(let a=0;a<6;a++){
      const a1=a*Math.PI/3, a2=(a+1)*Math.PI/3;
      ctx.beginPath();
      ctx.moveTo(sx+hx+Math.cos(a1)*7,sy+hy+Math.sin(a1)*7);
      ctx.lineTo(sx+hx+Math.cos(a2)*7,sy+hy+Math.sin(a2)*7);
      ctx.stroke();
    }
  }
  else if(tile===T.OBSIDIAN){
    ctx.fillStyle='rgba(80,40,120,0.18)';
    ctx.fillRect(sx,sy,s,3); ctx.fillRect(sx,sy,3,s);
    ctx.fillStyle='rgba(160,100,220,0.08)';
    ctx.fillRect(sx+s-3,sy,3,s); ctx.fillRect(sx,sy+s-3,s,3);
  }
  else if(tile===T.RUNE){
    const glyph=Math.floor(p*6);
    const pulse=0.6+0.4*Math.sin(t*1.8+p3*6.28);
    ctx.shadowColor='#4455ff'; ctx.shadowBlur=10*pulse;
    ctx.strokeStyle=`rgba(100,120,255,${pulse})`; ctx.lineWidth=1.5;
    ctx.beginPath();
    if(glyph===0){ ctx.moveTo(sx+4,sy+4); ctx.lineTo(sx+16,sy+16); ctx.moveTo(sx+16,sy+4); ctx.lineTo(sx+4,sy+16); }
    else if(glyph===1){ ctx.arc(sx+s/2,sy+s/2,6,0,Math.PI*2); }
    else if(glyph===2){ ctx.moveTo(sx+10,sy+4); ctx.lineTo(sx+16,sy+16); ctx.lineTo(sx+4,sy+16); ctx.closePath(); }
    else if(glyph===3){ ctx.moveTo(sx+4,sy+10); ctx.lineTo(sx+16,sy+10); ctx.moveTo(sx+10,sy+4); ctx.lineTo(sx+10,sy+16); }
    else if(glyph===4){ ctx.moveTo(sx+4,sy+4); ctx.lineTo(sx+16,sy+10); ctx.lineTo(sx+4,sy+16); ctx.closePath(); }
    else{ ctx.rect(sx+4,sy+4,12,12); }
    ctx.stroke(); ctx.shadowBlur=0;
  }
  else if(tile===T.ANCIENT){
    ctx.strokeStyle='#3a2a10'; ctx.lineWidth=0.8;
    ctx.strokeRect(sx+3,sy+3,s-6,s-6);
    ctx.beginPath(); ctx.moveTo(sx,sy+s/2); ctx.lineTo(sx+s,sy+s/2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx+s/2,sy); ctx.lineTo(sx+s/2,sy+s); ctx.stroke();
  }
  else if(tile===T.ART_WALL){
    ctx.fillStyle='#18120a';
    for(let i=0;i<3;i++){
      const ax=sx+4+Math.floor(ph(tx+i,ty,44)*12),ay=sy+4+Math.floor(ph(tx,ty+i,44)*12);
      ctx.fillRect(ax,ay,3,3);
    }
  }
  else if(tile===T.LAVA_ROCK){
    const pulse=0.5+0.5*Math.sin(t*1.2+p*6.28);
    ctx.strokeStyle=`rgba(200,80,0,${0.3*pulse})`; ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(sx+3,sy+5+Math.floor(p*4));
    ctx.lineTo(sx+10,sy+8+Math.floor(p2*4));
    ctx.lineTo(sx+s-3,sy+6+Math.floor(p3*4)); ctx.stroke();
  }
  else if(tile===T.LAVA){
    const pulse=(Math.sin(t*3+tx*0.5+ty*0.3)+1)*0.5;
    ctx.fillStyle=`rgb(${180+Math.floor(pulse*40)},${20+Math.floor(pulse*20)},0)`;
    ctx.fillRect(sx,sy,s,s);
    // Bubbles
    if(Math.sin(t*4+p*10)>0.8){
      ctx.fillStyle='rgba(255,120,0,0.6)';
      ctx.beginPath(); ctx.arc(sx+4+Math.floor(p*12),sy+4+Math.floor(p2*12),2,0,Math.PI*2); ctx.fill();
    }
  }
  else if(tile===T.MAGMA_X){
    const pulse=0.7+0.3*Math.sin(t*2+p*6.28);
    ctx.shadowColor='#ff6600'; ctx.shadowBlur=10*pulse;
    ctx.fillStyle=`rgba(255,80,0,${0.85*pulse})`;
    drawStar(ctx,sx+s/2,sy+s/2,6,s*0.42,s*0.18,6);
    ctx.shadowBlur=0;
  }
  else if(tile===T.VOID_STONE){
    ctx.fillStyle='rgba(60,80,180,0.12)';
    ctx.fillRect(sx,sy,s,1); ctx.fillRect(sx,sy,1,s);
  }
  else if(tile===T.VOID_X){
    const pulse=0.6+0.4*Math.sin(t*1.4+p*6.28);
    ctx.shadowColor='#cc00ff'; ctx.shadowBlur=18*pulse;
    ctx.fillStyle='#000005';
    ctx.fillRect(sx,sy,s,s);
    ctx.fillStyle=`rgba(160,0,255,${0.9*pulse})`;
    drawStar(ctx,sx+s/2,sy+s/2,8,s*0.44,s*0.16,8);
    ctx.fillStyle=`rgba(60,120,255,${0.6*pulse})`;
    drawStar(ctx,sx+s/2,sy+s/2,8,s*0.28,s*0.12,8);
    ctx.shadowBlur=0;
  }
  else if(tile===T.POWER_CELL){
    ctx.fillStyle='#000';
    ctx.fillRect(sx,sy,s,s);
    const pulse=0.7+0.3*Math.sin(t*3+p*6.28);
    ctx.shadowColor='#00ff88'; ctx.shadowBlur=14*pulse;
    ctx.strokeStyle=`rgba(0,220,100,${pulse})`; ctx.lineWidth=2;
    // Lightning bolt
    ctx.beginPath();
    ctx.moveTo(sx+12,sy+3); ctx.lineTo(sx+7,sy+11); ctx.lineTo(sx+11,sy+11);
    ctx.lineTo(sx+8,sy+17); ctx.lineTo(sx+14,sy+9); ctx.lineTo(sx+10,sy+9); ctx.closePath();
    ctx.stroke(); ctx.shadowBlur=0;
  }
  else if(tile===T.ARTIFACT){
    ctx.fillStyle='#000';
    ctx.fillRect(sx,sy,s,s);
    const pulse=0.7+0.3*Math.sin(t*2+p*6.28);
    ctx.shadowColor='#f5a623'; ctx.shadowBlur=18*pulse;
    ctx.strokeStyle=`rgba(245,166,35,${pulse})`; ctx.lineWidth=1.5;
    // Pentagram
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const a=i*Math.PI*4/5-Math.PI/2;
      const x2=sx+s/2+Math.cos(a)*7, y2=sy+s/2+Math.sin(a)*7;
      if(i===0) ctx.moveTo(x2,y2); else ctx.lineTo(x2,y2);
    }
    ctx.closePath(); ctx.stroke(); ctx.shadowBlur=0;
  }
  else if(tile===T.ROOT){
    ctx.strokeStyle='#2a1a08'; ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(sx+s/2,sy); ctx.lineTo(sx+s/2+Math.floor(p*8)-4,sy+s);
    ctx.stroke();
    if(p2<0.5){ ctx.beginPath(); ctx.moveTo(sx+s/2,sy+8); ctx.lineTo(sx+2,sy+s); ctx.stroke(); }
  }
}

function drawStar(ctx,cx,cy,spikes,outer,inner,spikes2){
  const pts=spikes2||spikes;
  ctx.beginPath();
  for(let i=0;i<pts*2;i++){
    const r=(i%2===0)?outer:inner;
    const a=i*Math.PI/pts-Math.PI/2;
    if(i===0) ctx.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);
    else ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);
  }
  ctx.closePath(); ctx.fill();
}

// ─── PARTICLE SYSTEM ─────────────────────────────────────────────────────────
function addPart(x,y,vx,vy,life,size,col,grav){
  if(parts.length>=MAX_PARTS) return;
  parts.push({x,y,vx,vy,life,maxLife:life,size,col,grav:grav||0});
}
function emitBreak(tx,ty,tile){
  const wx=(tx+0.5)*TS, wy=(ty+0.5)*TS;
  const col=TILE_COLS[tile]||'#888';
  for(let i=0;i<10;i++){
    const a=Math.random()*Math.PI*2,sp=30+Math.random()*80;
    addPart(wx,wy,Math.cos(a)*sp,Math.sin(a)*sp,0.5+Math.random()*0.6,2+Math.random()*3,col,120);
  }
}
function emitDrillStream(wx,wy,angle,tile){
  const col=TILE_COLS[tile]||'#888';
  const a=angle+((Math.random()-0.5)*0.6);
  const sp=20+Math.random()*40;
  addPart(wx,wy,Math.cos(a+Math.PI)*sp,Math.sin(a+Math.PI)*sp-10,0.15+Math.random()*0.2,1+Math.random()*2,col,60);
}
function emitThruster(wx,wy,facing){
  // wx/wy are world coords
  addPart(wx-facing*10,wy+6,-facing*(20+Math.random()*40),(Math.random()-0.5)*20,0.1+Math.random()*0.15,1.5+Math.random()*2,'rgba(180,120,40,0.7)',0);
}
function emitLanding(px,py){
  for(let i=0;i<8;i++){
    const a=Math.PI+(Math.random()-0.5)*Math.PI;
    addPart(px+(Math.random()-0.5)*16,py+PLAYER_H/2,Math.cos(a)*40,Math.sin(a)*20,0.25+Math.random()*0.2,2,TILE_COLS[T.DIRT],40);
  }
}
function emitCollect(wx,wy,col){
  for(let i=0;i<6;i++){
    const a=Math.random()*Math.PI*2;
    addPart(wx,wy,Math.cos(a)*30,Math.sin(a)*30-20,0.4+Math.random()*0.3,2,col,0);
  }
}
function updateParticles(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.vy+=p.grav*dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.life-=dt;
    if(p.life<=0){ parts.splice(i,1); }
  }
}
function drawParticles(){
  parts.forEach(p=>{
    const alpha=Math.min(1,p.life/p.maxLife*2);
    ctx.globalAlpha=alpha;
    ctx.fillStyle=p.col;
    ctx.fillRect(p.x-camX-p.size/2,p.y-camY-p.size/2,p.size,p.size);
  });
  ctx.globalAlpha=1;
}

// ─── PHYSICS & COLLISION ─────────────────────────────────────────────────────
function resolveX(nx){
  // Only check the leading-edge column so we never push from the wrong side
  const rowT=Math.floor((player.y-PLAYER_H/2+1)/TS);
  const rowB=Math.floor((player.y+PLAYER_H/2-1)/TS);
  if(player.vx>0){
    const col=Math.floor((nx+PLAYER_W/2)/TS);
    for(let r=rowT;r<=rowB;r++){
      if(solid(col,r)){ player.vx=0; return col*TS-PLAYER_W/2; }
    }
  } else if(player.vx<0){
    const col=Math.floor((nx-PLAYER_W/2)/TS);
    for(let r=rowT;r<=rowB;r++){
      if(solid(col,r)){ player.vx=0; return (col+1)*TS+PLAYER_W/2; }
    }
  }
  return nx;
}
function resolveY(ny){
  const colL=Math.floor((player.x-PLAYER_W/2+1)/TS);
  const colR=Math.floor((player.x+PLAYER_W/2-1)/TS);
  if(player.vy>0){
    const row=Math.floor((ny+PLAYER_H/2)/TS);
    for(let c=colL;c<=colR;c++){
      if(solid(c,row)){
        if(!player.onGround) emitLanding(player.x,ny);
        player.onGround=true; player.vy=0;
        return row*TS-PLAYER_H/2;
      }
    }
  } else if(player.vy<0){
    const row=Math.floor((ny-PLAYER_H/2)/TS);
    for(let c=colL;c<=colR;c++){
      if(solid(c,row)){ player.vy=0; return (row+1)*TS+PLAYER_H/2; }
    }
  }
  return ny;
}
function checkLava(){
  const tx=Math.floor(player.x/TS), ty=Math.floor(player.y/TS);
  for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
    if(gAt(tx+dx,ty+dy)===T.LAVA){
      const dmg=LAVA_DAMAGE*upgEff('hullPlating');
      player.energy-=dmg*(1/60);
      dmgFlashT=0.15;
      return;
    }
  }
}
function updatePhysics(dt){
  const subDt=dt/PHYS_STEPS;
  for(let step=0;step<PHYS_STEPS;step++){
    player.onGround=false;
    const thrMult=upgEff('thruster');
    const thr=THRUST*thrMult;

    // Thrust from keys or joystick
    const ix=(keys['ArrowRight']||keys['KeyD']?1:0)-(keys['ArrowLeft']||keys['KeyA']?1:0)+joyVec.x;
    const iy=(keys['ArrowDown']||keys['KeyS']?1:0)-(keys['ArrowUp']||keys['KeyW']?1:0)+joyVec.y;

    player.vx+=(ix>0?1:ix<0?-1:0)*thr*subDt;
    if(ix!==0) player.facing=ix>0?1:-1;

    if(iy<0) player.vy-=thr*subDt;
    if(iy>0) player.vy+=thr*0.5*subDt;

    player.vy+=GRAVITY*subDt;
    player.vx*=Math.exp(-DRAG_X*subDt);
    player.vy*=Math.exp(-DRAG_Y*subDt);

    // Clamp
    player.vx=Math.max(-MAX_VX,Math.min(MAX_VX,player.vx));
    player.vy=Math.max(-MAX_VY_UP,Math.min(MAX_VY_DOWN,player.vy));

    // Move X
    const nx=resolveX(player.x+player.vx*subDt);
    player.x=Math.max(PLAYER_W/2,Math.min(WW*TS-PLAYER_W/2,nx));

    // Move Y
    const ny=resolveY(player.y+player.vy*subDt);
    player.y=Math.max(PLAYER_H/2,Math.min(WH*TS-PLAYER_H/2,ny));
  }

  // Lava damage
  checkLava();

  // Energy drain (idle drain from environment)
  const layer=getLayer(Math.floor(player.y/TS));
  const envDrain=[0,0,0.4,0.8,1.2,1.8][layer]||0;
  player.energy-=envDrain*dt;
  player.energy=Math.max(0,Math.min(player.maxEnergy,player.energy));

  // Auto-collect (power cells + artifacts)
  if(upgLvl('autoCollect')>0){
    const tx=Math.floor(player.x/TS), ty=Math.floor(player.y/TS);
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
      const tile=gAt(tx+dx,ty+dy);
      if(tile===T.POWER_CELL||tile===T.ARTIFACT){
        collectTile(tx+dx,ty+dy);
      }
    }
  }

  // Surfacing check
  if(surfaceGrace>0) surfaceGrace-=dt;
  if(player.y<TS*SURFACE_ROW&&gameState==='DIVING'&&surfaceGrace<=0) triggerSurface();

  // Energy death
  if(player.energy<=0&&gameState==='DIVING') triggerSurface();

  // Depth tracking
  const depth=Math.floor(player.y/TS);
  if(depth>maxDepth) maxDepth=depth;
}

// ─── DRILL SYSTEM ─────────────────────────────────────────────────────────────
let drillTX=-1, drillTY=-1;

function getDrillTarget(){
  const psx=player.x-camX, psy=player.y-camY;
  const angle=Math.atan2(mouseY-psy,mouseX-psx);
  player.drillAngle=angle;
  const reach=TS*(1.8+upgEff('drillReach')*0.7);
  // Step along ray
  for(let d=TS*0.5;d<=reach;d+=4){
    const wx=player.x+Math.cos(angle)*d;
    const wy=player.y+Math.sin(angle)*d;
    const tx=Math.floor(wx/TS), ty=Math.floor(wy/TS);
    if(!inBounds(tx,ty)) break;
    const tile=grid[ty*WW+tx];
    if(tile!==T.AIR&&tile!==T.LAVA&&tile!==T.POWER_CELL&&tile!==T.ARTIFACT) return {tx,ty,wx,wy};
    if(tile===T.POWER_CELL||tile===T.ARTIFACT){ collectTile(tx,ty); return {tx:-1,ty:-1}; }
  }
  return {tx:-1,ty:-1};
}

function updateDrill(dt){
  const {tx,ty}=getDrillTarget();
  drillTX=tx; drillTY=ty;
  if(tx<0||ty<0) return;
  const tile=grid[ty*WW+tx];
  if(!TDEF[tile][2]) return; // not solid
  const hp=TDEF[tile][0];
  const rate=DRILL_BASE_RATE*upgEff('drillPower')*upgEff('drillSpeed')*dt;
  drill[ty*WW+tx]+=rate/hp;
  player.energy-=8*dt;
  // Emit particles occasionally
  if(Math.random()<0.6){
    const wx=tx*TS+TS/2, wy=ty*TS+TS/2;
    emitDrillStream(wx,wy,player.drillAngle,tile);
  }
  if(drill[ty*WW+tx]>=1){
    emitBreak(tx,ty,tile);
    collectTile(tx,ty);
    grid[ty*WW+tx]=T.AIR;
    drill[ty*WW+tx]=0;
    tilesDrilled++;
    drillTX=-1; drillTY=-1;
  }
}

function collectTile(tx,ty){
  const tile=grid[ty*WW+tx];
  const val=TDEF[tile][1];
  if(tile===T.POWER_CELL){
    player.energy=Math.min(player.maxEnergy,player.energy+40);
    emitCollect((tx+0.5)*TS,(ty+0.5)*TS,'#00ff88');
    grid[ty*WW+tx]=T.AIR;
  } else if(tile===T.ARTIFACT){
    coins+=TDEF[T.ARTIFACT][1];
    emitCollect((tx+0.5)*TS,(ty+0.5)*TS,'#f5a623');
    grid[ty*WW+tx]=T.AIR;
  } else if(val>0){
    coins+=val;
    emitCollect((tx+0.5)*TS,(ty+0.5)*TS,TILE_COLS[tile]||'#f5a623');
  }
}

// ─── RADAR ───────────────────────────────────────────────────────────────────
let radarReveal=[];
function doRadar(){
  if(upgLvl('radarPulse')===0) return;
  const range=upgEff('radarPulse');
  const tx=Math.floor(player.x/TS), ty=Math.floor(player.y/TS);
  radarReveal=[];
  for(let dy=-range;dy<=range;dy++) for(let dx=-range;dx<=range;dx++){
    if(dx*dx+dy*dy>range*range) continue;
    const rtx=tx+dx,rty=ty+dy;
    if(!inBounds(rtx,rty)) continue;
    const tile=grid[rty*WW+rtx];
    if(tile===T.CRYSTAL||tile===T.FOSSIL||tile===T.ARTIFACT||tile===T.POWER_CELL||tile===T.VOID_X||tile===T.MAGMA_X){
      radarReveal.push({tx:rtx,ty:rty,tile});
    }
  }
  radarT=2.5;
}

// ─── CAMERA ──────────────────────────────────────────────────────────────────
function updateCamera(dt){
  const tgX=player.x-W/2;
  const tgY=player.y-H/2;
  camX+=(tgX-camX)*12*dt;
  camY+=(tgY-camY)*12*dt;
  camX=Math.max(0,Math.min(WW*TS-W,camX));
  camY=Math.max(0,Math.min(WH*TS-H,camY));
}

// ─── LIGHTING SYSTEM ─────────────────────────────────────────────────────────
function drawLighting(){
  const layer=getLayer(Math.floor(player.y/TS));
  const L=LAYERS[layer];
  lctx.clearRect(0,0,W,H);
  lctx.fillStyle=`rgba(${L.r},${L.g},${L.b},${L.dark})`;
  lctx.fillRect(0,0,W,H);

  lctx.globalCompositeOperation='destination-out';

  // Player light
  const lr=BASE_LIGHT_R*upgEff('lightRadius');
  const px=player.x-camX, py=player.y-camY;
  const pg=lctx.createRadialGradient(px,py,0,px,py,lr);
  pg.addColorStop(0,'rgba(0,0,0,1)');
  pg.addColorStop(0.55,'rgba(0,0,0,0.65)');
  pg.addColorStop(1,'rgba(0,0,0,0)');
  lctx.fillStyle=pg;
  lctx.fillRect(0,0,W,H);

  // Drill direction cone
  if(mouseDown||mobileDrill){
    const angle=player.drillAngle;
    const coneLen=lr*0.8;
    const cg=lctx.createRadialGradient(px,py,0,px+Math.cos(angle)*coneLen,py+Math.sin(angle)*coneLen,coneLen*0.5);
    cg.addColorStop(0,'rgba(0,0,0,0.5)');
    cg.addColorStop(1,'rgba(0,0,0,0)');
    lctx.fillStyle=cg;
    lctx.fillRect(0,0,W,H);
  }

  // Glow tiles in viewport
  const tx0=Math.floor(camX/TS)-1, tx1=Math.ceil((camX+W)/TS)+1;
  const ty0=Math.floor(camY/TS)-1, ty1=Math.ceil((camY+H)/TS)+1;
  for(let ty=Math.max(0,ty0);ty<=Math.min(WH-1,ty1);ty++){
    for(let tx2=Math.max(0,tx0);tx2<=Math.min(WW-1,tx1);tx2++){
      const tile=grid[ty*WW+tx2];
      const glow=TDEF[tile]&&TDEF[tile][3];
      if(!glow) continue;
      const sx=(tx2+0.5)*TS-camX, sy2=(ty+0.5)*TS-camY;
      const r=tile===T.VOID_X?50:tile===T.CRYSTAL||tile===T.MAGMA_X?36:24;
      const pulse=0.7+0.3*Math.sin(t*2+tx2*0.3+ty*0.4);
      const gg=lctx.createRadialGradient(sx,sy2,0,sx,sy2,r*pulse);
      gg.addColorStop(0,'rgba(0,0,0,0.8)');
      gg.addColorStop(1,'rgba(0,0,0,0)');
      lctx.fillStyle=gg;
      lctx.beginPath(); lctx.arc(sx,sy2,r*pulse,0,Math.PI*2); lctx.fill();
    }
  }

  lctx.globalCompositeOperation='source-over';
  ctx.drawImage(lightCnv,0,0);
}

// Crystal ambient color overlay
function drawCrystalGlow(){
  const tx0=Math.floor(camX/TS)-1, tx1=Math.ceil((camX+W)/TS)+1;
  const ty0=Math.floor(camY/TS)-1, ty1=Math.ceil((camY+H)/TS)+1;
  ctx.save();
  ctx.globalCompositeOperation='screen';
  for(let ty=Math.max(0,ty0);ty<=Math.min(WH-1,ty1);ty++){
    for(let tx2=Math.max(0,tx0);tx2<=Math.min(WW-1,tx1);tx2++){
      const tile=grid[ty*WW+tx2];
      const glowCol=TDEF[tile]&&TDEF[tile][3];
      if(!glowCol) continue;
      const sx=(tx2+0.5)*TS-camX, sy=(ty+0.5)*TS-camY;
      const r=tile===T.VOID_X?40:tile===T.CRYSTAL||tile===T.MAGMA_X?30:20;
      const pulse=0.4+0.2*Math.sin(t*2+tx2*0.3+ty*0.4);
      const gg=ctx.createRadialGradient(sx,sy,0,sx,sy,r);
      gg.addColorStop(0,glowCol.replace('#','rgba(').replace(/(.{2})(.{2})(.{2})/,(_,r2,g2,b2)=>`rgba(${parseInt(r2,16)},${parseInt(g2,16)},${parseInt(b2,16)},${pulse})`)||glowCol);
      gg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=gg;
      ctx.fillRect(sx-r,sy-r,r*2,r*2);
    }
  }
  ctx.restore();
}

// Glow color to rgba helper
function hexToRgba(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ─── MECH / PLAYER DRAWING ───────────────────────────────────────────────────
function drawMech(){
  const sx=player.x-camX, sy=player.y-camY;
  ctx.save();

  // Thruster particles (world coords)
  if(Math.abs(player.vx)>10||Math.abs(player.vy)>10){
    if(Math.random()<0.4) emitThruster(player.x,player.y,player.facing);
  }

  // Body — angular polygon (mech shape)
  ctx.shadowColor='#f5a623';
  ctx.shadowBlur=10+3*Math.sin(t*2);
  ctx.fillStyle=player.hullFlash>0?'#ff6633':'#f5a623';
  ctx.beginPath();
  const bw=9, bh=11;
  ctx.moveTo(sx,sy-bh);
  ctx.lineTo(sx+bw,sy-bh+4);
  ctx.lineTo(sx+bw,sy+bh-4);
  ctx.lineTo(sx,sy+bh);
  ctx.lineTo(sx-bw,sy+bh-4);
  ctx.lineTo(sx-bw,sy-bh+4);
  ctx.closePath();
  ctx.fill();

  // Visor
  ctx.fillStyle='rgba(0,200,255,0.7)';
  ctx.fillRect(sx-5,sy-5,10,5);

  // Drill bit (rotates toward mouse)
  ctx.translate(sx,sy);
  ctx.rotate(player.drillAngle);
  const drillGlow=(mouseDown||mobileDrill)?'#ffff00':'#ffcc44';
  ctx.shadowColor=drillGlow;
  ctx.shadowBlur=mouseDown||mobileDrill?16:6;
  ctx.fillStyle=drillGlow;
  ctx.beginPath();
  ctx.moveTo(14,0); ctx.lineTo(9,-5); ctx.lineTo(9,5);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur=0;

  ctx.restore();

  // Low energy vignette flicker
  if(player.energy<player.maxEnergy*0.25){
    const alpha=0.2+0.15*Math.sin(t*8);
    ctx.fillStyle=`rgba(255,0,0,${alpha})`;
    ctx.fillRect(0,0,W,H);
  }
}

// ─── LAYER BACKGROUND ────────────────────────────────────────────────────────
function drawBackground(){
  const layer=getLayer(Math.floor(player.y/TS));
  const pct=(player.y/TS-LAYERS[layer].start)/(LAYERS[layer].end-LAYERS[layer].start+1);
  let bg1,bg2;
  switch(layer){
    case 0: bg1='#040a0a'; bg2='#050a06'; break;
    case 1: bg1='#030608'; bg2='#040508'; break;
    case 2: bg1='#02050e'; bg2='#030410'; break;
    case 3: bg1='#010308'; bg2='#020208'; break;
    case 4: bg1='#060100'; bg2='#080000'; break;
    case 5: bg1='#000005'; bg2='#000002'; break;
    default:bg1='#000';   bg2='#000';
  }
  const grd=ctx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,bg1); grd.addColorStop(1,bg2);
  ctx.fillStyle=grd;
  ctx.fillRect(0,0,W,H);

  // Layer-specific atmosphere
  if(layer===4){ // Magma — heat shimmer dots
    ctx.fillStyle='rgba(200,60,0,0.03)';
    for(let i=0;i<30;i++){
      const px2=Math.floor(ph(i,Math.floor(t*2),77)*W);
      const py2=Math.floor(ph(i,Math.floor(t*2+1),77)*H);
      ctx.beginPath(); ctx.arc(px2,py2,2+Math.sin(t*3+i)*2,0,Math.PI*2); ctx.fill();
    }
  }
  if(layer===5){ // Void — sparks
    ctx.fillStyle='rgba(100,0,255,0.6)';
    for(let i=0;i<8;i++){
      if(Math.random()<0.05){
        ctx.fillRect(Math.floor(Math.random()*W),Math.floor(Math.random()*H),1,1);
      }
    }
  }
}

// ─── MAIN RENDER ─────────────────────────────────────────────────────────────
function drawDrillProgress(){
  const tx0=Math.floor(camX/TS)-1, tx1=Math.ceil((camX+W)/TS)+1;
  const ty0=Math.floor(camY/TS)-1, ty1=Math.ceil((camY+H)/TS)+1;
  for(let ty=Math.max(0,ty0);ty<=Math.min(WH-1,ty1);ty++){
    for(let tx2=Math.max(0,tx0);tx2<=Math.min(WW-1,tx1);tx2++){
      const p=drill[ty*WW+tx2];
      if(p<0.1) continue;
      const sx=tx2*TS-camX, sy=ty*TS-camY;
      ctx.strokeStyle=`rgba(255,255,255,${p*0.7})`;
      ctx.lineWidth=1;
      const cx=sx+TS/2, cy=sy+TS/2;
      // Crack lines
      for(let c=0;c<3;c++){
        const a=ph(tx2,ty,c)*Math.PI*2;
        ctx.beginPath();
        ctx.moveTo(cx,cy);
        ctx.lineTo(cx+Math.cos(a)*TS*0.5*p,cy+Math.sin(a)*TS*0.5*p);
        ctx.stroke();
      }
    }
  }
}

function drawDrillTarget(){
  if(drillTX<0) return;
  const sx=drillTX*TS-camX, sy=drillTY*TS-camY;
  ctx.strokeStyle='rgba(255,200,50,0.5)';
  ctx.lineWidth=1;
  ctx.strokeRect(sx+1,sy+1,TS-2,TS-2);
}

function drawDrillLine(){
  if(!(mouseDown||mobileDrill)) return;
  const sx=player.x-camX, sy=player.y-camY;
  ctx.strokeStyle='rgba(245,166,35,0.25)';
  ctx.lineWidth=1;
  ctx.setLineDash([3,6]);
  ctx.beginPath();
  ctx.moveTo(sx,sy);
  ctx.lineTo(sx+Math.cos(player.drillAngle)*80,sy+Math.sin(player.drillAngle)*80);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawRadarBlips(){
  if(radarT<=0) return;
  const alpha=Math.min(1,radarT);
  radarReveal.forEach(({tx,ty,tile})=>{
    const sx=tx*TS+TS/2-camX, sy=ty*TS+TS/2-camY;
    const col=TDEF[tile][3]||'#f5a623';
    ctx.fillStyle=col.replace('#','rgba(').replace(/(.{2})(.{2})(.{2})/,(_,r,g,b)=>
      `rgba(${parseInt(r,16)},${parseInt(g,16)},${parseInt(b,16)},${alpha*0.9})`)||col;
    ctx.beginPath(); ctx.arc(sx,sy,4,0,Math.PI*2); ctx.fill();
  });
}

function drawArtifactScanner(){
  if(upgLvl('artScanner')===0) return;
  const range=12, tx=Math.floor(player.x/TS), ty2=Math.floor(player.y/TS);
  for(let dy=-range;dy<=range;dy++) for(let dx=-range;dx<=range;dx++){
    const rtx=tx+dx,rty=ty2+dy;
    if(!inBounds(rtx,rty)) continue;
    const tile=grid[rty*WW+rtx];
    if(tile!==T.ARTIFACT&&tile!==T.POWER_CELL) continue;
    const sx=rtx*TS-camX, sy=rty*TS-camY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    const alpha=Math.max(0,0.5-dist/range*0.5);
    ctx.strokeStyle=tile===T.ARTIFACT?`rgba(245,166,35,${alpha})`:`rgba(0,255,136,${alpha})`;
    ctx.lineWidth=1;
    ctx.strokeRect(sx,sy,TS,TS);
  }
}

function render(){
  drawBackground();

  // Draw tiles
  const tx0=Math.floor(camX/TS)-1, tx1=Math.ceil((camX+W)/TS)+1;
  const ty0=Math.floor(camY/TS)-1, ty1=Math.ceil((camY+H)/TS)+1;
  for(let ty=Math.max(0,ty0);ty<=Math.min(WH-1,ty1);ty++){
    for(let tx2=Math.max(0,tx0);tx2<=Math.min(WW-1,tx1);tx2++){
      const tile=grid[ty*WW+tx2];
      if(tile===T.AIR) continue;
      drawTile(tile,tx2*TS-camX,ty*TS-camY,tx2,ty);
    }
  }

  drawCrystalGlow();
  drawDrillProgress();
  drawDrillTarget();
  drawArtifactScanner();
  drawRadarBlips();
  drawParticles();
  drawDrillLine();
  drawMech();
  drawLighting();
}

// ─── HUD UPDATES ─────────────────────────────────────────────────────────────
const ebarEl=document.getElementById('ebar');
const ebarValEl=document.getElementById('ebar-val');
const depthValEl=document.getElementById('depth-val');
const depthLayerEl=document.getElementById('depth-layer');
const hudCoinsEl=document.getElementById('hud-coins');
const layerBannerEl=document.getElementById('layer-banner');
const dmgFlashEl=document.getElementById('dmg-flash');

function updateHUD(){
  const ePct=player.energy/player.maxEnergy;
  ebarEl.style.width=(ePct*100)+'%';
  ebarEl.classList.toggle('low',ePct<0.2);
  ebarValEl.textContent=Math.ceil(player.energy)+'/'+player.maxEnergy;
  const depth=Math.floor(player.y/TS);
  depthValEl.textContent=depth+'m';
  const layer=getLayer(depth);
  depthLayerEl.textContent=LAYERS[layer].name;
  hudCoinsEl.textContent=coins;

  // Layer banner
  if(layer!==lastLayer){
    if(lastLayer>=0){
      layerBannerEl.textContent=LAYERS[layer].name;
      layerBannerEl.classList.add('show');
      layerBannerT=2.5;
    }
    lastLayer=layer;
  }
  if(layerBannerT>0){
    layerBannerT-=1/60;
    if(layerBannerT<=0){ layerBannerEl.classList.remove('show'); layerBannerT=0; }
  }

  // Damage flash
  if(dmgFlashT>0){
    dmgFlashT-=1/60;
    dmgFlashEl.classList.add('flash');
    player.hullFlash=dmgFlashT;
  } else {
    dmgFlashEl.classList.remove('flash');
    player.hullFlash=0;
  }

  // Radar
  if(radarT>0) radarT-=1/60;
}

// ─── GAME STATE MACHINE ───────────────────────────────────────────────────────
function startDive(){
  generateWorld();
  drill.fill(0);
  parts.length=0;
  player.x=WW*TS/2; player.y=TS*10;
  player.vx=0; player.vy=0;
  player.maxEnergy=100+upgEff('energyCore');
  player.energy=player.maxEnergy;
  player.drillAngle=Math.PI/2;
  player.onGround=false;
  coins=0; maxDepth=0; tilesDrilled=0;
  radarReveal=[]; radarT=0; lastLayer=-1; layerBannerT=0; surfaceGrace=3;
  camX=Math.max(0,Math.min(WW*TS-W,player.x-W/2));
  camY=Math.max(0,Math.min(WH*TS-H,player.y-H/2));
  joyVec={x:0,y:0}; mouseDown=false; mobileDrill=false;
  gameState='DIVING';
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('base').classList.remove('visible');
  const mc=document.getElementById('mc');
  mc.classList.toggle('show','ontouchstart' in window);
}

function triggerSurface(){
  if(gameState!=='DIVING') return;
  gameState='SURFACING';
  surfacingT=0.8;
  mouseDown=false; mobileDrill=false;
}

function showBase(){
  gameState='BASE';
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('base').classList.add('visible');

  // Update bank
  bank+=coins;
  saveSave();

  // Run summary
  document.getElementById('s-depth').textContent=maxDepth+'m';
  document.getElementById('s-coins').textContent=coins;
  document.getElementById('s-tiles').textContent=tilesDrilled;
  document.getElementById('bank-val').textContent=bank;

  // Best depth
  const bestDepth=parseInt(localStorage.getItem(SK.best)||'0');
  if(maxDepth>bestDepth) localStorage.setItem(SK.best,maxDepth);
  localStorage.setItem(SK.runs,(parseInt(localStorage.getItem(SK.runs)||'0')+1).toString());

  renderUpgrades();
}

// ─── UPGRADE UI ───────────────────────────────────────────────────────────────
function renderUpgrades(){
  document.getElementById('bank-val').textContent=bank;
  const grid2=document.getElementById('upg-grid');
  grid2.innerHTML='';
  UPG_DEFS.forEach(ud=>{
    const lv=upgLvl(ud.id);
    const maxed=lv>=ud.max;
    const cost=maxed?'--':ud.costs[lv];
    const canAfford=!maxed&&bank>=cost;
    const card=document.createElement('div');
    card.className='upg-card';
    let pips='';
    for(let i=0;i<ud.max;i++) pips+=`<div class="pip${i<lv?' filled':''}"></div>`;
    card.innerHTML=`
      <div class="upg-cat">${ud.cat}</div>
      <div class="upg-name">${ud.name}</div>
      <div class="upg-desc">${ud.desc}</div>
      <div class="upg-pips">${pips}</div>
      <button class="upg-btn${maxed?' maxed':''}" ${maxed||!canAfford?'disabled':''}
        data-id="${ud.id}">
        ${maxed?'MAXED':'BUY — '+cost+' COINS'}
      </button>
    `;
    grid2.appendChild(card);
  });
  grid2.querySelectorAll('.upg-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id=btn.dataset.id;
      const ud=UPG_DEFS.find(u=>u.id===id);
      const lv=upgLvl(id);
      if(lv>=ud.max) return;
      const cost=ud.costs[lv];
      if(bank<cost) return;
      bank-=cost;
      upgLevels[id]=(lv+1);
      saveSave();
      renderUpgrades();
    });
  });
}

// ─── SURFACING ANIMATION ──────────────────────────────────────────────────────
function updateSurfacing(dt){
  surfacingT-=dt;
  player.vy=-280;
  player.vx*=0.9;
  updateCamera(dt);
  // Bright flash at end
  const alpha=Math.max(0,1-surfacingT/0.8)*0.6;
  ctx.fillStyle=`rgba(255,255,255,${alpha})`;
  ctx.fillRect(0,0,W,H);
  if(surfacingT<=0) showBase();
}

// ─── MAIN LOOP ────────────────────────────────────────────────────────────────
function loop(timestamp){
  requestAnimationFrame(loop);
  const rawDt=(timestamp-lastT)/1000;
  lastT=timestamp;
  t+=rawDt;
  const dt=Math.min(rawDt,DT_CAP);

  if(gameState==='DIVING'){
    updatePhysics(dt);
    if(mouseDown||mobileDrill) updateDrill(dt);
    updateCamera(dt);
    updateParticles(dt);
    render();
    updateHUD();
  } else if(gameState==='SURFACING'){
    updateParticles(dt);
    render();
    updateSurfacing(dt);
    updateHUD();
  } else if(gameState==='MENU'){
    drawMenuBg();
  }
}

// ─── MENU BACKGROUND ANIMATION ───────────────────────────────────────────────
let menuScrollY=0;
function drawMenuBg(){
  menuScrollY=(menuScrollY+20/60)%TS;
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,W,H);
  // Scrolling layer strips
  const strips=[
    {y:0,  h:100,col:'#050a06'},
    {y:100,h:150,col:'#030608'},
    {y:250,h:200,col:'#02050e'},
    {y:450,h:100,col:'#010308'},
  ];
  strips.forEach(s=>{
    ctx.fillStyle=s.col;
    ctx.fillRect(0,s.y-menuScrollY*2,W,s.h);
  });
  // Crystal glow dots
  for(let i=0;i<6;i++){
    const gx=(i*137+50)%W, gy=((i*200+menuScrollY*3)%(H+50))-25;
    const pulse=0.4+0.3*Math.sin(t*1.5+i);
    ctx.fillStyle=`rgba(0,200,255,${pulse})`;
    ctx.beginPath(); ctx.arc(gx,gy,2,0,Math.PI*2); ctx.fill();
  }
  // Amber mech silhouette
  const mx=W/2, my=H*0.55+Math.sin(t*0.8)*6;
  ctx.fillStyle='rgba(245,166,35,0.15)';
  ctx.beginPath();
  ctx.moveTo(mx,my-20); ctx.lineTo(mx+14,my-12); ctx.lineTo(mx+14,my+12);
  ctx.lineTo(mx,my+20); ctx.lineTo(mx-14,my+12); ctx.lineTo(mx-14,my-12);
  ctx.closePath(); ctx.fill();
}

// ─── INPUT ────────────────────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='KeyR'||e.code==='Escape'){
    if(gameState==='DIVING') triggerSurface();
  }
  if(e.code==='KeyE') doRadar();
  if(e.code==='KeyD'||e.code==='ArrowRight') e.preventDefault();
  if(e.code==='KeyA'||e.code==='ArrowLeft') e.preventDefault();
  if(e.code==='Space') e.preventDefault();
});
document.addEventListener('keyup',e=>{ keys[e.code]=false; });

canvas.addEventListener('mousemove',e=>{
  mouseX=e.clientX; mouseY=e.clientY;
});
canvas.addEventListener('mousedown',e=>{
  if(e.button===0&&gameState==='DIVING') mouseDown=true;
});
canvas.addEventListener('mouseup',e=>{ if(e.button===0) mouseDown=false; });
canvas.addEventListener('contextmenu',e=>e.preventDefault());

// Joystick
const jzone=document.getElementById('jzone');
const jthumb=document.getElementById('jthumb');
jzone.addEventListener('touchstart',e=>{
  e.preventDefault();
  const touch=e.changedTouches[0];
  joyID=touch.identifier;
  joyOrigin={x:touch.clientX,y:touch.clientY};
},{passive:false});
jzone.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const touch of e.changedTouches){
    if(touch.identifier!==joyID) continue;
    const dx=touch.clientX-joyOrigin.x, dy=touch.clientY-joyOrigin.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    const maxD=50;
    const nx=dx/Math.max(dist,maxD), ny=dy/Math.max(dist,maxD);
    joyVec.x=Math.abs(dx)>8?Math.sign(dx)*Math.min(1,dist/maxD):0;
    joyVec.y=Math.abs(dy)>8?Math.sign(dy)*Math.min(1,dist/maxD):0;
    const clampX=Math.min(maxD,Math.abs(dx))*Math.sign(dx);
    const clampY=Math.min(maxD,Math.abs(dy))*Math.sign(dy);
    jthumb.style.transform=`translate(${clampX}px,${clampY}px)`;
  }
},{passive:false});
jzone.addEventListener('touchend',e=>{
  joyVec={x:0,y:0};
  jthumb.style.transform='none';
  joyOrigin=null; joyID=-1;
},{passive:false});

// Mobile drill button
const drillMb=document.getElementById('drill-mb');
drillMb.addEventListener('touchstart',e=>{ e.preventDefault(); mobileDrill=true; drillMb.classList.add('active'); },{passive:false});
drillMb.addEventListener('touchend',e=>{ e.preventDefault(); mobileDrill=false; drillMb.classList.remove('active'); },{passive:false});
drillMb.addEventListener('touchmove',e=>{
  e.preventDefault();
  const touch=e.changedTouches[0];
  mouseX=touch.clientX; mouseY=touch.clientY;
},{passive:false});

// Right side touch = drill aiming
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  for(const touch of e.changedTouches){
    if(touch.clientX>W/2){
      mouseX=touch.clientX; mouseY=touch.clientY;
      mobileDrill=true;
    }
  }
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const touch of e.changedTouches){
    if(touch.clientX>W/2){ mouseX=touch.clientX; mouseY=touch.clientY; }
  }
},{passive:false});
canvas.addEventListener('touchend',e=>{
  for(const touch of e.changedTouches){
    if(touch.clientX>W/2) mobileDrill=false;
  }
},{passive:false});

// Buttons
document.getElementById('play-btn').addEventListener('click',startDive);
document.getElementById('surface-btn').addEventListener('click',()=>{ if(gameState==='DIVING') triggerSurface(); });
document.getElementById('dive-btn').addEventListener('click',()=>{
  document.getElementById('base').classList.remove('visible');
  startDive();
});

// ─── BOOT ─────────────────────────────────────────────────────────────────────
loadSave();
lastT=performance.now();
requestAnimationFrame(loop);
</script>
