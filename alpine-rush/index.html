<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ALPINE RUSH — UMBRA DIRECTORATE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;background:#87ceeb;}
canvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%;}

/* Overlay (title + death screen) */
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;pointer-events:all;transition:opacity 0.4s;}
#overlay.gone{opacity:0;pointer-events:none;}

/* Mobile controls */
#mobile-controls{position:fixed;bottom:0;left:0;width:100%;height:80px;z-index:15;display:none;pointer-events:none;}
@media(pointer:coarse){#mobile-controls{display:flex;}}
.mc-zone{flex:1;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:rgba(30,60,100,0.45);background:rgba(255,255,255,0.08);border-top:1px solid rgba(255,255,255,0.08);pointer-events:all;user-select:none;-webkit-user-select:none;}
#mc-shoot{background:rgba(255,255,255,0.12);}
#mc-jump-btn{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);font-family:'Exo 2',sans-serif;font-size:0.62rem;letter-spacing:3px;font-weight:700;color:rgba(30,60,100,0.65);background:rgba(255,255,255,0.28);padding:10px 26px;border-radius:24px;pointer-events:all;user-select:none;-webkit-user-select:none;display:none;border:1px solid rgba(255,255,255,0.3);}
@media(pointer:coarse){#mc-jump-btn{display:block;}}

/* Restart overlay button */
#restart-btn{position:fixed;display:none;left:50%;transform:translateX(-50%);font-family:'Exo 2',sans-serif;font-weight:900;font-size:0.72rem;letter-spacing:5px;color:#fff;background:#1a3a6e;padding:14px 42px;border:none;border-radius:5px;cursor:pointer;z-index:25;pointer-events:all;}
#restart-btn:hover{background:#1e4a8a;}
#hub-link{position:fixed;display:none;bottom:28px;left:50%;transform:translateX(-50%);font-family:'Rajdhani',sans-serif;font-size:0.58rem;letter-spacing:3px;color:rgba(30,60,100,0.55);text-decoration:none;z-index:25;}
#hub-link:hover{color:rgba(30,60,100,0.85);}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<!-- Title overlay -->
<div id="overlay">
  <div style="text-align:center;font-family:'Exo 2',sans-serif;">
    <div style="font-size:0.58rem;letter-spacing:6px;color:rgba(30,80,120,0.7);margin-bottom:16px;font-family:'Rajdhani',sans-serif;">UMBRA DIRECTORATE</div>
    <div style="font-size:clamp(2.4rem,8vw,4rem);font-weight:900;letter-spacing:6px;color:#1a2a3a;text-shadow:0 2px 24px rgba(100,160,220,0.4);">ALPINE RUSH</div>
    <div style="font-size:0.62rem;letter-spacing:4px;color:rgba(30,80,120,0.6);margin-top:10px;font-family:'Rajdhani',sans-serif;">INFINITE DESCENT · ZERO MERCY</div>
    <div style="margin-top:48px;">
      <button id="play-btn" style="font-family:'Exo 2',sans-serif;font-weight:900;font-size:0.8rem;letter-spacing:6px;color:#fff;background:linear-gradient(135deg,#cc2222,#8b0000);border:none;padding:16px 52px;clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%);cursor:pointer;box-shadow:0 0 32px rgba(200,30,30,0.35);">DESCEND</button>
    </div>
    <div style="margin-top:28px;font-size:0.52rem;letter-spacing:2.5px;color:rgba(40,80,120,0.5);font-family:'Rajdhani',sans-serif;line-height:2;">
      ARROWS / WASD &nbsp;·&nbsp; MOVE &nbsp;&nbsp;|&nbsp;&nbsp; SPACE / ↑ &nbsp;·&nbsp; JUMP<br>
      F / HOLD ↑ IN AIR &nbsp;·&nbsp; FLIP &nbsp;&nbsp;|&nbsp;&nbsp; X &nbsp;·&nbsp; THROW SNOWBALL
    </div>
    <div style="margin-top:16px;"><a href="../index.html" style="font-size:0.5rem;letter-spacing:3px;color:rgba(40,80,120,0.4);text-decoration:none;font-family:'Rajdhani',sans-serif;">◂ BACK TO HUB</a></div>
  </div>
</div>

<!-- Mobile controls -->
<div id="mobile-controls">
  <div class="mc-zone" id="mc-left">◀</div>
  <div class="mc-zone" id="mc-shoot">⛄</div>
  <div class="mc-zone" id="mc-right">▶</div>
</div>
<div id="mc-jump-btn">↑ JUMP</div>

<!-- Death screen actions (HTML overlays for accurate hit testing) -->
<button id="restart-btn">BACK TO SLOPE</button>
<a id="hub-link" href="../index.html">◂ UMBRA DIRECTORATE</a>

<script>
'use strict';

// ── SECTION 1: CONSTANTS ────────────────────────────────────────
const GRAVITY            = 0.45;
const JUMP_POWER         = 11;
const FLIP_SPEED         = 4.5;
const FLIP_THRESHOLD     = 340;
const BASE_SCROLL_SPEED  = 3.5;
const MAX_SCROLL_SPEED   = 9;
const SPEED_RAMP         = 0.003;
const GROUND_Y_FRAC      = 0.68;
const PLAYER_MOVE_SPEED  = 5.5;
const PLAYER_W           = 24;
const PLAYER_H           = 46;
const SNOWBALL_MAX       = 5;
const SNOWBALL_PICKUP_R  = 12;
const SNOWBALL_PROJ_SPD  = 10;
const SNOWBALL_PROJ_R    = 8;
const FLIP_BONUS         = 500;
const WIPEOUT_DUR        = 1300;
const SPAWN_BASE         = 2200;
const SPAWN_MIN          = 620;
const PICKUP_INTERVAL    = 3600;
const INVINCIBLE_DUR     = 2000;

const OBSTACLE_DEFS = {
  tree:     {w:40, h:60, hp:1},
  rock:     {w:55, h:40, hp:2},
  barrier:  {w:120,h:28, hp:1},
  avalanche:{w:46, h:36, hp:1},
  skier:    {w:22, h:42, hp:999},
};

// ── SECTION 2: STATE VARIABLES ──────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
let W, H, groundY;

let gameState    = 'MENU'; // MENU | PLAYING | DEAD
let score        = 0;
let bestScore    = parseInt(localStorage.getItem('ar_best')||'0');
let multiplier   = 1;
let scrollSpeed  = BASE_SCROLL_SPEED;
let scrollOffset = 0;
let spawnTimer   = 0;
let pickupTimer  = 0;
let invincibleUntil = 0;
let loopGen      = 0;
let lastTime     = 0;

let snowballs    = 0;
let obstacles    = [];
let projectiles  = [];
let pickupItems  = [];
let particles    = [];
let wipeoutPcs   = [];

const player = {
  x:0, y:0, vy:0,
  state:'SKIING', // SKIING|AIRBORNE|FLIPPING|LANDING_OK|WIPEOUT|DEAD
  flipAngle:0,
  landingFlash:0,
  wipeoutTimer:0,
};

const keys = {};
const touch = {left:false, right:false, center:false, swipeStartY:null, airTap:false};

// ── SECTION 3: PARALLAX BACKGROUND ─────────────────────────────

function drawSky(ctx,W,H){
  const g=ctx.createLinearGradient(0,0,0,H*0.72);
  g.addColorStop(0,'#87ceeb');
  g.addColorStop(0.45,'#b4dcf0');
  g.addColorStop(1,'#d8eef8');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}

function drawMountainLayer(ctx,off,W,H){
  const tileW=600;
  const shift=-(off%tileW);
  ctx.save(); ctx.translate(shift,0);
  for(let rep=-1;rep<=2;rep++){
    ctx.save(); ctx.translate(rep*tileW,0);
    // Back range
    ctx.fillStyle='#c5d8e8';
    ctx.beginPath();
    const pts=[[0,0.55],[0.07,0.3],[0.13,0.44],[0.21,0.17],[0.34,0.38],[0.44,0.22],[0.54,0.4],[0.64,0.14],[0.77,0.34],[0.87,0.19],[1,0.3],[1,0.56]];
    pts.forEach(([fx,fy],i)=>{ i===0?ctx.moveTo(fx*tileW,fy*H):ctx.lineTo(fx*tileW,fy*H); });
    ctx.lineTo(tileW,H*0.56);ctx.lineTo(0,H*0.56);ctx.closePath();ctx.fill();
    // Snow caps
    ctx.fillStyle='#f2f9ff';
    [[0.21,0.17,0.035],[0.64,0.14,0.042],[0.87,0.19,0.028]].forEach(([fx,fy,s])=>{
      ctx.beginPath();
      ctx.moveTo(fx*tileW,fy*H);
      ctx.lineTo((fx-s)*tileW,(fy+0.072)*H);
      ctx.lineTo((fx+s)*tileW,(fy+0.072)*H);
      ctx.closePath();ctx.fill();
    });
    // Slight shadow on peak faces
    ctx.fillStyle='rgba(180,200,220,0.22)';
    [[0.21,0.17,0.035],[0.64,0.14,0.042],[0.87,0.19,0.028]].forEach(([fx,fy,s])=>{
      ctx.beginPath();
      ctx.moveTo(fx*tileW,fy*H);
      ctx.lineTo((fx+s)*tileW,(fy+0.072)*H);
      ctx.lineTo(fx*tileW+s*tileW*0.5,(fy+0.15)*H);
      ctx.closePath();ctx.fill();
    });
    ctx.restore();
  }
  ctx.restore();
}

function drawPineTree(ctx,x,baseY,scale){
  const s=scale||1;
  ctx.fillStyle='#5a3a1a';
  ctx.fillRect(x-3*s,baseY-3*s,6*s,7*s);
  const tiers=[{w:14*s,h:22*s,dy:0},{w:20*s,h:18*s,dy:13*s},{w:26*s,h:16*s,dy:24*s}];
  tiers.forEach(t=>{
    ctx.fillStyle='#2a5a2a';
    ctx.beginPath();
    ctx.moveTo(x,baseY-t.dy-t.h);
    ctx.lineTo(x-t.w,baseY-t.dy);
    ctx.lineTo(x+t.w,baseY-t.dy);
    ctx.closePath();ctx.fill();
    // lighter right face
    ctx.fillStyle='#3a7a3a';
    ctx.beginPath();
    ctx.moveTo(x,baseY-t.dy-t.h);
    ctx.lineTo(x+t.w*0.1,baseY-t.dy-t.h*0.55);
    ctx.lineTo(x+t.w,baseY-t.dy);
    ctx.lineTo(x+t.w*0.65,baseY-t.dy);
    ctx.closePath();ctx.fill();
  });
}

function drawForestLayer(ctx,off,W,H){
  const tileW=480;
  const shift=-(off%tileW);
  const baseY=H*0.626;
  ctx.save();ctx.translate(shift,0);
  for(let rep=-1;rep<=2;rep++){
    ctx.save();ctx.translate(rep*tileW,0);
    [28,84,144,200,256,316,368,432].forEach((x,i)=>drawPineTree(ctx,x,baseY,0.68+(i%3)*0.09));
    [56,118,174,232,284,340,400].forEach((x,i)=>drawPineTree(ctx,x,baseY+6,0.9+(i%2)*0.14));
    ctx.restore();
  }
  ctx.restore();
}

function drawSlopeEdges(ctx,W,H){
  const gy=H*GROUND_Y_FRAC;
  const lg=ctx.createLinearGradient(0,0,W*0.18,0);
  lg.addColorStop(0,'rgba(140,170,210,0.28)');lg.addColorStop(1,'rgba(140,170,210,0)');
  ctx.fillStyle=lg;ctx.fillRect(0,gy,W*0.18,H-gy);
  const rg=ctx.createLinearGradient(W,0,W*0.82,0);
  rg.addColorStop(0,'rgba(140,170,210,0.28)');rg.addColorStop(1,'rgba(140,170,210,0)');
  ctx.fillStyle=rg;ctx.fillRect(W*0.82,gy,W*0.18,H-gy);
}

function drawSlope(ctx,W,H){
  const gy=H*GROUND_Y_FRAC;
  const g=ctx.createLinearGradient(0,gy,0,H);
  g.addColorStop(0,'#f0f6ff');g.addColorStop(0.35,'#e8f2ff');g.addColorStop(1,'#d4e8f8');
  ctx.fillStyle=g;ctx.fillRect(0,gy,W,H-gy);
  // ski track lines
  const spacing=20;
  const trackOff=scrollOffset%spacing;
  ctx.strokeStyle='rgba(170,195,225,0.35)';ctx.lineWidth=1;
  for(let y=gy+trackOff%spacing;y<H;y+=spacing){
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }
  // horizon glow
  const hg=ctx.createLinearGradient(0,gy-8,0,gy+6);
  hg.addColorStop(0,'rgba(180,215,245,0)');hg.addColorStop(0.6,'rgba(180,215,245,0.55)');hg.addColorStop(1,'rgba(180,215,245,0)');
  ctx.fillStyle=hg;ctx.fillRect(0,gy-8,W,14);
}

const parallaxLayers=[
  {speed:0.08, draw:(ctx,off,W,H)=>drawMountainLayer(ctx,off,W,H)},
  {speed:0.38, draw:(ctx,off,W,H)=>drawForestLayer(ctx,off,W,H)},
  {speed:0.72, draw:(ctx,off,W,H)=>drawSlopeEdges(ctx,off,W,H)},
];

// ── SECTION 4: PLAYER DRAW ──────────────────────────────────────

function drawFlipIndicator(ctx){
  const ix=Math.max(46,player.x-44);
  const iy=player.y-34;
  const progress=Math.min(player.flipAngle/360,1);
  const done=player.flipAngle>=FLIP_THRESHOLD;
  ctx.save();ctx.translate(ix,iy);
  ctx.strokeStyle=done?'#44ff88':'#ffdd44';ctx.lineWidth=3;
  ctx.shadowBlur=10;ctx.shadowColor=done?'#44ff88':'#ffdd44';
  ctx.beginPath();ctx.arc(0,0,17,-Math.PI/2,-Math.PI/2+progress*Math.PI*2);ctx.stroke();
  ctx.shadowBlur=0;ctx.restore();
}

function drawPlayerFigure(ctx,x,y,state,flipAngle,landingFlash){
  if(state==='DEAD')return;
  const inv=Date.now()<invincibleUntil;
  if(inv&&Math.floor(Date.now()/80)%2===0)return; // blink when invincible

  ctx.save();ctx.translate(x,y);
  if(state==='FLIPPING') ctx.rotate((flipAngle*Math.PI)/180);
  if(state==='SKIING') ctx.rotate(0.12); // slight forward lean

  // Skis
  ctx.fillStyle='#1a1a1a';
  ctx.fillRect(-14,18,32,5);
  ctx.fillStyle='#4488cc';
  ctx.fillRect(-14,18,32,2);
  // Legs
  ctx.strokeStyle='#1a3a6e';ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-4,0);ctx.lineTo(-6,18);ctx.stroke();
  ctx.beginPath();ctx.moveTo(4,0);ctx.lineTo(6,18);ctx.stroke();
  // Body
  ctx.fillStyle='#cc2222';
  ctx.beginPath();ctx.roundRect(-8,-20,16,22,3);ctx.fill();
  // Arms
  ctx.strokeStyle='#cc2222';ctx.lineWidth=4;
  if(state==='AIRBORNE'||state==='FLIPPING'){
    ctx.beginPath();ctx.moveTo(-8,-13);ctx.lineTo(-19,-26);ctx.stroke();
    ctx.beginPath();ctx.moveTo(8,-13);ctx.lineTo(19,-26);ctx.stroke();
  } else {
    ctx.beginPath();ctx.moveTo(-8,-13);ctx.lineTo(-17,-1);ctx.stroke();
    ctx.beginPath();ctx.moveTo(8,-13);ctx.lineTo(17,-1);ctx.stroke();
    ctx.strokeStyle='rgba(80,80,80,0.8)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(-17,-1);ctx.lineTo(-19,22);ctx.stroke();
    ctx.beginPath();ctx.moveTo(17,-1);ctx.lineTo(19,22);ctx.stroke();
  }
  // Head + helmet
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(0,-28,8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(100,180,255,0.52)';
  ctx.beginPath();ctx.arc(2,-26,5.5,-0.3,Math.PI*0.6);ctx.fill();
  ctx.restore();

  // Landing flash
  if(landingFlash>0){
    const alpha=landingFlash/600;
    ctx.save();ctx.translate(x,y);
    ctx.strokeStyle=`rgba(255,255,255,${alpha})`;ctx.lineWidth=2.5;
    for(let i=0;i<8;i++){
      const a=(i/8)*Math.PI*2;
      ctx.beginPath();ctx.moveTo(Math.cos(a)*22,Math.sin(a)*22);ctx.lineTo(Math.cos(a)*42,Math.sin(a)*42);ctx.stroke();
    }
    ctx.restore();
  }

  if(state==='FLIPPING') drawFlipIndicator(ctx);
}

// ── SECTION 5: OBSTACLE + PICKUP DRAW ──────────────────────────

function drawTree(ctx,obs){
  drawPineTree(ctx,0,0,1.45);
}

function drawRock(ctx,obs){
  ctx.save();ctx.rotate(obs.rot||0);
  ctx.beginPath();
  const rs=[0.92,0.74,1.0,0.81,0.95,0.72,0.87];
  rs.forEach((r,i)=>{
    const a=(i/rs.length)*Math.PI*2;
    const rx=Math.cos(a)*obs.w/2*r,ry=Math.sin(a)*obs.h/2*r;
    i===0?ctx.moveTo(rx,ry):ctx.lineTo(rx,ry);
  });
  ctx.closePath();
  const rg=ctx.createRadialGradient(-obs.w*0.12,-obs.h*0.16,0,0,0,obs.w*0.58);
  rg.addColorStop(0,'#b8b8b8');rg.addColorStop(1,'#545454');
  ctx.fillStyle=rg;ctx.fill();
  ctx.strokeStyle='#2a2a2a';ctx.lineWidth=1.8;ctx.stroke();
  // Snow on top
  ctx.fillStyle='rgba(240,248,255,0.72)';
  ctx.beginPath();ctx.ellipse(0,-obs.h*0.28,obs.w*0.34,obs.h*0.14,0,Math.PI,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawBarrier(ctx,obs){
  const hw=obs.w/2,hh=obs.h/2;
  // Plank body
  ctx.fillStyle='#8B4513';ctx.fillRect(-hw,-hh,obs.w,obs.h);
  // Grain lines
  ctx.strokeStyle='#6B3010';ctx.lineWidth=1;
  for(let x=-hw+10;x<hw;x+=13){
    ctx.beginPath();ctx.moveTo(x,-hh);ctx.lineTo(x,hh);ctx.stroke();
  }
  // Metal brackets
  ctx.fillStyle='#888';
  ctx.fillRect(-hw,-2,8,4);ctx.fillRect(hw-8,-2,8,4);
  // Snow pile top
  ctx.fillStyle='#f0f6ff';
  ctx.beginPath();ctx.ellipse(0,-hh-5,hw*0.88,9,0,Math.PI,Math.PI*2);ctx.fill();
}

function drawAvalanche(ctx,obs){
  ctx.save();ctx.rotate(obs.rot||0);
  const ag=ctx.createRadialGradient(-6,-6,3,0,0,obs.w/2);
  ag.addColorStop(0,'#f0f8ff');ag.addColorStop(0.6,'#ddeeff');ag.addColorStop(1,'#aabbcc');
  ctx.beginPath();ctx.ellipse(0,0,obs.w/2,obs.h/2,0,0,Math.PI*2);
  ctx.fillStyle=ag;ctx.fill();
  ctx.strokeStyle='rgba(170,195,220,0.55)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(-9,-7);ctx.lineTo(2,8);ctx.stroke();
  ctx.beginPath();ctx.moveTo(6,-9);ctx.lineTo(-3,5);ctx.stroke();
  ctx.restore();
}

function drawOtherSkier(ctx,obs){
  ctx.save();ctx.scale(0.72,0.72);
  ctx.fillStyle='#5a3a1a';ctx.fillRect(-3,5,6,7);
  ctx.strokeStyle='#cc6600';ctx.lineWidth=4;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(0,4);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-3,4);ctx.lineTo(-5,16);ctx.stroke();
  ctx.beginPath();ctx.moveTo(3,4);ctx.lineTo(5,16);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-8,-6);ctx.lineTo(-16,2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(8,-6);ctx.lineTo(16,2);ctx.stroke();
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(0,-19,6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,140,0,0.5)';ctx.beginPath();ctx.arc(1,-17,4,-0.3,Math.PI*0.6);ctx.fill();
  ctx.fillStyle='#1a1a1a';ctx.fillRect(-12,16,26,5);
  ctx.restore();
}

function drawObstacle(ctx,obs){
  ctx.save();ctx.translate(obs.x,obs.y);
  switch(obs.type){
    case 'tree':    drawTree(ctx,obs);break;
    case 'rock':    drawRock(ctx,obs);break;
    case 'barrier': drawBarrier(ctx,obs);break;
    case 'avalanche':drawAvalanche(ctx,obs);break;
    case 'skier':   drawOtherSkier(ctx,obs);break;
  }
  // HP bar for multi-hit obstacles
  if(obs.hp>1&&obs.maxHp>1){
    const bw=obs.w*0.7;
    ctx.fillStyle='rgba(0,0,0,0.28)';ctx.fillRect(-bw/2,-obs.h/2-11,bw,6);
    ctx.fillStyle='#ff4444';ctx.fillRect(-bw/2,-obs.h/2-11,bw*(obs.hp/obs.maxHp),6);
  }
  ctx.restore();
}

function drawPickup(ctx,item){
  ctx.save();ctx.translate(item.x,item.y);
  const pulse=Math.sin(item.pulseT*0.09)*2.2;
  ctx.shadowBlur=14;ctx.shadowColor='#88ccff';
  ctx.beginPath();ctx.arc(0,0,SNOWBALL_PICKUP_R+pulse,0,Math.PI*2);
  ctx.fillStyle='#ffffff';ctx.fill();
  ctx.strokeStyle='#5599cc';ctx.lineWidth=2.5;ctx.stroke();
  ctx.fillStyle='rgba(100,160,220,0.38)';
  [[3,2],[-3,3],[1,-4]].forEach(([dx,dy])=>{ctx.beginPath();ctx.arc(dx,dy,2,0,Math.PI*2);ctx.fill();});
  ctx.shadowBlur=0;ctx.restore();
}

function drawProjectile(ctx,proj){
  ctx.save();
  // Trail
  for(let i=1;i<=3;i++){
    ctx.beginPath();ctx.arc(proj.x-proj.vx*i*1.6,proj.y-proj.vy*i*1.6,SNOWBALL_PROJ_R*(1-i*0.27),0,Math.PI*2);
    ctx.fillStyle=`rgba(200,225,255,${0.28-i*0.07})`;ctx.fill();
  }
  ctx.shadowBlur=9;ctx.shadowColor='#aaddff';
  ctx.beginPath();ctx.arc(proj.x,proj.y,SNOWBALL_PROJ_R,0,Math.PI*2);
  ctx.fillStyle='#ffffff';ctx.fill();
  ctx.strokeStyle='#88bbdd';ctx.lineWidth=1.5;ctx.stroke();
  ctx.shadowBlur=0;ctx.restore();
}

function drawWipeoutPieces(ctx){
  wipeoutPcs.forEach(p=>{
    ctx.save();ctx.globalAlpha=Math.max(0,p.life);
    ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    if(p.shape==='ski'){
      ctx.fillStyle='#1a1a1a';ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    }else if(p.shape==='pole'){
      ctx.fillStyle='#555';ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    }else if(p.shape==='body'){
      ctx.fillStyle='#cc2222';ctx.beginPath();ctx.roundRect(-p.w/2,-p.h/2,p.w,p.h,3);ctx.fill();
    }else if(p.shape==='head'){
      ctx.fillStyle='#111';ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  });
}

// ── SECTION 6: PARTICLE SYSTEM ──────────────────────────────────

function emitSparkles(x,y,count,color){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2,spd=2+Math.random()*4;
    particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-1,r:2.5+Math.random()*2.5,life:1,decay:0.04+Math.random()*0.03,color,grav:true});
  }
}

function emitChunks(x,y,count){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2,spd=3+Math.random()*6;
    particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-2,w:4+Math.random()*5,h:3+Math.random()*4,rot:Math.random()*Math.PI*2,rotV:(Math.random()-0.5)*0.22,life:1,decay:0.025+Math.random()*0.02,color:'#ddeeff',grav:true,isChunk:true});
  }
}

function emitSnowSpray(x,y){
  for(let i=0;i<3;i++){
    particles.push({x:x+(Math.random()-0.5)*22,y,vx:(Math.random()-0.5)*3,vy:-1-Math.random()*2,r:1.5+Math.random()*1.5,life:0.85,decay:0.06,color:'rgba(240,248,255,1)',grav:false});
  }
}

function updateParticles(){
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;
    if(p.grav)p.vy+=0.15;
    p.vx*=0.95;p.life-=p.decay;
    if(p.rot!==undefined)p.rot+=p.rotV;
    if(p.r)p.r*=0.97;
  });
  particles=particles.filter(p=>p.life>0);
}

function drawParticles(ctx){
  particles.forEach(p=>{
    ctx.save();ctx.globalAlpha=Math.max(0,p.life);
    if(p.isChunk){
      ctx.translate(p.x,p.y);ctx.rotate(p.rot||0);
      ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    }else{
      ctx.beginPath();ctx.arc(p.x,p.y,p.r||3,0,Math.PI*2);
      ctx.fillStyle=p.color||'#ffffff';ctx.fill();
    }
    ctx.restore();
  });
}

// ── SECTION 7: HUD + DEATH SCREEN ──────────────────────────────

function drawHUD(ctx,W,H){
  // Score
  ctx.save();
  ctx.font='900 '+Math.round(H*0.054)+'px "Exo 2",sans-serif';
  ctx.textAlign='center';ctx.textBaseline='top';
  ctx.fillStyle='rgba(20,30,50,0.18)';ctx.fillText(Math.floor(score).toLocaleString(),W/2+2,18+2);
  ctx.fillStyle='#1a2a3a';ctx.fillText(Math.floor(score).toLocaleString(),W/2,18);
  // Multiplier
  if(multiplier>1){
    ctx.font='700 '+Math.round(H*0.028)+'px "Exo 2",sans-serif';
    ctx.fillStyle='#cc2222';
    ctx.fillText('x'+multiplier,W/2+Math.round(H*0.09),22);
  }
  // Label
  ctx.font='600 '+Math.round(H*0.022)+'px Rajdhani,sans-serif';
  ctx.fillStyle='rgba(30,80,120,0.5)';
  ctx.fillText('SCORE',W/2,18+Math.round(H*0.054)+4);
  ctx.restore();

  // Snowball counter
  drawSnowballHUD(ctx,W,H);
  // Speed indicator
  drawSpeedHUD(ctx,W,H);
  // Invincibility flash ring around player
  if(Date.now()<invincibleUntil&&player.state!=='DEAD'){
    const frac=(invincibleUntil-Date.now())/INVINCIBLE_DUR;
    ctx.save();
    ctx.strokeStyle=`rgba(100,200,255,${frac*0.6})`;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(player.x,player.y-16,36,0,Math.PI*2);ctx.stroke();
    ctx.restore();
  }
}

function drawSnowballHUD(ctx,W,H){
  const sz=20,gap=5;
  const totalW=SNOWBALL_MAX*(sz+gap)-gap;
  const startX=W-totalW-18;
  for(let i=0;i<SNOWBALL_MAX;i++){
    const cx=startX+i*(sz+gap)+sz/2;
    const filled=i<snowballs;
    ctx.beginPath();ctx.arc(cx,28,sz/2,0,Math.PI*2);
    ctx.fillStyle=filled?'#ffffff':'rgba(255,255,255,0.15)';ctx.fill();
    ctx.strokeStyle=filled?'#5599cc':'rgba(100,150,200,0.28)';ctx.lineWidth=2;ctx.stroke();
    if(filled){
      ctx.fillStyle='rgba(100,160,220,0.38)';
      ctx.beginPath();ctx.arc(cx+2,27,3,0,Math.PI*2);ctx.fill();
    }
  }
}

function drawSpeedHUD(ctx,W,H){
  const frac=Math.min(1,(scrollSpeed-BASE_SCROLL_SPEED)/(MAX_SCROLL_SPEED-BASE_SCROLL_SPEED));
  const conv=frac*22;
  ctx.save();ctx.globalAlpha=0.38;
  ctx.strokeStyle='#7799bb';ctx.lineWidth=2;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(W-58,H-22);ctx.lineTo(W-58+conv,H-72);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W-28,H-22);ctx.lineTo(W-28-conv,H-72);ctx.stroke();
  ctx.restore();
}

function drawDeathScreen(ctx,W,H){
  // Light alpine overlay
  ctx.fillStyle='rgba(215,232,252,0.93)';ctx.fillRect(0,0,W,H);
  // Title
  const titleSize=Math.round(Math.min(H*0.1,56));
  ctx.save();
  ctx.font='900 '+titleSize+'px "Exo 2",sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowBlur=24;ctx.shadowColor='rgba(200,40,40,0.35)';
  ctx.fillStyle='#cc2222';ctx.fillText('BAILED IT',W/2,H*0.28);
  ctx.shadowBlur=0;
  // Score
  ctx.font='700 '+Math.round(H*0.055)+'px "Exo 2",sans-serif';
  ctx.fillStyle='#1a2a3a';ctx.fillText(Math.floor(score).toLocaleString(),W/2,H*0.44);
  ctx.font='600 '+Math.round(H*0.028)+'px Rajdhani,sans-serif';
  ctx.fillStyle='rgba(30,80,120,0.55)';ctx.fillText('FINAL SCORE',W/2,H*0.51);
  // Best score
  if(score>=bestScore&&Math.floor(score)>0){
    ctx.font='700 '+Math.round(H*0.034)+'px "Exo 2",sans-serif';
    ctx.fillStyle='#cc2222';ctx.fillText('NEW BEST!',W/2,H*0.585);
  } else if(bestScore>0){
    ctx.font='600 '+Math.round(H*0.026)+'px Rajdhani,sans-serif';
    ctx.fillStyle='rgba(30,80,120,0.5)';ctx.fillText('BEST: '+bestScore.toLocaleString(),W/2,H*0.585);
  }
  ctx.restore();

  // Position HTML buttons
  const rb=document.getElementById('restart-btn');
  const hl=document.getElementById('hub-link');
  rb.style.display='block';
  rb.style.top=Math.round(H*0.66)+'px';
  hl.style.display='block';
}

function hideDeathUI(){
  document.getElementById('restart-btn').style.display='none';
  document.getElementById('hub-link').style.display='none';
}

// ── SECTION 8: GAME LOGIC ────────────────────────────────────────

function updatePhysics(dt){
  const df=dt/16.667;
  // Scroll
  scrollSpeed=Math.min(MAX_SCROLL_SPEED,scrollSpeed+SPEED_RAMP*df);
  scrollOffset+=scrollSpeed*df;

  // Lateral movement
  const canMove=player.state==='SKIING'||player.state==='AIRBORNE'||player.state==='FLIPPING';
  if(canMove){
    if(keys['ArrowLeft']||keys['a']||keys['A']||touch.left)
      player.x=Math.max(PLAYER_W,player.x-PLAYER_MOVE_SPEED*df);
    if(keys['ArrowRight']||keys['d']||keys['D']||touch.right)
      player.x=Math.min(W-PLAYER_W,player.x+PLAYER_MOVE_SPEED*df);
  }

  // Vertical
  if(player.state==='AIRBORNE'||player.state==='FLIPPING'){
    player.vy+=GRAVITY*df;
    player.y+=player.vy*df;
    if(player.state==='FLIPPING') player.flipAngle+=FLIP_SPEED*df;
    if(player.y>=groundY){ player.y=groundY; player.vy=0; handleLanding(); }
  }

  // Landing flash timer
  if(player.state==='LANDING_OK'){
    player.landingFlash-=dt;
    if(player.landingFlash<=0) player.state='SKIING';
  }

  // Wipeout timer
  if(player.state==='WIPEOUT'){
    player.wipeoutTimer-=dt;
    if(player.wipeoutTimer<=0){ player.state='DEAD'; endGame(); }
  }

  // Snow spray while skiing
  if(player.state==='SKIING'&&Math.random()<0.32)
    emitSnowSpray(player.x,groundY);
}

function handleLanding(){
  if(player.state==='FLIPPING'){
    if(player.flipAngle>=FLIP_THRESHOLD){
      player.state='LANDING_OK';
      player.flipAngle=0;
      player.landingFlash=650;
      score+=FLIP_BONUS*multiplier;
      multiplier=Math.min(multiplier+1,8);
      invincibleUntil=Date.now()+INVINCIBLE_DUR;
      emitSparkles(player.x,player.y,24,'#ffffff');
    } else {
      initWipeout();
    }
  } else {
    player.state='SKIING';
    player.flipAngle=0;
  }
}

function initWipeout(){
  player.state='WIPEOUT';
  player.wipeoutTimer=WIPEOUT_DUR;
  wipeoutPcs=[
    {shape:'ski',w:32,h:5,x:player.x+4,y:player.y,vx:3+Math.random()*3,vy:-5-Math.random()*3,rot:0,rotV:0.18,life:1},
    {shape:'ski',w:32,h:5,x:player.x-4,y:player.y,vx:-3-Math.random()*3,vy:-5-Math.random()*3,rot:0,rotV:-0.16,life:1},
    {shape:'pole',w:3,h:24,x:player.x+8,y:player.y-10,vx:4+Math.random()*2,vy:-6-Math.random()*2,rot:0,rotV:0.22,life:1},
    {shape:'pole',w:3,h:24,x:player.x-8,y:player.y-10,vx:-4-Math.random()*2,vy:-6-Math.random()*2,rot:0,rotV:-0.2,life:1},
    {shape:'body',w:16,h:20,x:player.x,y:player.y-20,vx:(Math.random()-0.5)*4,vy:-7-Math.random()*3,rot:0,rotV:(Math.random()-0.5)*0.25,life:1},
    {shape:'head',r:8,x:player.x+(Math.random()-0.5)*6,y:player.y-36,vx:(Math.random()-0.5)*5,vy:-9-Math.random()*4,rot:0,rotV:(Math.random()-0.5)*0.3,life:1},
  ];
  emitChunks(player.x,player.y-20,14);
}

function updateWipeoutPieces(){
  wipeoutPcs.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.42;p.vx*=0.97;
    p.rot+=p.rotV;p.life-=0.011;
  });
  wipeoutPcs=wipeoutPcs.filter(p=>p.life>0);
}

function updateObstacles(df){
  obstacles.forEach(obs=>{
    obs.y+=scrollSpeed*df;
    obs.rot=(obs.rot||0)+obs.rotSpd*df;
    if(obs.type==='skier'){
      obs.sinPhase+=0.038*df;
      obs.x=obs.baseX+Math.sin(obs.sinPhase)*58;
      obs.x=Math.max(PLAYER_W*2,Math.min(W-PLAYER_W*2,obs.x));
    }
    if(obs.type==='avalanche'){
      obs.sinPhase+=0.028*df;
      obs.x+=Math.sin(obs.sinPhase)*0.85*df;
      obs.x=Math.max(obs.w,Math.min(W-obs.w,obs.x));
    }
  });
  obstacles=obstacles.filter(o=>o.y<H+o.h+20);
  pickupItems.forEach(item=>{item.y+=scrollSpeed*df;item.pulseT+=df;});
  pickupItems=pickupItems.filter(it=>it.y<H+30);
  projectiles.forEach(p=>{p.x+=p.vx*df;p.y+=p.vy*df;});
  projectiles=projectiles.filter(p=>p.x>-20&&p.x<W+20&&p.y>-20&&p.y<H+20);
}

function updateSpawning(dt){
  spawnTimer+=dt;
  const interval=Math.max(SPAWN_MIN,SPAWN_BASE-scrollOffset*0.38);
  if(spawnTimer>=interval){spawnTimer=0;spawnObstacle();}
  pickupTimer+=dt;
  if(pickupTimer>=PICKUP_INTERVAL){pickupTimer=0;spawnPickup();}
}

function spawnObstacle(){
  const r=Math.random();
  const prog=Math.min(1,scrollOffset/6000);
  let type;
  if(r<0.28)type='tree';
  else if(r<0.52)type='rock';
  else if(r<0.67)type='barrier';
  else if(r<0.78+prog*0.1)type='avalanche';
  else type='skier';
  const def=OBSTACLE_DEFS[type];
  const x=W*(0.14+Math.random()*0.72);
  obstacles.push({
    type,x,y:-def.h-10,w:def.w,h:def.h,hp:def.hp,maxHp:def.hp,
    rot:Math.random()*Math.PI*2,rotSpd:type==='avalanche'?0.04:0,
    sinPhase:Math.random()*Math.PI*2,
    baseX:x,
  });
}

function spawnPickup(){
  pickupItems.push({x:W*(0.18+Math.random()*0.64),y:-SNOWBALL_PICKUP_R-14,pulseT:0});
}

function shootSnowball(){
  if(snowballs<=0||gameState!=='PLAYING')return;
  snowballs--;
  // Find nearest obstacle that is above or near player (y < player.y + H*0.2)
  let target=null,best=Infinity;
  obstacles.forEach(obs=>{
    if(obs.type==='skier')return;
    if(obs.y>player.y+H*0.22)return; // skip ones far below
    const d=Math.hypot(obs.x-player.x,obs.y-player.y);
    if(d<best){best=d;target=obs;}
  });
  let vx,vy;
  if(target){
    const ang=Math.atan2(target.y-player.y,target.x-player.x);
    vx=Math.cos(ang)*SNOWBALL_PROJ_SPD;vy=Math.sin(ang)*SNOWBALL_PROJ_SPD;
  }else{
    vx=0;vy=-SNOWBALL_PROJ_SPD;
  }
  projectiles.push({x:player.x,y:player.y-22,vx,vy});
}

function updateCollisions(){
  if(gameState!=='PLAYING')return;
  const now=Date.now();
  const inv=now<invincibleUntil||player.state==='LANDING_OK'||player.state==='WIPEOUT'||player.state==='DEAD';

  // Player vs obstacles
  if(!inv&&(player.state==='SKIING'||player.state==='AIRBORNE'||player.state==='FLIPPING')){
    for(let i=obstacles.length-1;i>=0;i--){
      const o=obstacles[i];
      if(o.type==='skier')continue;
      const dx=Math.abs(player.x-o.x);
      const dy=Math.abs(player.y-o.y+o.h*0.2);
      const hw=(PLAYER_W+o.w)/2*0.72;
      const hh=(PLAYER_H+o.h)/2*0.68;
      if(dx<hw&&dy<hh){initWipeout();emitChunks(player.x,player.y-20,10);break;}
    }
  }

  // Player vs pickups
  for(let i=pickupItems.length-1;i>=0;i--){
    const it=pickupItems[i];
    if(Math.abs(player.x-it.x)<PLAYER_W+SNOWBALL_PICKUP_R&&Math.abs(player.y-it.y)<PLAYER_H/2+SNOWBALL_PICKUP_R){
      if(snowballs<SNOWBALL_MAX){
        snowballs++;
        emitSparkles(it.x,it.y,10,'#ffffff');
        pickupItems.splice(i,1);
      }
    }
  }

  // Projectiles vs obstacles
  for(let pi=projectiles.length-1;pi>=0;pi--){
    const proj=projectiles[pi];
    let hit=false;
    for(let oi=obstacles.length-1;oi>=0;oi--){
      const obs=obstacles[oi];
      if(obs.type==='skier')continue;
      if(Math.abs(proj.x-obs.x)<SNOWBALL_PROJ_R+obs.w/2&&Math.abs(proj.y-obs.y)<SNOWBALL_PROJ_R+obs.h/2){
        obs.hp--;
        emitChunks(proj.x,proj.y,8);
        if(obs.hp<=0){obstacles.splice(oi,1);score+=100*multiplier;}
        hit=true;break;
      }
    }
    if(hit)projectiles.splice(pi,1);
  }
}

// ── SECTION 9: MAIN LOOP ─────────────────────────────────────────

function draw(){
  drawSky(ctx,W,H);
  parallaxLayers.forEach(l=>l.draw(ctx,scrollOffset*l.speed,W,H));
  drawSlope(ctx,W,H);
  pickupItems.forEach(it=>drawPickup(ctx,it));
  obstacles.forEach(o=>drawObstacle(ctx,o));
  projectiles.forEach(p=>drawProjectile(ctx,p));
  drawWipeoutPieces(ctx);
  if(player.state!=='DEAD') drawPlayerFigure(ctx,player.x,player.y,player.state,player.flipAngle,player.landingFlash);
  drawParticles(ctx);
  if(gameState==='PLAYING'||gameState==='DEAD') drawHUD(ctx,W,H);
  if(gameState==='DEAD') drawDeathScreen(ctx,W,H);
}

function gameLoop(now){
  const dt=Math.min(now-lastTime,50);
  lastTime=now;
  const df=dt/16.667;

  if(gameState==='PLAYING'&&player.state!=='DEAD'){
    score+=scrollSpeed*0.14*multiplier;
  }

  updatePhysics(dt);
  updateObstacles(df);
  updateSpawning(dt);
  updateCollisions();
  updateParticles();
  updateWipeoutPieces();
  draw();
}

function endGame(){
  gameState='DEAD';
  const s=Math.floor(score);
  if(s>bestScore){bestScore=s;localStorage.setItem('ar_best',s);}
}

function initGame(){
  const gen=++loopGen;
  score=0;multiplier=1;snowballs=0;
  scrollSpeed=BASE_SCROLL_SPEED;scrollOffset=0;
  spawnTimer=0;pickupTimer=0;invincibleUntil=0;
  obstacles=[];projectiles=[];pickupItems=[];particles=[];wipeoutPcs=[];
  player.x=W*0.42;player.y=groundY;player.vy=0;
  player.state='SKIING';player.flipAngle=0;player.landingFlash=0;player.wipeoutTimer=0;
  gameState='PLAYING';
  hideDeathUI();
  lastTime=performance.now();
  requestAnimationFrame(function frame(now){
    if(loopGen!==gen)return;
    gameLoop(now);
    if(loopGen===gen) requestAnimationFrame(frame);
  });
}

// ── SECTION 10: INPUT HANDLERS ───────────────────────────────────

window.addEventListener('keydown',e=>{
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();
  keys[e.key]=true;
  if(gameState!=='PLAYING')return;
  // Jump
  if((e.key===' '||e.key==='ArrowUp')&&player.state==='SKIING'){
    player.state='AIRBORNE';player.vy=-JUMP_POWER;
  }
  // Flip
  if((e.key==='f'||e.key==='F'||e.key==='ArrowUp')&&player.state==='AIRBORNE'){
    player.state='FLIPPING';player.flipAngle=0;
  }
  // Shoot
  if(e.key==='x'||e.key==='X') shootSnowball();
  // Restart
  if((e.key==='r'||e.key==='R')&&gameState==='DEAD') initGame();
});
window.addEventListener('keyup',e=>{keys[e.key]=false;});

// ── SECTION 11: MOBILE TOUCH ─────────────────────────────────────

// Zone-based touch on canvas
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  Array.from(e.changedTouches).forEach(t=>{
    const rx=t.clientX/W;
    if(rx<0.30)touch.left=true;
    else if(rx>0.70)touch.right=true;
    else{
      touch.center=true;
      if(!touch.swipeStartY)touch.swipeStartY=t.clientY;
      // Flip if airborne
      if(player.state==='AIRBORNE'){player.state='FLIPPING';player.flipAngle=0;}
    }
  });
},{passive:false});

canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  Array.from(e.changedTouches).forEach(t=>{
    if(touch.swipeStartY!==null){
      const delta=touch.swipeStartY-t.clientY;
      if(delta>38&&player.state==='SKIING'&&gameState==='PLAYING'){
        player.state='AIRBORNE';player.vy=-JUMP_POWER;
        touch.swipeStartY=null;
      }
    }
  });
},{passive:false});

canvas.addEventListener('touchend',e=>{
  e.preventDefault();
  // Recalculate zones from remaining touches
  touch.left=false;touch.right=false;touch.center=false;
  Array.from(e.touches).forEach(t=>{
    const rx=t.clientX/W;
    if(rx<0.30)touch.left=true;
    else if(rx>0.70)touch.right=true;
    else touch.center=true;
  });
  // Shoot on center tap
  Array.from(e.changedTouches).forEach(t=>{
    const rx=t.clientX/W;
    if(rx>=0.30&&rx<=0.70) shootSnowball();
  });
  if(e.touches.length===0)touch.swipeStartY=null;
},{passive:false});

// Button controls
document.getElementById('mc-left').addEventListener('touchstart',e=>{e.stopPropagation();touch.left=true;},{passive:true});
document.getElementById('mc-left').addEventListener('touchend',e=>{e.stopPropagation();touch.left=false;},{passive:true});
document.getElementById('mc-right').addEventListener('touchstart',e=>{e.stopPropagation();touch.right=true;},{passive:true});
document.getElementById('mc-right').addEventListener('touchend',e=>{e.stopPropagation();touch.right=false;},{passive:true});
document.getElementById('mc-shoot').addEventListener('touchstart',e=>{e.stopPropagation();shootSnowball();},{passive:true});
document.getElementById('mc-jump-btn').addEventListener('touchstart',e=>{
  e.stopPropagation();
  if(player.state==='SKIING'&&gameState==='PLAYING'){player.state='AIRBORNE';player.vy=-JUMP_POWER;}
  else if(player.state==='AIRBORNE'){player.state='FLIPPING';player.flipAngle=0;}
},{passive:true});

// Restart button
document.getElementById('restart-btn').addEventListener('click',()=>{
  if(gameState==='DEAD')initGame();
});

window.addEventListener('resize',resize);

document.getElementById('play-btn').addEventListener('click',()=>{

  initGame();
});

// Initial idle draw (title screen background)
(function idleDraw(){
  if(gameState!=='MENU'){return;}
  drawSky(ctx,W,H);
  parallaxLayers.forEach(l=>l.draw(ctx,0,W,H));
  drawSlope(ctx,W,H);
  requestAnimationFrame(idleDraw);
})();
</script>
</body>
