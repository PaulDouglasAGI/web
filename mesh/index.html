<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>THE MESH — Umbra Directorate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<a id="back" href="../">← CATALOG</a>

<canvas id="world"></canvas>

<!-- Ambient UI -->
<div id="ui">
  <div id="clock">
    <div id="season">SPRING</div>
    <div id="timeofday">DAWN</div>
  </div>
  <div id="resonance-wrap">
    <div id="resonance-glyph"></div>
    <div id="resonance-label">FIELD CLARITY</div>
  </div>
  <div id="pop">— souls</div>
  <div id="alerts" style="display:none"></div>
</div>

<!-- Sim speed controls -->
<div id="speed-ctl">
  <button data-spd="0" title="pause">⏸</button>
  <button data-spd="0.35" class="active" title="slow">▶</button>
  <button data-spd="1" title="normal">▶▶</button>
  <button data-spd="2.5" title="fast">▶▶▶</button>
  <button data-spd="5" title="very fast">▶▶▶▶</button>
  <button data-spd="10" title="ludicrous">▶▶▶▶▶</button>
</div>

<!-- field overlay toggle — off by default, an optional deeper look beneath the living world -->
<div id="field-ctl">
  <button id="field-toggle" title="show the field beneath">◌ field</button>
</div>

<!-- underground view toggle — switches the camera to the mine's separate cave map -->
<div id="mine-ctl">
  <button id="mine-toggle" title="view the mine below">⛏ mine</button>
</div>

<!-- economy dashboard toggle — settlement & faction breakdown, off by default -->
<div id="econ-ctl">
  <button id="econ-toggle" title="see the economy">📊 economy</button>
</div>

<!-- Economy dashboard (settlement + faction tables) -->
<div id="econ-panel">
  <button id="econ-panel-close" aria-label="close">✕</button>
  <div id="econ-panel-title">THE ECONOMY</div>
  <div class="econ-section-label">settlements</div>
  <div id="econ-settlements" class="econ-table"></div>
  <div class="econ-section-label">factions</div>
  <div id="econ-factions" class="econ-table"></div>
</div>

<!-- Agent inspector (deep panel — tap an agent to open) -->
<div id="agent-panel">
  <button id="panel-close" aria-label="close">✕</button>
  <div id="panel-name">—</div>
  <div id="panel-faction">—</div>
  <div id="panel-age">—</div>
  <div id="panel-action">—</div>
  <div class="panel-stats">
    <div class="stat-row"><span id="stat-label-1">energy</span><div class="bar"><div id="bar-energy" class="bar-fill"></div></div></div>
    <div class="stat-row"><span id="stat-label-2">hunger</span><div class="bar"><div id="bar-hunger" class="bar-fill hunger"></div></div></div>
    <div class="stat-row"><span id="stat-label-3">social</span><div class="bar"><div id="bar-social" class="bar-fill social"></div></div></div>
    <div class="stat-row"><span id="stat-label-4">joy</span><div class="bar"><div id="bar-joy" class="bar-fill joy"></div></div></div>
  </div>
  <div id="panel-bond-row">bonded with <span id="panel-bond">—</span></div>
  <div id="panel-inv"></div>
  <div id="panel-mem-label">memory</div>
  <div id="panel-mem"></div>
</div>

<div id="hint">drag to pan · scroll to zoom · tap a soul, building, or resource to inspect</div>

<!-- Engine — classic scripts, ordered by dependency -->
<script src="src/world.js"></script>
<script src="src/underground.js"></script>
<script src="src/factions.js"></script>
<script src="src/economy.js"></script>
<script src="src/behaviors.js"></script>
<script src="src/mesh.js"></script>
<script src="src/agents.js"></script>
<script src="src/events.js"></script>
<script src="src/renderer.js"></script>
<script src="src/ui.js"></script>
<script src="src/main.js"></script>
</body>
</html>
