<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WARP LANE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Exo+2:wght@900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;font-family:'Rajdhani',sans-serif;touch-action:none;}
canvas{display:block;}
#hud{position:fixed;top:0;left:0;width:100%;padding:18px 28px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:10;}
#score{font-family:'Exo 2',sans-serif;font-size:2.8rem;font-weight:900;color:#fff;line-height:1;letter-spacing:2px;text-shadow:0 0 20px #00eeff,0 0 40px #0088ff;}
#score-label{font-size:0.65rem;letter-spacing:4px;color:#0099cc;margin-top:2px;}
#hs{font-size:1.1rem;font-weight:600;color:#00ccff;letter-spacing:2px;text-align:right;}
#hs-label{font-size:0.6rem;letter-spacing:3px;color:#005566;margin-top:2px;text-align:right;}
#combo-wrap{text-align:center;}
#combo{font-family:'Exo 2',sans-serif;font-size:1.4rem;font-weight:900;color:#00ffcc;letter-spacing:2px;text-shadow:0 0 14px #00ffaa;display:none;}
#combo-label{font-size:0.55rem;letter-spacing:4px;color:#006644;display:none;}
#shield-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;z-index:10;}
#shield-label{font-size:0.55rem;letter-spacing:4px;color:#005566;margin-bottom:6px;}
#shield-bar{width:180px;height:6px;background:rgba(255,255,255,0.08);border-radius:3px;border:1px solid rgba(0,200,255,0.15);}
#shield-fill{height:100%;width:100%;background:linear-gradient(90deg,#00aaff,#00ffee);border-radius:3px;transition:width 0.15s;}
#warp-bar{width:180px;height:4px;background:rgba(255,0,255,0.08);border-radius:3px;margin-top:6px;display:none;}
#warp-fill{height:100%;width:100%;background:linear-gradient(90deg,#ff00ff,#cc44ff);border-radius:3px;}
#boost-bar{width:180px;height:4px;background:rgba(255,220,0,0.08);border-radius:3px;margin-top:6px;display:none;}
#boost-fill{height:100%;width:0%;background:linear-gradient(90deg,#ffdd00,#ffaa00);border-radius:3px;transition:width 0.1s;}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:clamp(24px,5vh,60px) 0 32px;background:linear-gradient(180deg,rgba(0,5,20,0.94) 0%,rgba(0,0,10,0.98) 100%);z-index:30;transition:opacity 0.3s;overflow-y:auto;}
#overlay.gone{opacity:0;pointer-events:none;}
.game-title{font-family:'Exo 2',sans-serif;font-weight:900;font-size:clamp(2.4rem,8vw,5rem);letter-spacing:10px;color:#fff;text-shadow:0 0 30px #00eeff,0 0 80px #0066ff,0 0 140px #0033cc;margin-bottom:4px;}
.game-sub{font-size:0.75rem;letter-spacing:8px;color:#0088aa;margin-bottom:20px;}
/* Tabs */
#view-tabs{display:none;gap:0;margin-bottom:18px;}
.tab-btn{font-family:'Exo 2',sans-serif;font-weight:900;font-size:0.7rem;letter-spacing:4px;color:#003344;background:transparent;border:1px solid #003344;padding:8px 22px;cursor:pointer;transition:all 0.15s;}
.tab-btn:first-child{border-right:none;clip-path:polygon(8px 0%,100% 0%,100% 100%,0% 100%);}
.tab-btn:last-child{clip-path:polygon(0% 0%,calc(100% - 8px) 0%,100% 100%,0% 100%);}
.tab-btn.active{color:#00ccff;border-color:#00ccff;background:rgba(0,180,255,0.08);}
/* Game view */
#view-game{display:flex;flex-direction:column;align-items:center;width:100%;}
.stat-row{display:flex;gap:36px;margin-bottom:20px;}
.stat{text-align:center;}
.stat-val{font-family:'Exo 2',sans-serif;font-size:1.8rem;font-weight:900;color:#00ddff;letter-spacing:2px;}
.stat-name{font-size:0.6rem;letter-spacing:4px;color:#005577;margin-top:2px;}
.play-btn{font-family:'Exo 2',sans-serif;font-weight:900;font-size:1rem;letter-spacing:6px;color:#000;background:linear-gradient(135deg,#00ddff,#0077ff);border:none;padding:16px 52px;cursor:pointer;clip-path:polygon(12px 0%,100% 0%,calc(100% - 12px) 100%,0% 100%);box-shadow:0 0 40px rgba(0,180,255,0.4);transition:all 0.15s;}
.play-btn:hover{transform:scale(1.05);box-shadow:0 0 60px rgba(0,200,255,0.7);}
.how-to{margin-top:24px;font-size:0.65rem;letter-spacing:3px;color:#003344;text-align:center;line-height:2.4;}
/* Skin selector */
#skin-section{margin-bottom:18px;text-align:center;width:100%;}
#skin-title{font-size:0.6rem;letter-spacing:4px;color:#004455;margin-bottom:10px;}
#skin-row{display:grid;grid-template-columns:repeat(4,84px);grid-template-rows:repeat(2,92px);gap:8px;justify-content:center;padding:0 12px;}
.skin-chip{width:84px;height:92px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:4px;border:1px solid #001122;border-radius:8px;cursor:pointer;transition:all 0.15s;position:relative;background:rgba(0,4,14,0.7);overflow:hidden;}
.skin-chip.unlocked{border-color:#002233;cursor:pointer;}
.skin-chip.unlocked:hover{border-color:#00aacc;background:rgba(0,30,50,0.7);}
.skin-chip.selected{border-color:#00ccff;background:rgba(0,60,100,0.4);box-shadow:0 0 14px rgba(0,180,255,0.35);}
.skin-chip.locked{cursor:default;}
.skin-canvas{width:52px;height:52px;display:block;}
.skin-chip-name{font-size:0.5rem;letter-spacing:2px;color:#006677;line-height:1;}
.skin-chip.selected .skin-chip-name{color:#00ccff;}
.skin-chip.unlocked:hover .skin-chip-name{color:#00aacc;}
.skin-locked-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,1,8,0.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;}
.skin-lock-icon{font-size:1.1rem;line-height:1;}
.skin-thresh-label{font-size:0.38rem;letter-spacing:1px;color:#334;}
/* Leaderboard view */
#view-board{display:none;flex-direction:column;align-items:center;width:100%;min-height:0;}
#lb-title{font-family:'Exo 2',sans-serif;font-size:1rem;font-weight:900;letter-spacing:6px;color:#00ccff;margin-bottom:14px;text-shadow:0 0 20px #0066ff;}
#lb-table{width:min(440px,92vw);margin-bottom:20px;}
.lb-row{display:grid;grid-template-columns:32px 1fr 80px 50px;gap:6px;padding:7px 10px;border-bottom:1px solid rgba(0,80,120,0.2);font-size:0.8rem;letter-spacing:1px;color:#004455;}
.lb-row.lb-header{font-size:0.55rem;letter-spacing:3px;color:#003344;border-bottom:1px solid rgba(0,100,150,0.35);padding-bottom:8px;}
.lb-row.lb-highlight{color:#00ffcc;text-shadow:0 0 10px #00ffaa;background:rgba(0,60,50,0.3);}
.lb-rank{color:#002233;}
.lb-row.lb-highlight .lb-rank{color:#00ffcc;}
/* Name entry */
#name-entry{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,2,14,0.95);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:50;gap:16px;}
#name-entry-title{font-family:'Exo 2',sans-serif;font-size:1.4rem;font-weight:900;color:#00ffcc;letter-spacing:6px;text-shadow:0 0 20px #00ffaa;}
#name-entry-sub{font-size:0.65rem;letter-spacing:4px;color:#006655;}
#name-input{font-family:'Exo 2',sans-serif;font-size:1.1rem;font-weight:900;letter-spacing:4px;background:rgba(0,20,40,0.8);border:1px solid #00ccff;color:#00eeff;padding:12px 20px;text-align:center;outline:none;width:220px;text-transform:uppercase;}
#name-input::placeholder{color:#002233;}
#name-submit{font-family:'Exo 2',sans-serif;font-weight:900;font-size:0.85rem;letter-spacing:5px;color:#000;background:linear-gradient(135deg,#00ffcc,#0077ff);border:none;padding:12px 40px;cursor:pointer;clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%);}
/* Touch dpad */
#dpad{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:none;gap:8px;z-index:20;}
.darr{width:70px;height:70px;background:rgba(0,180,255,0.12);border:1px solid rgba(0,180,255,0.35);color:#00ccff;font-size:1.6rem;display:flex;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;user-select:none;-webkit-user-select:none;}
.darr:active{background:rgba(0,200,255,0.3);}
@media(max-width:640px){#dpad{display:flex;}#shield-wrap{bottom:110px;}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div><div id="score">0</div><div id="score-label">DISTANCE</div></div>
  <div id="combo-wrap"><div id="combo">x1</div><div id="combo-label">COMBO</div></div>
  <div><div id="hs">0</div><div id="hs-label">BEST</div></div>
</div>
<div id="shield-wrap">
  <div id="shield-label">SHIELD</div>
  <div id="shield-bar"><div id="shield-fill"></div></div>
  <div id="warp-bar"><div id="warp-fill"></div></div>
  <div id="boost-bar" style="display:none"><div id="boost-fill"></div></div>
</div>
<div id="overlay">
  <div class="game-title">WARP LANE</div>
  <div class="game-sub">INFINITE SPEED · ZERO MERCY</div>
  <div id="view-tabs">
    <button class="tab-btn active" id="tab-game">PILOT</button>
    <button class="tab-btn" id="tab-board">RECORDS</button>
  </div>
  <!-- Game view -->
  <div id="view-game">
    <div class="stat-row" id="stat-row" style="display:none">
      <div class="stat"><div class="stat-val" id="final-score">0</div><div class="stat-name">DISTANCE</div></div>
      <div class="stat"><div class="stat-val" id="final-time">0s</div><div class="stat-name">TIME</div></div>
      <div class="stat"><div class="stat-val" id="final-hs">0</div><div class="stat-name">BEST</div></div>
    </div>
    <div id="skin-section" style="display:none">
      <div id="skin-title">SHIP SKIN</div>
      <div id="skin-row"></div>
    </div>
    <button class="play-btn" id="play-btn">LAUNCH</button>
    <div class="how-to">← → ARROW KEYS · A D · TAP ARROWS<br>SPACE HOLD = BOOST · R = RESTART<br>⚡ FUEL · 🛡 SHIELD · ▶ SPEED · ✦ WARP</div>
  </div>
  <!-- Leaderboard view -->
  <div id="view-board">
    <div id="lb-title">TOP PILOTS</div>
    <div id="lb-table"></div>
    <button class="play-btn" id="play-btn-lb">WARP AGAIN</button>
  </div>
  <!-- Name entry modal -->
  <div id="name-entry">
    <div id="name-entry-title">NEW RECORD</div>
    <div id="name-entry-sub">ENTER YOUR PILOT NAME</div>
    <input id="name-input" maxlength="12" placeholder="PILOT" autocomplete="off" spellcheck="false">
    <button id="name-submit">CONFIRM</button>
  </div>
</div>
<div id="dpad">
  <div class="darr" id="da-l">◀</div>
  <div class="darr" id="da-r">▶</div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const playBtn = document.getElementById('play-btn');
const playBtnLb = document.getElementById('play-btn-lb');
const scoreEl = document.getElementById('score');
const hsEl = document.getElementById('hs');
const shieldFill = document.getElementById('shield-fill');
const warpBar = document.getElementById('warp-bar');
const warpFill = document.getElementById('warp-fill');
const boostBar = document.getElementById('boost-bar');
const boostFill = document.getElementById('boost-fill');
const statRow = document.getElementById('stat-row');
const finalScore = document.getElementById('final-score');
const finalTime = document.getElementById('final-time');
const finalHs = document.getElementById('final-hs');
const comboEl = document.getElementById('combo');
const comboLbl = document.getElementById('combo-label');
const viewTabs = document.getElementById('view-tabs');
const tabGame = document.getElementById('tab-game');
const tabBoard = document.getElementById('tab-board');
const viewGame = document.getElementById('view-game');
const viewBoard = document.getElementById('view-board');
const nameEntry = document.getElementById('name-entry');
const nameInput = document.getElementById('name-input');
const nameSubmit = document.getElementById('name-submit');

let W, H;
function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

// ── Skin definitions ───────────────────────────────────────────────
const SKINS = [
  {id:0, name:'DEFAULT', threshold:0,    color:'#00ccff', glow:'#0088ff', cockpit:'rgba(0,200,255,0.55)',  exhaust:'#0066ff'},
  {id:1, name:'EMBER',   threshold:10000,  color:'#ff6600', glow:'#ff2200', cockpit:'rgba(255,120,0,0.6)',   exhaust:'#ff4400'},
  {id:2, name:'VENOM',   threshold:25000,  color:'#00ff44', glow:'#00cc22', cockpit:'rgba(0,255,80,0.55)',   exhaust:'#00aa33'},
  {id:3, name:'GHOST',   threshold:50000,  color:'#ccddff', glow:'#8899cc', cockpit:'rgba(200,220,255,0.4)', exhaust:'#9999ff'},
  {id:4, name:'NOVA',    threshold:100000, color:'#ffdd00', glow:'#ffaa00', cockpit:'rgba(255,220,0,0.55)',  exhaust:'#ffbb00'},
  {id:5, name:'PHANTOM', threshold:200000, color:'#cc44ff', glow:'#9900cc', cockpit:'rgba(180,0,255,0.55)',  exhaust:'#bb00ff'},
  {id:6, name:'INFERNO', threshold:350000, color:'#ff0066', glow:'#ff4400', cockpit:'rgba(255,0,100,0.6)',   exhaust:'#ff2200'},
  {id:7, name:'VOID',    threshold:500000, color:'#ffffff', glow:'#444466', cockpit:'rgba(200,200,255,0.3)', exhaust:'#888899'},
];

// ── localStorage helpers ───────────────────────────────────────────
function getLB(){ try{ return JSON.parse(localStorage.getItem('wl_lb')||'[]'); }catch(e){ return []; } }
function saveLB(arr){ localStorage.setItem('wl_lb', JSON.stringify(arr)); }
function qualifiesForLB(s){ const lb=getLB(); return lb.length<10||s>lb[lb.length-1].score; }
function insertLB(name,score,time){
  const lb=getLB();
  lb.push({name:name.trim().toUpperCase()||'PILOT',score,time});
  lb.sort((a,b)=>b.score-a.score);
  lb.splice(10);
  saveLB(lb);
}
function getUnlocked(){ try{ return JSON.parse(localStorage.getItem('wl_skins')||'[0]'); }catch(e){ return [0]; } }
function saveUnlocked(arr){ localStorage.setItem('wl_skins',JSON.stringify(arr)); }
function getActiveSkin(){ return parseInt(localStorage.getItem('wl_skin')||'0'); }
function saveActiveSkin(id){ localStorage.setItem('wl_skin',id); }

// ── Skin selector ──────────────────────────────────────────────────
function drawMiniShip(canvas, skin, isActive){
  const c = canvas.getContext('2d');
  c.clearRect(0,0,52,52);
  let color = skin.color, glow = skin.glow, cockpit = skin.cockpit, colorA = color+'44';
  if(skin.id===6){
    const h=(Date.now()*0.15)%360;
    color=`hsl(${h},100%,60%)`; glow=`hsl(${h},100%,50%)`; cockpit=`hsla(${h},100%,60%,0.6)`;
    colorA=`hsla(${h},100%,60%,0.27)`;
  }
  c.save(); c.translate(26,30); c.scale(0.55,0.55);
  const eg=c.createRadialGradient(0,14,0,0,14,30);
  eg.addColorStop(0,colorA); eg.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=eg; c.beginPath(); c.arc(0,16,28,0,Math.PI*2); c.fill();
  c.shadowBlur=isActive?18:10; c.shadowColor=glow;
  c.fillStyle='#050520'; c.beginPath();
  c.moveTo(0,-24);c.lineTo(13,8);c.lineTo(8,18);c.lineTo(0,13);c.lineTo(-8,18);c.lineTo(-13,8);
  c.closePath(); c.fill();
  c.strokeStyle=color; c.lineWidth=1.8; c.stroke();
  c.fillStyle='#080828';
  c.beginPath();c.moveTo(13,8);c.lineTo(28,20);c.lineTo(18,24);c.lineTo(8,18);c.closePath();c.fill();c.stroke();
  c.beginPath();c.moveTo(-13,8);c.lineTo(-28,20);c.lineTo(-18,24);c.lineTo(-8,18);c.closePath();c.fill();c.stroke();
  c.beginPath();c.ellipse(0,-8,5,8,0,0,Math.PI*2);
  c.fillStyle=cockpit; c.fill();
  c.shadowBlur=0; c.restore();
}

function renderSkinSelector(){
  const unlocked = getUnlocked();
  const active = getActiveSkin();
  const row = document.getElementById('skin-row');
  row.innerHTML = '';
  SKINS.forEach(s => {
    const isUnlocked = unlocked.includes(s.id);
    const isActive = s.id === active;
    const chip = document.createElement('div');
    chip.className = 'skin-chip' + (isUnlocked?' unlocked':'locked') + (isActive?' selected':'');
    // Mini canvas preview
    const cnv = document.createElement('canvas');
    cnv.className = 'skin-canvas';
    cnv.width = 52; cnv.height = 52;
    chip.appendChild(cnv);
    drawMiniShip(cnv, s, isActive);
    // Name label
    const nameEl = document.createElement('div');
    nameEl.className = 'skin-chip-name';
    nameEl.textContent = s.name;
    chip.appendChild(nameEl);
    // Lock overlay for locked skins
    if(!isUnlocked){
      const overlay = document.createElement('div');
      overlay.className = 'skin-locked-overlay';
      const lockIcon = document.createElement('div');
      lockIcon.className = 'skin-lock-icon';
      lockIcon.textContent = '🔒';
      const thresh = document.createElement('div');
      thresh.className = 'skin-thresh-label';
      thresh.textContent = s.threshold.toLocaleString();
      overlay.appendChild(lockIcon);
      overlay.appendChild(thresh);
      chip.appendChild(overlay);
    }
    if(isUnlocked){
      chip.addEventListener('click', ()=>{
        saveActiveSkin(s.id);
        renderSkinSelector();
      });
    }
    row.appendChild(chip);
  });
}
renderSkinSelector();

// ── Leaderboard renderer ───────────────────────────────────────────
function renderLB(highlightScore){
  const lb = getLB();
  const tbl = document.getElementById('lb-table');
  let html = '<div class="lb-row lb-header"><span>RANK</span><span>PILOT</span><span>DIST</span><span>TIME</span></div>';
  for(let i=0;i<10;i++){
    const e = lb[i];
    const isHL = e && highlightScore!==null && e.score===highlightScore;
    if(e){
      html += `<div class="lb-row${isHL?' lb-highlight':''}">
        <span class="lb-rank">${i+1}</span>
        <span>${e.name}</span>
        <span>${e.score}</span>
        <span>${Math.floor(e.time/1000)}s</span>
      </div>`;
    } else {
      html += `<div class="lb-row"><span class="lb-rank">${i+1}</span><span>---</span><span>---</span><span>---</span></div>`;
    }
  }
  tbl.innerHTML = html;
}

// ── Tab switching ──────────────────────────────────────────────────
function showTab(tab){
  if(tab==='game'){
    viewGame.style.display='flex';
    viewBoard.style.display='none';
    tabGame.classList.add('active');
    tabBoard.classList.remove('active');
  } else {
    viewGame.style.display='none';
    viewBoard.style.display='flex';
    tabGame.classList.remove('active');
    tabBoard.classList.add('active');
  }
}
tabGame.addEventListener('click',()=>showTab('game'));
tabBoard.addEventListener('click',()=>{ renderLB(null); showTab('board'); });
playBtnLb.addEventListener('click', startGame);

// ── Keys ───────────────────────────────────────────────────────────
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if(e.key==='r'||e.key==='R') startGame();
  if(!running && e.key==='Enter') startGame();
});
window.addEventListener('keyup', e => keys[e.key] = false);
document.getElementById('da-l').addEventListener('touchstart',e=>{e.preventDefault();keys['ArrowLeft']=true;},{passive:false});
document.getElementById('da-l').addEventListener('touchend',  e=>{e.preventDefault();keys['ArrowLeft']=false;},{passive:false});
document.getElementById('da-r').addEventListener('touchstart',e=>{e.preventDefault();keys['ArrowRight']=true;},{passive:false});
document.getElementById('da-r').addEventListener('touchend',  e=>{e.preventDefault();keys['ArrowRight']=false;},{passive:false});
playBtn.addEventListener('click', startGame);

// ── Name entry flow ────────────────────────────────────────────────
let pendingLBScore = null, pendingLBTime = null;
function submitName(){
  const name = nameInput.value.trim()||'PILOT';
  insertLB(name, pendingLBScore, pendingLBTime);
  nameEntry.style.display='none';
  renderLB(pendingLBScore);
  viewTabs.style.display='flex';
  showTab('board');
  pendingLBScore = null;
}
nameSubmit.addEventListener('click', submitName);
nameInput.addEventListener('keydown', e=>{ if(e.key==='Enter') submitName(); });

// ── Game state ─────────────────────────────────────────────────────
let running = false;
let hs = parseInt(localStorage.getItem('wl_hs')||'0');
hsEl.textContent = hs;
let ship, obstacles, pickups, particles, floats, stars, shockwaves, banners;
let speed, score, shield, surviveTime;
let laneW, laneXs;
let spawnTimer, pickupTimer, lastTime, moveCooldown;
let flashAlpha, combo, comboTimer;
let warpActive, warpTimer, warpMaxTime;
let shake, prevScore, eSpeed;
let idleRunning = true;

function getLaneX(l){ return laneXs[l]; }

let speedBoostTimer = 0;
const BOOST_PICKUP_DUR = 8000;

function startGame(){
  running = true; // set immediately to block double-calls
  idleRunning = false;
  nameEntry.style.display='none';
  overlay.classList.add('gone');
  speed = 4; eSpeed = 4; score = 0; shield = 3; surviveTime = 0;
  spawnTimer = 0; pickupTimer = 0; flashAlpha = 0; moveCooldown = 0;
  combo = 1; comboTimer = 0; warpActive = false; warpTimer = 0; warpMaxTime = 2500;
  speedBoostTimer = 0;
  shake = {timer:0};
  prevScore = 0;
  laneW = W / LANES; laneXs = Array.from({length:LANES},(_,i)=>laneW*i+laneW/2);
  ship = {lane:2, x:getLaneX(2), targetX:getLaneX(2), y:H*0.78, tilt:0, alive:true};
  obstacles=[]; pickups=[]; particles=[]; floats=[]; shockwaves=[]; banners=[];
  stars = Array.from({length:200},()=>({
    x:Math.random()*W, y:Math.random()*H,
    spd:0.3+Math.random()*2, r:Math.random()*1.6+0.2, a:0.2+Math.random()*0.7
  }));
  shieldFill.style.width='100%';
  warpBar.style.display='none';
  boostBar.style.display='none';
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

const LANES = 5;

// ── Main loop ──────────────────────────────────────────────────────
function loop(now){
  if(!running) return;
  const dt = Math.min(now-lastTime, 50);
  lastTime = now;
  surviveTime += dt;
  const secs = surviveTime/1000;

  prevScore = score;
  score += dt * 0.22 * combo;
  speed = 4 + secs * 0.02 + Math.pow(secs / 100, 1.8) * 0.4;
  moveCooldown -= dt;

  // Speed boost
  if(speedBoostTimer > 0) speedBoostTimer -= dt;
  const spaceBoost = !!(keys[' '] && ship.alive);
  const boostMult = (spaceBoost ? 1.4 : 1) * (speedBoostTimer > 0 ? 1.35 : 1);
  eSpeed = speed * boostMult; // effectiveSpeed for movement only
  // Update boost bar
  if(speedBoostTimer > 0){
    boostBar.style.display = 'block';
    boostFill.style.width = (speedBoostTimer / BOOST_PICKUP_DUR * 100) + '%';
  } else if(!spaceBoost) {
    boostBar.style.display = 'none';
  }

  if(warpActive){
    warpTimer -= dt;
    warpFill.style.width = Math.max(0, warpTimer/warpMaxTime*100)+'%';
    if(warpTimer<=0){ warpActive=false; warpBar.style.display='none'; }
  }

  comboTimer += dt;
  if(comboTimer > 9000){ combo=Math.max(1,combo-0.5); comboTimer=0; }

  // Input
  if(moveCooldown<=0){
    if((keys['ArrowLeft']||keys['a']||keys['A'])&&ship.lane>0){
      ship.lane--; ship.targetX=getLaneX(ship.lane); ship.tilt=-1; moveCooldown=115;
    } else if((keys['ArrowRight']||keys['d']||keys['D'])&&ship.lane<LANES-1){
      ship.lane++; ship.targetX=getLaneX(ship.lane); ship.tilt=1; moveCooldown=115;
    }
  }
  ship.x += (ship.targetX-ship.x)*0.25;
  ship.tilt *= 0.86;

  stars.forEach(s=>{ s.y+=s.spd*eSpeed*0.14; if(s.y>H+2){s.y=-2;s.x=Math.random()*W;} });

  spawnTimer += dt;
  const spawnGap = Math.max(900, 3000 - secs*35);
  if(spawnTimer>spawnGap){ spawnTimer=0; spawnObstacle(secs); }

  pickupTimer += dt;
  if(pickupTimer>2400){ pickupTimer=0; spawnPickup(secs); }

  // Move obstacles + seeker drift
  obstacles.forEach(o=>{
    o.y += eSpeed*o.spd;
    o.rot += o.spin;
    if(o.type==='seeker'){
      const targetX = getLaneX(ship.lane);
      o.x += (targetX - o.x) * 0.012;
      o.trail = o.trail || [];
      o.trail.push({x:o.x, y:o.y});
      if(o.trail.length > 12) o.trail.shift();
    }
  });
  obstacles = obstacles.filter(o=>o.y<H+100);

  pickups.forEach(p=>{ p.y+=eSpeed*0.65; p.pulse+=0.09; });
  pickups = pickups.filter(p=>p.y<H+60);

  particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy+eSpeed*0.28; p.vx*=0.96; p.life-=p.decay; p.r*=0.95; });
  particles = particles.filter(p=>p.life>0&&p.r>0.3);

  shockwaves.forEach(sw=>{ sw.r+=5; sw.alpha*=0.88; });
  shockwaves = shockwaves.filter(sw=>sw.alpha>0.02);

  floats.forEach(f=>{ f.y+=f.vy; f.life-=0.022; });
  floats = floats.filter(f=>f.life>0);

  banners.forEach(b=>{ b.life-=dt; });
  banners = banners.filter(b=>b.life>0);

  if(ship.alive) emitExhaust();
  flashAlpha *= 0.87;
  if(shake.timer>0) shake.timer-=dt;

  // Collision
  if(ship.alive){
    for(let i=obstacles.length-1;i>=0;i--){
      const o=obstacles[i];
      const dx=Math.abs(o.x-ship.x), dy=Math.abs(o.y-ship.y);
      if(!o.nearMissed && dy>o.hitH && dy<o.hitH+44 && dx<laneW*0.55 && dx>o.hitW){
        o.nearMissed=true;
        combo=Math.min(combo+0.3,5); comboTimer=0;
        emitNearMiss(ship.x, ship.y, ship.tilt>=0?1:-1);
        floatText(ship.x, ship.y-40,'CLOSE!','#ffdd00');
      }
      if(!warpActive && dy<o.hitH && dx<o.hitW){
        obstacles.splice(i,1);
        shield--; flashAlpha=1; combo=1; comboTimer=0;
        emitBurst(ship.x,ship.y,'#ff3300');
        shieldFill.style.width=Math.max(0,shield/3*100)+'%';
        if(shield<=0){ ship.alive=false; shake.timer=700; emitExplosion(ship.x,ship.y); setTimeout(gameOver,800); }
        break;
      }
    }
    for(let i=pickups.length-1;i>=0;i--){
      const p=pickups[i];
      if(Math.abs(p.y-ship.y)<32&&Math.abs(p.x-ship.x)<laneW*0.42){
        pickups.splice(i,1);
        combo=Math.min(combo+0.5,5); comboTimer=0;
        if(p.type==='shield'&&shield<3){
          shield=Math.min(3,shield+1);
          shieldFill.style.width=(shield/3*100)+'%';
          floatText(p.x,p.y,'+SHIELD','#0099ff');
        } else if(p.type==='warp'){
          warpActive=true; warpTimer=warpMaxTime;
          obstacles=[];
          warpBar.style.display='block';
          floatText(ship.x,ship.y-40,'WARP!','#ff00ff');
          emitBurst(ship.x,ship.y,'#ff00ff');
          for(let j=0;j<3;j++) emitBurst(ship.x+(Math.random()-0.5)*60,ship.y+(Math.random()-0.5)*40,'#cc00ff');
        } else if(p.type==='speed'){
          speedBoostTimer=BOOST_PICKUP_DUR;
          boostBar.style.display='block';
          floatText(p.x,p.y,'+BOOST','#ffdd00');
          emitBurst(p.x,p.y,'#ffdd00');
        } else {
          const bonus=Math.floor(300*combo);
          score+=bonus;
          floatText(p.x,p.y,'+'+bonus,'#00ffcc');
        }
        if(p.type!=='speed') emitBurst(p.x,p.y,p.type==='fuel'?'#00ffcc':p.type==='warp'?'#ff00ff':'#0099ff');
      }
    }
  }

  checkSkinUnlocks(prevScore, score);
  draw();
  scoreEl.textContent = Math.floor(score);
  if(combo>=1.5){
    comboEl.style.display='block'; comboLbl.style.display='block';
    comboEl.textContent='x'+combo.toFixed(1);
  } else {
    comboEl.style.display='none'; comboLbl.style.display='none';
  }
  requestAnimationFrame(loop);
}

// ── Skin unlock checker ────────────────────────────────────────────
function checkSkinUnlocks(prev, cur){
  const unlocked = getUnlocked();
  let changed = false;
  SKINS.forEach(s=>{
    if(s.threshold>0 && !unlocked.includes(s.id) && prev<s.threshold && cur>=s.threshold){
      unlocked.push(s.id);
      changed = true;
      banners.push({text:'SKIN UNLOCKED: '+s.name, color:s.color, glow:s.glow, life:3000});
    }
  });
  if(changed) saveUnlocked(unlocked);
}

// ── Obstacle spawning ──────────────────────────────────────────────
function spawnObstacle(secs){
  const roll = Math.random();
  // New types at higher durations
  if(secs>55 && roll<Math.min(0.2,secs*0.002)){
    spawnSeeker(); return;
  }
  if(secs>35 && roll<Math.min(0.25,0.05+secs*0.003)){
    spawnMine(); return;
  }
  if(secs>20 && roll<Math.min(0.30,0.05+secs*0.004)){
    spawnLaser(); return;
  }

  // Original rock/barrier logic
  let count=1;
  if(secs>90&&Math.random()<0.5) count=3;
  else if(secs>45&&Math.random()<0.38) count=2;
  const maxBlock=Math.min(count,LANES-2);
  const used=[];
  for(let n=0;n<maxBlock;n++){
    let lane,tries=0;
    do{lane=Math.floor(Math.random()*LANES);tries++;}while(used.includes(lane)&&tries<10);
    if(used.includes(lane)) continue;
    used.push(lane);
    const type=secs>30&&Math.random()<Math.min(0.5,secs*0.005)?'barrier':'rock';
    const size=type==='rock'?22+Math.random()*14:null;
    const baseSpd=0.7+Math.random()*0.25+secs*0.001;
    obstacles.push({
      lane,x:getLaneX(lane),y:-55,type,size,
      rot:Math.random()*Math.PI*2,spin:(Math.random()-0.5)*0.07,
      spd:Math.min(baseSpd,1.7),
      hitW:type==='rock'?(size||24)*0.76:laneW*0.35,
      hitH:type==='rock'?(size||24)*0.76:11,
      hue:type==='rock'?195+Math.floor(Math.random()*40):Math.random()<0.5?0:30,
      nearMissed:false,
    });
  }
}

function spawnLaser(){
  // Pick 2-3 consecutive lanes to block
  const span = Math.random()<0.4 ? 3 : 2;
  const maxStart = LANES - span;
  const startLane = Math.floor(Math.random()*(maxStart+1));
  const y = -20;
  const groupId = Date.now();
  for(let i=0;i<span;i++){
    const lane = startLane+i;
    obstacles.push({
      lane, x:getLaneX(lane), y, type:'laser',
      rot:0, spin:0, spd:1.35,
      hitW:laneW*0.48, hitH:10,
      hue:0, size:null,
      groupId, nearMissed:false,
    });
  }
}

function spawnMine(){
  const lane = Math.floor(Math.random()*LANES);
  const size = 30+Math.random()*10;
  obstacles.push({
    lane, x:getLaneX(lane), y:-60, type:'mine',
    rot:0, spin:0.03, spd:0.5,
    hitW:size*0.65, hitH:size*0.65,
    size, hue:0, nearMissed:false,
  });
}

function spawnSeeker(){
  const lane = Math.floor(Math.random()*LANES);
  obstacles.push({
    lane, x:getLaneX(lane), y:-50, type:'seeker',
    rot:0, spin:0.06, spd:0.9,
    hitW:16, hitH:16,
    size:18, hue:0, nearMissed:false,
    trail:[],
  });
}

function spawnPickup(secs){
  const lane=Math.floor(Math.random()*LANES);
  const roll=Math.random();
  const warpChance=secs>15?Math.min(0.18,0.05+secs*0.001):0;
  const speedChance=0.22;
  let type;
  if(roll<warpChance) type='warp';
  else if(roll<warpChance+speedChance) type='speed';
  else if(roll<warpChance+speedChance+0.25) type='shield';
  else type='fuel';
  pickups.push({lane,x:getLaneX(lane),y:-30,type,pulse:0});
}

// ── Particles ──────────────────────────────────────────────────────
function emitExhaust(){
  const skin = SKINS[getActiveSkin()]||SKINS[0];
  if(Math.random()>0.35) return;
  particles.push({
    x:ship.x+(Math.random()-0.5)*10, y:ship.y+20,
    vx:(Math.random()-0.5)*1.4, vy:1+Math.random()*2,
    life:1, decay:0.05+Math.random()*0.04, r:5+Math.random()*4, color:'exhaust_'+skin.id,
    skinExhaust: skin.exhaust, skinColor: skin.color,
  });
}

function emitBurst(x,y,color){
  for(let i=0;i<20;i++){
    const a=Math.random()*Math.PI*2, spd=2+Math.random()*6;
    particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:1,decay:0.03+Math.random()*0.03,r:3+Math.random()*4,color});
  }
}

function emitNearMiss(x,y,dir){
  for(let i=0;i<18;i++){
    const angle = (dir>0?0:Math.PI) + (Math.random()-0.5)*1.0;
    const spd = 3+Math.random()*7;
    particles.push({x,y,vx:Math.cos(angle)*spd*dir,vy:Math.sin(angle)*spd-1,
      life:1,decay:0.04+Math.random()*0.04,r:2+Math.random()*3,color:'#ffee44'});
  }
}

function emitExplosion(x,y){
  shockwaves.push({x,y,r:10,maxR:180,alpha:0.9});
  shockwaves.push({x,y,r:5,maxR:120,alpha:0.7});
  for(let i=0;i<80;i++){
    const a=Math.random()*Math.PI*2, spd=1+Math.random()*11;
    const cols=['#ff4400','#ff8800','#ffcc00','#ffffff','#00ccff','#ff2266','#ff6600'];
    particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:1,decay:0.01+Math.random()*0.018,r:4+Math.random()*9,color:cols[Math.floor(Math.random()*cols.length)]});
  }
}

function floatText(x,y,text,color){
  floats.push({x,y,text,color,life:1,vy:-1.2});
}

// ── Game over ──────────────────────────────────────────────────────
function gameOver(){
  running=false;
  const s=Math.floor(score);
  if(s>hs){ hs=s; localStorage.setItem('wl_hs',hs); }
  hsEl.textContent=hs;
  document.getElementById('skin-section').style.display='block';
  renderSkinSelector();
  overlay.classList.remove('gone');
  statRow.style.display='flex';
  finalScore.textContent=s;
  finalTime.textContent=Math.floor(surviveTime/1000)+'s';
  finalHs.textContent=hs;
  playBtn.textContent='WARP AGAIN';
  viewTabs.style.display='flex';
  showTab('game');

  if(qualifiesForLB(s)){
    pendingLBScore=s; pendingLBTime=surviveTime;
    nameInput.value='';
    nameEntry.style.display='flex';
  }
}

// ── Draw ───────────────────────────────────────────────────────────
function draw(){
  ctx.save();
  // Screen shake
  if(shake.timer>0){
    ctx.translate((Math.random()-0.5)*7,(Math.random()-0.5)*5);
  }

  ctx.fillStyle='#00020e';
  ctx.fillRect(-10,-10,W+20,H+20);

  // Nebula glow
  const ng=ctx.createRadialGradient(W/2,H*0.3,0,W/2,H*0.3,H*0.65);
  ng.addColorStop(0,'rgba(0,25,70,0.3)'); ng.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=ng; ctx.fillRect(0,0,W,H);

  if(warpActive){
    ctx.fillStyle=`rgba(80,0,120,${0.12+Math.sin(Date.now()*0.008)*0.05})`;
    ctx.fillRect(0,0,W,H);
  }
  if(eSpeed > speed + 0.5){
    ctx.fillStyle=`rgba(255,200,0,${Math.min(0.06,(eSpeed-speed)*0.012)})`;
    ctx.fillRect(0,0,W,H);
  }

  // Stars
  stars.forEach(s=>{
    const streak=eSpeed>7?(eSpeed-7)*s.spd*1.5:0;
    if(streak>1){
      ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(s.x,s.y-streak);
      ctx.strokeStyle=`rgba(160,220,255,${s.a*0.5})`; ctx.lineWidth=s.r; ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(180,220,255,${s.a})`; ctx.fill();
    }
  });

  // Lane lines
  for(let i=0;i<=LANES;i++){
    const x=i*laneW, isEdge=i===0||i===LANES;
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H);
    ctx.strokeStyle=isEdge?'rgba(0,180,255,0.35)':'rgba(0,100,180,0.18)';
    ctx.lineWidth=isEdge?2:1; ctx.stroke();
  }
  for(let i=0;i<LANES;i++){
    const cx2=laneXs[i];
    const lg=ctx.createLinearGradient(cx2-laneW/2,0,cx2+laneW/2,0);
    lg.addColorStop(0,'rgba(0,0,0,0)');
    lg.addColorStop(0.5,'rgba(0,50,120,0.06)');
    lg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=lg; ctx.fillRect(cx2-laneW/2,0,laneW,H);
  }
  const dashLen=36,gapLen=28,total=dashLen+gapLen;
  const offset=(Date.now()*eSpeed*0.06)%total;
  ctx.strokeStyle='rgba(0,120,200,0.13)'; ctx.lineWidth=1;
  ctx.setLineDash([dashLen,gapLen]); ctx.lineDashOffset=-offset;
  for(let i=0;i<LANES;i++){
    ctx.beginPath(); ctx.moveTo(laneXs[i],0); ctx.lineTo(laneXs[i],H); ctx.stroke();
  }
  ctx.setLineDash([]);

  // Shockwaves
  shockwaves.forEach(sw=>{
    ctx.beginPath(); ctx.arc(sw.x,sw.y,sw.r,0,Math.PI*2);
    ctx.strokeStyle=`rgba(255,120,0,${sw.alpha})`;
    ctx.lineWidth=3; ctx.shadowBlur=20; ctx.shadowColor='#ff6600'; ctx.stroke();
    ctx.shadowBlur=0;
  });

  // Obstacles
  obstacles.forEach(o=>{
    ctx.save(); ctx.translate(o.x,o.y);
    if(o.type==='rock'){
      ctx.rotate(o.rot);
      const sz=o.size;
      ctx.beginPath();
      for(let i=0;i<8;i++){
        const a=(i/8)*Math.PI*2, r=sz*(0.7+Math.sin(i*2.3+1.2)*0.3);
        i===0?ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r):ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
      }
      ctx.closePath();
      ctx.fillStyle='#080818'; ctx.fill();
      ctx.strokeStyle=`hsl(${o.hue},75%,58%)`; ctx.lineWidth=2.5;
      ctx.shadowBlur=18; ctx.shadowColor=`hsl(${o.hue},80%,50%)`; ctx.stroke();
      ctx.strokeStyle=`hsla(${o.hue},60%,70%,0.3)`; ctx.lineWidth=1; ctx.shadowBlur=0;
      ctx.beginPath(); ctx.moveTo(-sz*0.3,-sz*0.2); ctx.lineTo(sz*0.1,sz*0.3); ctx.stroke();
    } else if(o.type==='barrier'){
      const hw=laneW*0.37, hh=11, t=Date.now()*0.006;
      ctx.fillStyle=`hsla(${o.hue},90%,25%,0.35)`; ctx.fillRect(-hw,-hh,hw*2,hh*2);
      ctx.strokeStyle=`hsl(${o.hue},100%,58%)`; ctx.lineWidth=2.5;
      ctx.shadowBlur=22; ctx.shadowColor=`hsl(${o.hue},100%,55%)`; ctx.strokeRect(-hw,-hh,hw*2,hh*2);
      ctx.fillStyle=`hsla(${o.hue},100%,75%,${0.25+Math.sin(t+o.y)*0.18})`; ctx.fillRect(-hw+3,-2,hw*2-6,4);
      [[-hw+4,-hh+4],[hw-4,-hh+4],[-hw+4,hh-4],[hw-4,hh-4]].forEach(([bx,by])=>{
        ctx.beginPath();ctx.arc(bx,by,3,0,Math.PI*2);
        ctx.fillStyle=`hsl(${o.hue},100%,80%)`;ctx.shadowBlur=8;ctx.fill();
      });
    } else if(o.type==='laser'){
      const hw=laneW*0.48, hh=8, t=Date.now()*0.012;
      // Core beam
      ctx.shadowBlur=30; ctx.shadowColor='#aaeeff';
      ctx.fillStyle=`rgba(180,240,255,${0.8+Math.sin(t)*0.15})`;
      ctx.fillRect(-hw,-3,hw*2,6);
      // Glow halo
      const lg=ctx.createLinearGradient(-hw,0,hw,0);
      lg.addColorStop(0,'rgba(0,200,255,0)');
      lg.addColorStop(0.2,'rgba(100,220,255,0.5)');
      lg.addColorStop(0.5,'rgba(200,240,255,0.8)');
      lg.addColorStop(0.8,'rgba(100,220,255,0.5)');
      lg.addColorStop(1,'rgba(0,200,255,0)');
      ctx.fillStyle=lg; ctx.fillRect(-hw,-hh,hw*2,hh*2);
      // Electric arcs
      ctx.strokeStyle=`rgba(220,255,255,${0.3+Math.sin(t*3)*0.2})`;
      ctx.lineWidth=1; ctx.shadowBlur=10;
      for(let j=0;j<3;j++){
        const ax=-hw+Math.random()*hw*2;
        ctx.beginPath(); ctx.moveTo(ax,-4);
        ctx.lineTo(ax+(Math.random()-0.5)*12, 0);
        ctx.lineTo(ax+(Math.random()-0.5)*8, 4);
        ctx.stroke();
      }
      ctx.shadowBlur=0;
    } else if(o.type==='mine'){
      const sz=o.size, t=Date.now()*0.004;
      const pulse = 0.8+Math.sin(t)*0.2;
      ctx.shadowBlur=25+Math.sin(t)*10; ctx.shadowColor='#ff3300';
      // Spikes
      ctx.strokeStyle=`rgba(255,${60+Math.sin(t)*30},0,0.85)`;
      ctx.lineWidth=2;
      for(let i=0;i<8;i++){
        const a=(i/8)*Math.PI*2+o.rot;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*sz*0.55, Math.sin(a)*sz*0.55);
        ctx.lineTo(Math.cos(a)*sz*pulse, Math.sin(a)*sz*pulse);
        ctx.stroke();
        ctx.beginPath(); ctx.arc(Math.cos(a)*sz*0.85,Math.sin(a)*sz*0.85,3,0,Math.PI*2);
        ctx.fillStyle=`hsl(20,100%,65%)`; ctx.fill();
      }
      // Body
      ctx.beginPath();
      for(let i=0;i<8;i++){
        const a=(i/8)*Math.PI*2;
        const r=sz*0.52;
        i===0?ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r):ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
      }
      ctx.closePath();
      ctx.fillStyle='#100508'; ctx.fill();
      ctx.strokeStyle='#ff4400'; ctx.lineWidth=2.5; ctx.stroke();
      ctx.shadowBlur=0;
      // Core
      ctx.beginPath(); ctx.arc(0,0,sz*0.22,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,80,0,${0.4+Math.sin(t)*0.3})`; ctx.fill();
    } else if(o.type==='seeker'){
      const sz=o.size, t=Date.now()*0.006;
      // Trail
      if(o.trail && o.trail.length>1){
        for(let i=0;i<o.trail.length-1;i++){
          const alpha = (i/o.trail.length)*0.5;
          ctx.beginPath();
          ctx.arc(o.trail[i].x-o.x, o.trail[i].y-o.y, 3*(i/o.trail.length), 0, Math.PI*2);
          ctx.fillStyle=`rgba(200,80,255,${alpha})`; ctx.fill();
        }
      }
      // Diamond body
      ctx.shadowBlur=20; ctx.shadowColor='#cc00ff';
      ctx.beginPath();
      ctx.moveTo(0,-sz); ctx.lineTo(sz*0.7,0); ctx.lineTo(0,sz); ctx.lineTo(-sz*0.7,0);
      ctx.closePath();
      ctx.fillStyle='#0a0015'; ctx.fill();
      ctx.strokeStyle=`hsl(${280+Math.sin(t)*20},100%,65%)`; ctx.lineWidth=2; ctx.stroke();
      // Inner glow
      ctx.beginPath(); ctx.arc(0,0,sz*0.35,0,Math.PI*2);
      ctx.fillStyle=`rgba(180,0,255,${0.4+Math.sin(t*2)*0.2})`; ctx.fill();
      ctx.shadowBlur=0;
    }
    ctx.shadowBlur=0; ctx.restore();
  });

  // Pickups
  pickups.forEach(p=>{
    ctx.save(); ctx.translate(p.x,p.y);
    const pulse=Math.sin(p.pulse)*3;
    const col=p.type==='fuel'?'#00ffcc':p.type==='warp'?'#ff00ff':p.type==='speed'?'#ffdd00':'#0099ff';
    ctx.shadowBlur=20; ctx.shadowColor=col;
    ctx.beginPath(); ctx.arc(0,0,16+pulse*0.4,0,Math.PI*2);
    ctx.strokeStyle=col; ctx.lineWidth=2; ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2);
    ctx.fillStyle=col+'33'; ctx.fill();
    ctx.shadowBlur=0; ctx.fillStyle=col;
    ctx.font='bold 14px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(p.type==='fuel'?'⚡':p.type==='warp'?'✦':p.type==='speed'?'▶':' 🛡',0,1);
    ctx.restore();
  });

  // Particles
  particles.forEach(p=>{
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    if(p.color.startsWith('exhaust_')){
      const ec = p.skinExhaust||'#0066ff';
      const r=parseInt(ec.slice(1,3),16), g=parseInt(ec.slice(3,5),16), b=parseInt(ec.slice(5,7),16);
      ctx.fillStyle=`rgba(${Math.min(255,r+60)},${Math.min(255,g+40)},${b},${p.life*0.55})`;
      ctx.shadowColor=ec;
    } else {
      ctx.fillStyle=p.color+Math.floor(p.life*255).toString(16).padStart(2,'0');
      ctx.shadowColor=p.color;
    }
    ctx.shadowBlur=8; ctx.fill();
  });
  ctx.shadowBlur=0;

  // Floating text
  floats.forEach(f=>{
    ctx.save(); ctx.globalAlpha=f.life;
    ctx.font='bold 16px Rajdhani';
    ctx.fillStyle=f.color; ctx.textAlign='center';
    ctx.shadowBlur=10; ctx.shadowColor=f.color;
    ctx.fillText(f.text,f.x,f.y);
    ctx.shadowBlur=0; ctx.restore();
  });

  // Ship
  if(ship.alive) drawShip(ctx);

  // Banners (skin unlock)
  banners.forEach(b=>{
    const alpha = Math.min(1, b.life/500);
    ctx.save(); ctx.globalAlpha=alpha;
    ctx.font='bold 22px "Exo 2", sans-serif';
    ctx.textAlign='center';
    ctx.fillStyle=b.color;
    ctx.shadowBlur=30; ctx.shadowColor=b.glow;
    ctx.fillText(b.text, W/2, H*0.38);
    ctx.shadowBlur=0; ctx.restore();
  });

  // Hit flash
  if(flashAlpha>0.01){
    ctx.fillStyle=`rgba(255,20,0,${flashAlpha*0.3})`; ctx.fillRect(0,0,W,H);
    const vg=ctx.createRadialGradient(W/2,H/2,H*0.15,W/2,H/2,H*0.85);
    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(1,`rgba(255,0,0,${flashAlpha*0.4})`);
    ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  }

  ctx.restore();
}

function drawShip(ctx){
  const skinId = getActiveSkin();
  let skin = SKINS[skinId] || SKINS[0];
  // INFERNO: rainbow shift
  let color = skin.color, glow = skin.glow, cockpit = skin.cockpit, colorA = color+'88';
  if(skinId===6){
    const hue=(Date.now()*0.15)%360;
    color=`hsl(${hue},100%,60%)`; glow=`hsl(${hue},100%,50%)`;
    cockpit=`hsla(${hue},100%,60%,0.6)`; colorA=`hsla(${hue},100%,60%,0.53)`;
  }
  ctx.save(); ctx.translate(ship.x,ship.y); ctx.rotate(ship.tilt*0.28);
  if(warpActive){
    const wg=ctx.createRadialGradient(0,0,0,0,0,50);
    wg.addColorStop(0,'rgba(200,0,255,0.35)'); wg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=wg; ctx.beginPath(); ctx.arc(0,0,50,0,Math.PI*2); ctx.fill();
  }
  const eg=ctx.createRadialGradient(0,14,0,0,14,30);
  eg.addColorStop(0,colorA); eg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=eg; ctx.beginPath(); ctx.arc(0,16,28,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=warpActive?30:24; ctx.shadowColor=warpActive?'#cc00ff':glow;
  ctx.fillStyle='#050520'; ctx.beginPath();
  ctx.moveTo(0,-24); ctx.lineTo(13,8); ctx.lineTo(8,18); ctx.lineTo(0,13); ctx.lineTo(-8,18); ctx.lineTo(-13,8);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle=warpActive?'#ff00ff':color; ctx.lineWidth=1.8; ctx.stroke();
  ctx.fillStyle='#080828'; ctx.beginPath();
  ctx.moveTo(13,8);ctx.lineTo(28,20);ctx.lineTo(18,24);ctx.lineTo(8,18);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-13,8);ctx.lineTo(-28,20);ctx.lineTo(-18,24);ctx.lineTo(-8,18);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0,-8,5,8,0,0,Math.PI*2);
  ctx.fillStyle=warpActive?'rgba(255,0,255,0.6)':cockpit; ctx.fill();
  ctx.shadowBlur=0; ctx.restore();
}

// ── Idle animation ─────────────────────────────────────────────────
function idleDraw(){
  if(!idleRunning) return;
  ctx.fillStyle='#00020e'; ctx.fillRect(0,0,W,H);
  const t=Date.now()*0.0006;
  for(let i=0;i<40;i++){
    const frac=i/40, y=((frac*H+t*80*(0.3+frac))%H), prog=y/H;
    const x1=(W/2)*(1-prog*0.95), x2=W-(W/2)*(1-prog*0.95);
    ctx.beginPath(); ctx.moveTo(x1,y); ctx.lineTo(x2,y);
    ctx.strokeStyle=`rgba(0,${60+frac*120},${160+frac*80},${0.03+prog*0.12})`; ctx.lineWidth=1; ctx.stroke();
  }
  requestAnimationFrame(idleDraw);
}
idleDraw();
</script>
