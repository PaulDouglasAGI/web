<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCADE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;600&family=Exo+2:wght@900&family=Rajdhani:wght@600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;padding:40px 20px;}
.hub{max-width:700px;width:100%;}
.hub-label{font-size:9px;letter-spacing:4px;color:#222;text-transform:uppercase;margin-bottom:8px;}
.hub-title{font-family:'Exo 2',sans-serif;font-size:clamp(20px,5vw,36px);font-weight:900;color:#fff;letter-spacing:6px;margin-bottom:48px;}
.games{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:500px){.games{grid-template-columns:1fr;}}
.game-card{display:block;text-decoration:none;border:1px solid #1a1a1a;padding:28px 24px;transition:border-color 0.2s,background 0.2s;background:#080808;}
.game-card:hover{border-color:#333;background:#0d0d0d;}
.game-tag{font-size:8px;letter-spacing:3px;color:#333;text-transform:uppercase;margin-bottom:10px;}
.game-name{font-size:16px;font-weight:600;letter-spacing:1px;margin-bottom:8px;}
.game-desc{font-size:11px;color:#444;line-height:1.7;}
.warp .game-name{color:#00ccff;font-family:'Exo 2',sans-serif;font-size:18px;letter-spacing:4px;font-weight:900;}
.warp .game-tag{color:#003344;}
.warp .game-desc{color:#003344;}
.warp:hover{border-color:#004466;background:#000d14;}
.sim .game-name{color:#8a9a8a;font-size:13px;letter-spacing:0.5px;}
.sim .game-tag{color:#2a3020;}
.sim .game-desc{color:#2a3020;}
.sim:hover{border-color:#2a3a20;background:#080c06;}
</style>
</head>
<body>
<div class="hub">
  <div class="hub-label">Games</div>
  <div class="hub-title">ARCADE</div>
  <div class="games">
    <a href="warp-lane.html" class="game-card warp">
      <div class="game-tag">Action / Arcade</div>
      <div class="game-name">WARP LANE</div>
      <div class="game-desc">High-speed lane navigation. Survive as long as possible.</div>
    </a>
    <a href="1st-world-simulator.html" class="game-card sim">
      <div class="game-tag">Governance Simulation / Illinois 2026</div>
      <div class="game-name">1st World Simulator</div>
      <div class="game-desc">You manage decline. No win condition. Monthly turns. Brutal honesty.</div>
    </a>
  </div>
</div>
</body>
</html>
