<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UMBRA DIRECTORATE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{height:100%;}
body{min-height:100%;background:#0a0a14;font-family:'Rajdhani',sans-serif;color:#fff;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 80% 50% at 20% 20%,rgba(0,60,120,0.13) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 80% 70%,rgba(0,40,100,0.09) 0%,transparent 60%);pointer-events:none;}

/* Header */
.site-header{position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(0,100,180,0.18);background:rgba(10,10,20,0.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
.header-inner{max-width:1200px;margin:0 auto;padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between;}
.studio-wordmark{font-family:'Exo 2',sans-serif;font-weight:900;font-size:1.05rem;letter-spacing:7px;color:#fff;text-shadow:0 0 24px rgba(0,180,255,0.35);}
.site-nav{display:flex;gap:28px;}
.nav-link{font-family:'Rajdhani',sans-serif;font-size:0.62rem;letter-spacing:4px;color:#334455;text-decoration:none;transition:color 0.2s;}
.nav-link.active{color:#00ccff;}
.nav-link:hover{color:#5599bb;}

/* Main */
.catalog-main{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:80px 32px 120px;}
.catalog-label{font-size:0.58rem;letter-spacing:6px;color:#334455;margin-bottom:44px;font-family:'Rajdhani',sans-serif;}

/* Grid */
.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px;}

/* Cards */
.game-card{position:relative;background:#0f0f1e;border:1px solid #171730;border-radius:4px;overflow:hidden;transition:border-color 0.25s,transform 0.25s,box-shadow 0.25s;cursor:pointer;text-decoration:none;display:block;}
.game-card:hover{border-color:rgba(0,180,255,0.45);transform:translateY(-4px);box-shadow:0 20px 56px rgba(0,80,180,0.22),0 0 0 1px rgba(0,150,255,0.08);}
.game-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#00ccff,transparent);opacity:0;transition:opacity 0.3s;}
.game-card:hover::before{opacity:1;}

/* Card preview */
.card-preview{width:100%;aspect-ratio:16/9;overflow:hidden;background:#07070f;position:relative;}
.preview-canvas{width:100%;height:100%;display:block;}

/* Card body */
.card-body{padding:22px 26px 26px;}
.card-tag{font-size:0.5rem;letter-spacing:4px;color:#334455;margin-bottom:10px;font-family:'Rajdhani',sans-serif;}
.card-title{font-family:'Exo 2',sans-serif;font-weight:900;font-size:1.55rem;letter-spacing:4px;color:#fff;text-shadow:0 0 24px rgba(0,200,255,0.18);margin-bottom:11px;}
.card-desc{font-size:0.82rem;line-height:1.85;color:#5577aa;letter-spacing:0.3px;margin-bottom:22px;}
.card-play-btn{display:inline-block;font-family:'Exo 2',sans-serif;font-weight:900;font-size:0.72rem;letter-spacing:5px;color:#000;text-decoration:none;background:linear-gradient(135deg,#00ddff,#0077ff);padding:11px 34px;clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%);box-shadow:0 0 24px rgba(0,160,255,0.28);transition:transform 0.15s,box-shadow 0.15s;}
.card-play-btn:hover{transform:scale(1.05);box-shadow:0 0 44px rgba(0,200,255,0.52);}

/* Footer */
.site-footer{position:relative;z-index:1;text-align:center;padding:26px;border-top:1px solid rgba(0,50,100,0.18);}
.footer-copy{font-size:0.52rem;letter-spacing:4px;color:#1c2a38;font-family:'Rajdhani',sans-serif;}

@media(max-width:640px){
  .header-inner{padding:0 20px;}
  .studio-wordmark{font-size:0.82rem;letter-spacing:4px;}
  .catalog-main{padding:48px 20px 80px;}
  .game-grid{grid-template-columns:1fr;gap:20px;}
  .card-body{padding:18px 20px 22px;}
}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <span class="studio-wordmark">UMBRA DIRECTORATE</span>
    <nav class="site-nav">
      <a class="nav-link active" href="#">GAMES</a>
    </nav>
  </div>
</header>

<main class="catalog-main">
  <div class="catalog-label">CURRENT RELEASES</div>
  <div class="game-grid">

    <article class="game-card" data-game="warp-lane">
      <div class="card-preview">
        <canvas class="preview-canvas" id="preview-warp" width="320" height="180"></canvas>
      </div>
      <div class="card-body">
        <div class="card-tag">ARCADE &middot; INFINITE</div>
        <h2 class="card-title">WARP LANE</h2>
        <p class="card-desc">Pilot a hypership through endless neon corridors. Dodge. Boost. Survive.</p>
        <a class="card-play-btn" href="warp-lane.html">PLAY</a>
      </div>
    </article>

    <article class="game-card" data-game="alpine-rush">
      <div class="card-preview">
        <canvas class="preview-canvas" id="preview-alpine" width="320" height="180"></canvas>
      </div>
      <div class="card-body">
        <div class="card-tag">ACTION &middot; SKIING</div>
        <h2 class="card-title">ALPINE RUSH</h2>
        <p class="card-desc">Bomb the mountain at reckless speed. Flip. Dodge trees. Don't bail.</p>
        <a class="card-play-btn" href="alpine-rush/index.html">PLAY</a>
      </div>
    </article>

  </div>
</main>

<footer class="site-footer">
  <span class="footer-copy">UMBRA DIRECTORATE &middot; ALL RIGHTS RESERVED</span>
</footer>

<script>
/* ── WARP LANE PREVIEW ─────────────────────────────────────── */
function initWarpPreview(){
  const cnv=document.getElementById('preview-warp');
  if(!cnv)return;
  const ctx=cnv.getContext('2d');
  const W=320,H=180,LANES=5,laneW=W/LANES;
  let offset=0;
  const rocks=Array.from({length:4},(_,i)=>({
    lane:i%LANES, y:(i/4)*H-20,
    rot:Math.random()*Math.PI*2,
    size:9+Math.random()*5,
    hue:195+Math.floor(Math.random()*40),
    spd:0.9+Math.random()*0.5,
  }));
  function frame(){
    ctx.fillStyle='#00020e'; ctx.fillRect(0,0,W,H);
    offset=(offset+1.4)%(28+36);
    // lane borders
    for(let i=0;i<=LANES;i++){
      const x=i*laneW;
      ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);
      ctx.strokeStyle=(i===0||i===LANES)?'rgba(0,180,255,0.35)':'rgba(0,100,180,0.16)';
      ctx.lineWidth=(i===0||i===LANES)?2:1;ctx.stroke();
    }
    // dashed center lines
    ctx.strokeStyle='rgba(0,120,200,0.12)';ctx.lineWidth=1;
    ctx.setLineDash([36,28]);ctx.lineDashOffset=-offset;
    for(let i=0;i<LANES;i++){
      const cx=laneW*i+laneW/2;
      ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,H);ctx.stroke();
    }
    ctx.setLineDash([]);
    // obstacles
    rocks.forEach(r=>{
      r.y+=r.spd; r.rot+=0.018;
      if(r.y>H+20) r.y=-20;
      ctx.save();ctx.translate(laneW*r.lane+laneW/2,r.y);ctx.rotate(r.rot);
      ctx.beginPath();
      for(let i=0;i<8;i++){
        const a=(i/8)*Math.PI*2,rad=r.size*(0.7+Math.sin(i*2.3+1.2)*0.3);
        i===0?ctx.moveTo(Math.cos(a)*rad,Math.sin(a)*rad):ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad);
      }
      ctx.closePath();
      ctx.fillStyle='#080818';ctx.fill();
      ctx.strokeStyle=`hsl(${r.hue},75%,58%)`;ctx.lineWidth=1.5;
      ctx.shadowBlur=10;ctx.shadowColor=`hsl(${r.hue},80%,50%)`;ctx.stroke();
      ctx.shadowBlur=0;ctx.restore();
    });
    // mini ship
    ctx.save();ctx.translate(W/2,H*0.78);
    ctx.shadowBlur=14;ctx.shadowColor='#0088ff';
    ctx.fillStyle='#050520';
    ctx.beginPath();
    ctx.moveTo(0,-12);ctx.lineTo(6,4);ctx.lineTo(4,8);ctx.lineTo(0,6);ctx.lineTo(-4,8);ctx.lineTo(-6,4);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle='#00ccff';ctx.lineWidth=1;ctx.stroke();
    ctx.shadowBlur=0;ctx.restore();
    requestAnimationFrame(frame);
  }
  frame();
}

/* ── ALPINE RUSH PREVIEW ───────────────────────────────────── */
function initAlpinePreview(){
  const cnv=document.getElementById('preview-alpine');
  if(!cnv)return;
  const ctx=cnv.getContext('2d');
  const W=320,H=180;
  let skierX=W*0.72;
  const snow=Array.from({length:22},()=>({x:Math.random()*W,y:Math.random()*H*0.68,r:1+Math.random()*1.2}));
  function frame(){
    // Sky gradient
    const sky=ctx.createLinearGradient(0,0,0,H*0.7);
    sky.addColorStop(0,'#87ceeb');sky.addColorStop(1,'#d8eef8');
    ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
    // Mountain peaks
    ctx.fillStyle='#c8d8e8';
    [[40,90,82,28,132,90],[124,90,162,18,214,90],[202,90,244,33,294,90]].forEach(([x1,y1,xp,yp,x2,y2])=>{
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(xp,yp);ctx.lineTo(x2,y2);ctx.closePath();ctx.fill();
    });
    // Snow caps
    ctx.fillStyle='#f2f9ff';
    [[82,28,0.032],[162,18,0.042],[244,33,0.028]].forEach(([px,py,s])=>{
      ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px-s*W,py+H*0.068);ctx.lineTo(px+s*W,py+H*0.068);ctx.closePath();ctx.fill();
    });
    // Pine silhouettes
    ctx.fillStyle='#2a4a2a';
    [55,98,138,178,218,258].forEach((tx,i)=>{
      const sc=0.72+(i%3)*0.1;
      const by=H*0.635;
      ctx.beginPath();ctx.moveTo(tx,by-22*sc);ctx.lineTo(tx-8*sc,by);ctx.lineTo(tx+8*sc,by);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(tx,by-14*sc);ctx.lineTo(tx-6*sc,by+8*sc);ctx.lineTo(tx+6*sc,by+8*sc);ctx.closePath();ctx.fill();
    });
    // Slope surface
    const slope=ctx.createLinearGradient(0,H*0.68,0,H);
    slope.addColorStop(0,'#f0f6ff');slope.addColorStop(1,'#d8eaf8');
    ctx.fillStyle=slope;ctx.fillRect(0,H*0.68,W,H*0.32+1);
    // Snow particles
    snow.forEach(p=>{
      p.y+=0.38;if(p.y>H*0.68)p.y=0;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,0.85)';ctx.fill();
    });
    // Skier figure
    skierX-=0.65;if(skierX<-24)skierX=W+24;
    const sy=H*0.705+(W*0.5-skierX)*0.055;
    ctx.save();ctx.translate(skierX,sy);
    // Skis
    ctx.strokeStyle='#1a2a3a';ctx.lineWidth=3;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(-14,13);ctx.lineTo(14,13);ctx.stroke();
    ctx.strokeStyle='#4488cc';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(-14,12);ctx.lineTo(14,12);ctx.stroke();
    // Legs
    ctx.strokeStyle='#1a3a6e';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(-3,0);ctx.lineTo(-5,12);ctx.stroke();
    ctx.beginPath();ctx.moveTo(3,0);ctx.lineTo(5,12);ctx.stroke();
    // Body
    ctx.fillStyle='#cc2222';
    ctx.beginPath();ctx.roundRect(-7,-18,14,20,2);ctx.fill();
    // Arms
    ctx.strokeStyle='#cc2222';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(-7,-12);ctx.lineTo(-15,-2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(7,-12);ctx.lineTo(15,-2);ctx.stroke();
    // Head
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(0,-24,6,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(100,180,255,0.5)';
    ctx.beginPath();ctx.arc(2,-22,4,-0.3,Math.PI*0.6);ctx.fill();
    ctx.restore();
    requestAnimationFrame(frame);
  }
  frame();
}

document.addEventListener('DOMContentLoaded',()=>{
  initWarpPreview();
  initAlpinePreview();
});
</script>
</body>
</html>
